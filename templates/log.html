<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercise Log — {{ user }}</title>
<script src="/static/theme.js?v=5"></script>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/saira-memjYa2wxmKQyPMrZX79wwYZQMhsyuSLiIvS.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIflMapbsEk7TDLdtEz1BwkebIl1R5_F.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIflMapbsEk7TDLdtEz1BwkeQI51R5_F.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIf6MapbsEk7TDLdtEz1BwkWn6pg.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/michroma-PN_zRfy9qWD8fEagAPg9pTk.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/sharetechmono-J7aHnp1uDWRBEqV98dVQztYldFcLowEF.woff2">
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/sortie/tokens.css?v=1">
<link rel="stylesheet" href="/static/sortie/sortie.css?v=1">
<link rel="stylesheet" href="/static/gym.css?v=6">
<style>
  main { padding: var(--space-5) var(--space-4); max-width: 720px; margin: 0 auto;
         padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom)); }
  .intro { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin: var(--space-1) 0 var(--space-4); }
  .muted { color: var(--ink-muted); }
  .empty { background: var(--panel); border: var(--hairline) solid var(--line);
           padding: var(--space-4); font-size: 13px; color: var(--ink-muted); line-height: 18px; }
  .empty b a { color: var(--corp); }

  /* toolbar with the global expand/collapse control */
  .toolbar { display: flex; justify-content: flex-end; margin: 0 0 var(--space-3); }

  /* One collapsible card per exercise, holding its stacked notes. */
  .ex { background: var(--panel); border-top: var(--hairline) solid var(--line);
        border-bottom: var(--hairline) solid var(--line); margin-bottom: var(--space-4); }
  .ex__head { display: flex; align-items: center; gap: var(--space-3); cursor: pointer;
              list-style: none; user-select: none;
              padding: var(--space-3) var(--space-4); border-bottom: var(--hairline) solid var(--line); }
  .ex:not([open]) > .ex__head { border-bottom: 0; }
  .ex__head::-webkit-details-marker { display: none; }
  .ex__caret { flex: none; color: var(--ink-muted); font-family: var(--font-mono); font-size: 12px; }
  .ex[open] > .ex__head .ex__caret { transform: rotate(90deg); }
  .ex__name { font-family: var(--font-display); font-size: 16px; line-height: 20px;
              font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  .ex__count { margin-left: auto; font-family: var(--font-mono); font-size: 12px;
               line-height: 16px; color: var(--ink-muted); white-space: nowrap;
               background: var(--bg-200); border: var(--hairline) solid var(--line);
               padding: 2px var(--space-2); }

  .entry { padding: var(--space-3) var(--space-4); border-top: var(--hairline) solid var(--line); }
  .entry:first-of-type { border-top: 0; }
  .entry__title { font-family: var(--font-label); font-size: 10px; line-height: 14px;
                  letter-spacing: .18em; text-transform: uppercase; color: var(--ink-muted);
                  margin-bottom: var(--space-2); }
  .entry__body { font-size: 15px; line-height: 22px; white-space: pre-wrap;
                 overflow-wrap: break-word; }
  .entry__foot { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); }
  .ts { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-faint); }
  .del { margin-left: auto; background: transparent; border: var(--hairline) solid var(--line);
         color: var(--ink-muted); cursor: pointer; font-family: var(--font-body);
         font-size: 13px; line-height: 18px; padding: 2px var(--space-2); }
  .del:hover { border-color: var(--target); color: var(--target); }
</style>
</head>
<body class="srt srt-ground">
<header class="srt-appbar">
  <div class="srt-appbar-bar">
    <h1 class="srt-appbar-title">Log</h1>
    <span class="srt-tag is-chapter">//{{ user }}</span>
    <span class="srt-appbar-spacer"></span>
    <details class="srt-menu">
      <summary>Menu</summary>
      <nav class="srt-menu-panel">
        <a href="{{ chat_url }}">Chat</a>
        <a href="{{ chat_url }}/workout">Workout</a>
        <a href="{{ chat_url }}/review">Review</a>
        <a href="{{ chat_url }}/stats">Stats</a>
        <a aria-current="page" href="{{ chat_url }}/log">Log</a>
        <a href="{{ chat_url }}/settings">Settings</a>
      </nav>
    </details>
  </div>
</header>
<main id="main">
  <div class="srt-boot">
    <div class="srt-boot-label"><span>Loading</span><span class="srt-boot-sys">//log</span></div>
    <div class="srt-boot-track"></div>
    <div class="srt-boot-micro">reading exercise notes</div>
  </div>
</main>
<script>
const DATA_URL = "{{ data_url }}";
const DEL_URL  = "{{ del_url }}";
const CHAT_URL = "{{ chat_url }}";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmtTs(iso) {
  if (!iso) return "";
  const d = new Date(iso.replace(" ", "T"));
  if (isNaN(d)) return iso;
  const t = d.toLocaleTimeString("en", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (d.toDateString() === new Date().toDateString()) return "today · " + t;
  return d.toLocaleDateString("en", { day: "2-digit", month: "short", year: "2-digit" }) + " · " + t;
}

function entryEl(ex, e) {
  const box = el("div", "entry");
  box.appendChild(el("div", "entry__title", e.title));
  box.appendChild(el("div", "entry__body", e.content));
  const foot = el("div", "entry__foot");
  foot.appendChild(el("div", "ts", fmtTs(e.ts)));
  const del = el("button", "del", "Delete");
  del.type = "button";
  del.addEventListener("click", async () => {
    del.disabled = true;
    try {
      const r = await fetch(DEL_URL + "/" + e.id, { method: "POST" });
      if (!r.ok) throw new Error();
      const card = box.closest(".ex");
      box.remove();
      // Drop the whole exercise card once its last note is gone.
      if (card && !card.querySelector(".entry")) card.remove();
      const main = document.getElementById("main");
      if (!main.querySelector(".ex")) renderEmpty(main);
      else { updateCounts(); refreshToggleLabel(); }
    } catch (ex2) {
      del.disabled = false;
      del.textContent = "Retry";
    }
  });
  foot.appendChild(del);
  box.appendChild(foot);
  return box;
}

function updateCounts() {
  for (const card of document.querySelectorAll(".ex")) {
    const n = card.querySelectorAll(".entry").length;
    const c = card.querySelector(".ex__count");
    if (c) c.textContent = n + (n === 1 ? " note" : " notes");
  }
}

function allOpen() {
  const cards = [...document.querySelectorAll(".ex")];
  return cards.length > 0 && cards.every(d => d.open);
}

function refreshToggleLabel() {
  const btn = document.getElementById("toggle-all");
  if (btn) btn.textContent = allOpen() ? "Collapse all" : "Expand all";
}

function renderEmpty(main) {
  main.textContent = "";
  main.appendChild(el("p", "intro",
    "Notes your coach saves about specific exercises land here, so you can look them "
    + "back up any time without re-asking."));
  const box = el("div", "empty");
  box.innerHTML = "Nothing logged yet. Ask your coach about an exercise in the "
    + "<b><a href=\"" + CHAT_URL + "\">chat</a></b> — "
    + "form, grip, how to progress it, why it's in your programme — and the key "
    + "takeaway gets saved here for reference.";
  main.appendChild(box);
}

function render(d) {
  const main = document.getElementById("main");
  main.textContent = "";
  main.classList.add("srt-reveal");
  setTimeout(() => main.classList.remove("srt-reveal"), 700);
  const groups = d.exercises || [];
  if (!groups.length) { renderEmpty(main); return; }

  main.appendChild(el("p", "intro",
    "Reference notes your coach has saved about your exercises. Ask about any movement "
    + "in the chat and the key points get logged here for you to refer back to."));

  const toolbar = el("div", "toolbar");
  const toggle = el("button", "srt-btn is-quiet", "Expand all");
  toggle.id = "toggle-all";
  toggle.type = "button";
  toggle.addEventListener("click", () => {
    const open = !allOpen();
    document.querySelectorAll(".ex").forEach(d => { d.open = open; });
    refreshToggleLabel();
  });
  toolbar.appendChild(toggle);
  main.appendChild(toolbar);

  for (const g of groups) {
    const card = el("details", "ex");            // collapsed by default (no `open`)
    const head = el("summary", "ex__head");
    head.appendChild(el("span", "ex__caret", "›"));
    head.appendChild(el("div", "ex__name", g.exercise));
    const n = g.entries.length;
    head.appendChild(el("div", "ex__count", n + (n === 1 ? " note" : " notes")));
    card.appendChild(head);
    for (const e of g.entries) card.appendChild(entryEl(g.exercise, e));
    // keep the global button's label in sync when a card is toggled individually
    card.addEventListener("toggle", refreshToggleLabel);
    main.appendChild(card);
  }
  refreshToggleLabel();
}

fetch(DATA_URL)
  .then(r => r.json())
  .then(d => { if (d.error) throw new Error(d.error); render(d); })
  .catch(e => {
    document.getElementById("main").innerHTML =
      '<p class="muted">Could not load your log (' + e.message + ').</p>';
  });
</script>
</body>
</html>
