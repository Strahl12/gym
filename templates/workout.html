// ── Info sheet (tap a thumbnail): animation, muscles, steps + coach chat ──
// First open generates via Haiku and caches to the Log tab; afterwards it's
// instant. Follow-up questions are one-shot, answered in the sheet only.
function openHowTo(name) {
  openSheet((sheet, close) => {
    sheet.classList.add("sheet--howto");
    sheet.appendChild(el("div", "sheet__title", name));
    sheetClose(sheet, close);

    // Everything between the title and the ask bar scrolls as ONE region,
    // contained so it never drags the workout behind it.
    const scroller = el("div", "howto__scroll");

    // Visuals from the vendored library: the movement loop (tap to pause)
    // beside the spinning muscle figure, then the written steps.
    const le = EXLIB[name];
    const cat = CATALOG && CATALOG.items.find(i => i.name === name);
    const primary = (le && le.primary.length) ? le.primary : (cat && cat.muscle ? [cat.muscle] : []);
    const secondary = (le && le.secondary) || [];
    if ((le && le.img) || primary.length) {
      const vis = el("div", "howto__vis");
      if (le && le.img) {
        // The movement loop: GIF while playing, the still when paused.
        const anim = el("div", "howto__anim");
        const img = el("img", "gv-media"); img.alt = name;
        anim.appendChild(img);
        const setPlay = on => {
          anim.classList.toggle("is-paused", !on);
          img.src = (on && le.gif) ? gvGif(name) : gvStill(name);
        };
        anim.addEventListener("click", () => setPlay(anim.classList.contains("is-paused")));
        // Always start playing — the loop IS the content here (tap pauses).
        setPlay(!!le.gif);
        vis.appendChild(anim);
      }
      if (primary.length) {
        // Turntable: front/back views as the outer faces plus stacked
        // silhouette layers in between for thickness — an extruded body
        // slowly rotating about the vertical axis.
        const fig3d = el("div", "mfig3d");
        const inner = el("div", "mfig3d-inner");
        for (let z = -6; z <= 6; z += 3) {
          const mid = muscleSvg(z < 0 ? "back" : "front", [], []);
          mid.classList.add("is-mid");
          mid.style.transform = "translateZ(" + z + "px)" + (z < 0 ? " rotateY(180deg)" : "");
          inner.appendChild(mid);
        }
        const front = muscleSvg("front", primary, secondary);
        front.classList.add("is-front");
        inner.appendChild(front);
        const back = muscleSvg("back", primary, secondary);
        back.classList.add("is-back");
        inner.appendChild(back);
        fig3d.appendChild(inner);
        vis.appendChild(fig3d);
      }
      scroller.appendChild(vis);
      if (primary.length) {
        const m = el("p", "howto__muscles");
        m.append("Primary » ");
        m.appendChild(el("b", null, primary.join(", ")));
        if (secondary.length) {
          m.append("  ·  secondary » ");
          m.appendChild(el("i", null, secondary.join(", ")));
        }
        scroller.appendChild(m);
      }
      if (le && le.instructions && le.instructions.length) {
        const steps = el("ol", "howto__steps");
        le.instructions.forEach(s => steps.appendChild(el("li", null, s)));
        scroller.appendChild(steps);
      }
      if (le && le.img) {
        scroller.appendChild(el("p", "howto__credit", "Illustration © Gym visual — gymvisual.com"));
      }
    }

    const thread = el("div", "howto__thread");
    scroller.appendChild(thread);
    sheet.appendChild(scroller);
    const ask = el("div", "howto__ask");
    const inp = el("input", "howto__inp"); inp.type = "text";
    inp.placeholder = "Ask a follow-up (grip, depth, pain…)";
    const btn = el("button", "howto__send", "Ask"); btn.type = "button";
    ask.appendChild(inp); ask.appendChild(btn);
    sheet.appendChild(ask);

    // followScroll: only follow-ups the athlete typed jump the view to the
    // answer — the intro breakdown must leave the sheet at the top (the
    // animation and steps are the first thing to see).
    const query = async (payload, bubble, followScroll) => {
      try {
        const r = await fetch(HOWTO_URL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        if (!r.ok || d.error) throw new Error(d.error || r.statusText);
        bubble.textContent = d.text;
      } catch (e) {
        bubble.textContent = "Couldn\u2019t answer \u2014 " + e.message;
      }
      if (followScroll) scroller.scrollTop = scroller.scrollHeight;
    };

    const intro = el("div", "howto__a", "Getting the breakdown from your coach…");
    thread.appendChild(intro);
    query({ name }, intro, false);

    const send = async () => {
      const q = inp.value.trim();
      if (!q || btn.disabled) return;
      inp.value = "";
      thread.appendChild(el("div", "howto__q", q));
      const a = el("div", "howto__a", "…");
      thread.appendChild(a);
      scroller.scrollTop = scroller.scrollHeight;
      btn.disabled = true;
      await query({ name, question: q }, a, true);
      btn.disabled = false;
    };
    btn.addEventListener("click", send);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); send(); } });
  });
}

// ── Classify-on-add: an exercise not in the library → Claude works out what it is,
// asks a question if the name's unclear, then saves it so it's known next time. ──
async function pickInto(mex, name, isBw, rerender) {
  mex.exercise_name = name;
  mex.is_bodyweight = !!isBw;
  mex.setup = SETUPS[name] || "";
  await seedFromHistory(mex);
  saveDraft(); rerender();
}

async function addUnknownExercise(mex, name, rerender) {
  let res;
  try {
    const r = await fetch(CLASSIFY_URL, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }) });
    res = await r.json();
    if (res.error) throw new Error(res.error);
  } catch (e) {
    await pickInto(mex, name, false, rerender);   // classify down — use the raw name
    return;
  }
  if (res.known) { await pickInto(mex, res.name, res.is_bodyweight, rerender); return; }
  openClassifySheet(mex, name, res, rerender);
}

function openClassifySheet(mex, name, res, rerender) {
  openSheet((sheet, close) => {
    sheet.appendChild(el("div", "sheet__title", "Add “" + name + "”"));
    sheet.appendChild(el("div", "sheet__sub", "New exercise — Claude classified it as:"));
    const info = el("div", "classify-info");
    const paint = r => {
      info.textContent = "";
      const line = (k, v) => { const d = el("div", "classify-row");
        d.appendChild(el("span", "classify-k", k));
        d.appendChild(el("span", "classify-v", (v || "—").toString().replace(/_/g, " ")));
        info.appendChild(d); };
      line("Muscle", r.muscle); line("Equipment", r.equipment);
      line("Type", r.exercise_type); if (r.session_type) line("Day", r.session_type);
    };
    paint(res);
    sheet.appendChild(info);

    if (res.question) {
      sheet.appendChild(el("div", "classify-q", res.question));
      const hint = el("input", "exnote"); hint.type = "text";
      hint.placeholder = "Answer to refine (optional)…";
      sheet.appendChild(hint);
      const refine = el("button", "sheet__clear", "↻ Re-check with my answer"); refine.type = "button";
      refine.addEventListener("click", async () => {
        refine.textContent = "Re-checking…";
        try {
          const r = await fetch(CLASSIFY_URL, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, hint: hint.value }) });
          const d = await r.json();
          if (!d.error) { res = d; paint(d); }
        } catch (e) {}
        refine.textContent = "↻ Re-check with my answer";
      });
      sheet.appendChild(refine);
    }

    const err = el("div", "classify-q"); err.style.display = "none";
    sheet.appendChild(err);
    const use = el("button", "sheet__done", "Use it"); use.type = "button";
    use.addEventListener("click", async () => {
      use.disabled = true; use.textContent = "Saving…";
      let saved = false;
      try {
        const r = await fetch(CLASSIFY_URL, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, save: true, meta: res }) });
        const d = await r.json().catch(() => ({}));
        saved = r.ok && !d.error;
      } catch (e) {}
      if (!saved) {
        err.textContent = "Couldn't save — check your connection and try again.";
        err.style.display = "";
        use.disabled = false; use.textContent = "Use it";
        return;
      }
      if (CATALOG) {
        CATALOG.items.push({ name, muscle: (res.muscle || "").replace(/_/g, " "), equipment: res.equipment });
        if (res.is_bodyweight) CATALOG.bw.add(name);
      }
      close();
      await pickInto(mex, name, res.is_bodyweight, rerender);
    });
    sheet.appendChild(use);
    const cancel = el("button", "sheet__clear", "Cancel"); cancel.type = "button";
    cancel.addEventListener("click", () => {
      close();
      // A freshly-added card that never got a name is useless — drop it.
      if (!mex.exercise_name) {
        const i = MODEL.indexOf(mex);
        if (i >= 0) { MODEL.splice(i, 1); saveDraft(); rerender(); }
      }
    });
    sheet.appendChild(cancel);
  });
}

// Build the editable model from the prescribed workout.
function modelFromPrescription(w) {
  return (w.exercises || []).map(ex => ({
    exercise_name: ex.exercise_name,
    is_bodyweight: isBodyweight(ex),
    rest_seconds: ex.rest_seconds || 90,
    alternates: (ex.alternates || []).slice(),
    predicted_rpe: ex.predicted_rpe,
    setup: SETUPS[ex.exercise_name] || "",
    notes: ex.notes || "",
    previous: (ex.previous && ex.previous.sets) || [],
    prev_date: (ex.previous && ex.previous.date) || "",
    sets: (ex.sets || []).map(s => ({
      weight: s.weight_kg || 0, reps: s.reps || 0, rpe: "",
      type: s.is_warmup ? "warmup" : "normal", done: false,
    })),
  }));
}
// Overlay a saved/logged session (matched by exercise name) onto the model.
function overlaySaved(model, logged) {
  const byName = {};
  (logged.exercises || []).forEach(e => { byName[e.exercise_name] = e.sets; });
  model.forEach(m => {
    const saved = byName[m.exercise_name];
    if (saved) m.sets = saved.map(s => ({
      weight: s.weight_kg || 0, reps: s.reps || 0,
      rpe: s.rpe == null ? "" : s.rpe,
      type: s.set_type || (s.is_warmup ? "warmup" : "normal"), done: true,
    }));
  });
  return model;
}

// One line of the PREVIOUS column: "90 kg × 6 @ 7" from the last session's
// set at the same position, or null if there is none.
function prevLabel(prev, mex) {
  if (!prev || !(prev.reps > 0)) return null;
  const w = prev.weight_kg || 0;
  const load = mex.is_bodyweight ? (w > 0 ? "BW+" + w : "BW") : w + "kg";
  return load + "×" + prev.reps + (prev.rpe != null ? " @" + prev.rpe : "");
}

// Hevy-style table row: [type badge] [previous] [kg] [reps] [rpe] [✓].
// Removing a set lives in the set-type sheet (tap the badge).
function setRow(mset, mex, rerender, rowIdx, workingNo) {
  const row = el("div", "sett" + (mset.done ? " is-done" : ""));

  // Set-type badge — W / working-set number / F / D; opens the classifier sheet.
  const t = SET_TYPE_BY[setType(mset)] || SET_TYPE_BY.normal;
  const badge = el("button", "st-badge " + t.cls,
    setType(mset) === "normal" ? String(workingNo) : t.badge);
  badge.type = "button";
  badge.title = "Set type / remove set";
  badge.addEventListener("click", () => openSetType(mset, mex, rerender));
  row.appendChild(badge);

  // PREVIOUS — tap to copy last session's numbers into this set.
  const prev = (mex.previous || [])[rowIdx];
  const plabel = prevLabel(prev, mex);
  const pcell = el("button", "prevcell", plabel || "—");
  pcell.type = "button";
  pcell.disabled = !plabel;
  if (plabel) {
    pcell.title = "Use last session's numbers" + (mex.prev_date ? " (" + mex.prev_date + ")" : "");
    pcell.addEventListener("click", () => {
      mset.weight = prev.weight_kg || 0;
      mset.reps = prev.reps || 0;
      saveDraft(); rerender();
    });
  }
  row.appendChild(pcell);

  // Highlight the whole value on focus so a new number types straight over it.
  const selectAll = inp => inp.addEventListener("focus", () => { try { inp.select(); } catch (e) {} });

  const w = el("input"); w.type = "number"; w.step = "2.5"; w.min = "0";
  w.value = mset.weight || ""; w.placeholder = mex.is_bodyweight ? "BW+" : "kg";
  w.inputMode = "decimal"; selectAll(w);
  w.addEventListener("input", () => { mset.weight = parseFloat(w.value) || 0; saveDraft(); });
  row.appendChild(w);

  const reps = el("input"); reps.type = "number"; reps.step = "1"; reps.min = "0";
  reps.value = mset.reps || ""; reps.placeholder = "reps"; reps.inputMode = "numeric"; selectAll(reps);
  reps.addEventListener("input", () => { mset.reps = parseInt(reps.value) || 0; saveDraft(); });
  row.appendChild(reps);

  const has = mset.rpe !== "" && mset.rpe != null;
  const rpeCell = el("button", "rpe-cell" + (has ? "" : " empty"),
    has ? String(mset.rpe) : (mex.predicted_rpe && !isWarm(mset) ? "~" + mex.predicted_rpe : "RPE"));
  rpeCell.type = "button";
  rpeCell.title = mex.predicted_rpe ? "Log RPE (expected ~" + mex.predicted_rpe + ")" : "Log RPE";
  rpeCell.addEventListener("click", () => openRpe(mset, rerender, mex.predicted_rpe));
  row.appendChild(rpeCell);

  // Complete-set tick on the right — done turns the row green and arms the
  // rest timer (working sets only).
  const done = el("button", "donebtn", "✓"); done.type = "button";
  done.title = "Mark set completed";
  done.setAttribute("aria-pressed", mset.done ? "true" : "false");
  done.addEventListener("click", () => {
    mset.done = !mset.done; saveDraft();
    row.classList.toggle("is-done", mset.done);
    done.setAttribute("aria-pressed", mset.done ? "true" : "false");
    if (mset.done && !isWarm(mset)) RT.start(mex.rest_seconds || 90, mex.exercise_name);
  });
  row.appendChild(done);

  return row;
}

// Column headings row, same grid as the set rows.
function setTableHead(mex) {
  const h = el("div", "sett sett-head");
  h.appendChild(el("span", null, "Set"));
  h.appendChild(el("span", "h-prev", "Prev"));
  h.appendChild(el("span", null, mex.is_bodyweight ? "+kg" : "kg"));
  h.appendChild(el("span", null, "Reps"));
  h.appendChild(el("span", null, "RPE"));
  h.appendChild(el("span", null, "✓"));
  return h;
}

// Optional stretch routine: accent (orange) marks it as optional, a single
// toggle records did / didn't — no sets, reps or details.
function stretchCard(label, st, rerender) {
  const card = el("div", "stretchcard" + (st.done ? " is-done" : ""));
  const head = el("div", "stretchcard__head");
  head.appendChild(el("p", "srt-eyebrow stretchcard__eyebrow", label + " — optional"));
  const btn = el("button", "stretchcard__btn", st.done ? "✓ Done" : "Mark done");
  btn.type = "button";
  btn.addEventListener("click", () => { st.done = !st.done; saveStretchDraft(); rerender(); });
  head.appendChild(btn);
  card.appendChild(head);
  const list = el("div", "stretchcard__list");
  st.items.forEach(n => list.appendChild(el("span", "stretchcard__item", n)));
  card.appendChild(list);
  return card;
}

function loggerCard(mex, rerender) {
  const card = el("div", "ex logging");
  const head = el("div", "ex__head");

  // Thumbnail and name both open the info sheet.
  const title = el("div", "ex__title");
  title.appendChild(exThumb(mex.exercise_name, "", "ex__thumb",
    () => openHowTo(mex.exercise_name)));
  const name = el("button", "ex__name", mex.exercise_name); name.type = "button";
  name.title = "How to perform this movement";
  name.addEventListener("click", () => openHowTo(mex.exercise_name));
  title.appendChild(name);
  head.appendChild(title);
  const actions = el("div", "ex__actions");
  const swap = el("button", "ex__ctl", "⇄"); swap.type = "button";
  swap.title = "Swap this exercise";
  swap.addEventListener("click", async () => {
    await loadCatalog();
    openExercisePicker(
      { title: "Swap exercise",
        suggested: (mex.alternates || []).filter(a => a && a !== mex.exercise_name) },
      async (name, isNew) => {
        if (isNew) await addUnknownExercise(mex, name, rerender);
        else await pickInto(mex, name, CATALOG.bw.has(name), rerender);
      });
  });
  const del = el("button", "ex__ctl del", "✕"); del.type = "button";
  del.title = "Remove exercise";
  del.addEventListener("click", () => {
    if (mex.sets.some(s => s.done) &&
        !confirm("Remove " + mex.exercise_name + " and its logged sets?")) return;
    MODEL.splice(MODEL.indexOf(mex), 1); saveDraft(); rerender();
  });
  actions.appendChild(swap); actions.appendChild(del);
  head.appendChild(actions);
  card.appendChild(head);

  // Chip row: rest timer + notes toggle (Hevy's Rest / Note chips).
  const chips = el("div", "exchips");
  const restChip = el("button", "chipbtn",
    "Rest " + RT.fmt(mex.rest_seconds || 90)); restChip.type = "button";
  restChip.title = "Start the rest timer";
  restChip.addEventListener("click", () => RT.start(mex.rest_seconds || 90, mex.exercise_name));
  chips.appendChild(restChip);
  const hasNotes = !!((mex.setup || "").trim() || (mex.note || "").trim());
  if (hasNotes) mex.show_notes = true;
  const noteChip = el("button", "chipbtn" + (mex.show_notes ? " on" : ""), "Note");
  noteChip.type = "button"; noteChip.title = "Setup + session note";
  noteChip.addEventListener("click", () => { mex.show_notes = !mex.show_notes;
    saveDraft(); rerender(); });
  chips.appendChild(noteChip);
  card.appendChild(chips);

  // The coach's prescription note, kept visible while logging.
  if (mex.notes) card.appendChild(el("div", "lognote", mex.notes));

  if (mex.show_notes) {
    const setup = el("input", "exnote exsetup"); setup.type = "text";
    setup.placeholder = "Setup — seat / pin / pad numbers (saved for next time)";
    setup.value = mex.setup || "";
    setup.addEventListener("input", () => { mex.setup = setup.value; saveDraft(); });
    card.appendChild(setup);

    const note = el("input", "exnote"); note.type = "text";
    note.placeholder = "Tag a note (form cue, pain, felt easy…)";
    note.value = mex.note || "";
    note.addEventListener("input", () => { mex.note = note.value; saveDraft(); });
    card.appendChild(note);
  }

  if (mex.sets.length) card.appendChild(setTableHead(mex));
  let workingNo = 0;
  mex.sets.forEach((mset, i) => {
    if (setType(mset) === "normal") workingNo += 1;
    card.appendChild(setRow(mset, mex, rerender, i, workingNo));
  });

  const add = el("button", "addset", "＋ Add set"); add.type = "button";
  add.addEventListener("click", () => {
    const last = mex.sets[mex.sets.length - 1];
    mex.sets.push(last
      ? { weight: last.weight, reps: last.reps, rpe: "", type: "normal", done: false }
      : { weight: 0, reps: 0, rpe: "", type: "normal", done: false });
    saveDraft(); rerender();
  });
  card.appendChild(add);
  return card;
}

async function enterLogging(w) {
  LOGGING = true;
  REVEAL_LOG = true;
  loadCatalog();                         // fire-and-forget; datalist ready shortly
  await loadSetups();                    // saved seat/pin numbers, before we build the model
  MODEL = modelFromPrescription(w);
  const st = w.stretches || {};
  STRETCH = loadStretchDraft() || {
    pre:  { items: st.pre || [],  done: false },
    post: { items: st.post || [], done: false },
  };
  const draft = loadDraft();
  if (draft && draft.length) {
    // Unsaved edits win, but graft the fresh server-side context (PREVIOUS
    // column, coach notes) onto them — older drafts won't have it.
    const fresh = {};
    MODEL.forEach(m => { fresh[m.exercise_name] = m; });
    draft.forEach(m => {
      const f = fresh[m.exercise_name];
      if (!f) return;
      if (!m.previous || !m.previous.length) { m.previous = f.previous; m.prev_date = f.prev_date; }
      if (m.notes == null) m.notes = f.notes;
    });
    MODEL = draft;
  } else {
    try {                                // else seed from an already-saved session
      const qs = CURRENT && CURRENT.date ? "?date=" + encodeURIComponent(CURRENT.date) : "";
      const r = await fetch(LOGGED_URL + qs);
      const d = await r.json();
      if (d.logged) overlaySaved(MODEL, d.logged);
    } catch (e) {}
  }
  renderLogger(w);
}

function renderLogger(w) {
  document.body.classList.add("logging-active");
  const mainEl = document.getElementById("main");
  if (REVEAL_LOG) {
    REVEAL_LOG = false;
    mainEl.classList.add("srt-reveal");
    setTimeout(() => mainEl.classList.remove("srt-reveal"), 700);
  }
  const keepY = window.scrollY;
  const main = document.getElementById("main");
  main.textContent = "";

  const status = el("div", "logstatus");

  // Sticky header: elapsed clock + Finish (the one amber action while logging).
  const top = el("div", "logtop");
  const clockBox = el("div");
  clockBox.appendChild(el("div", "logtop__label", "Logging — " + (w.title || "session")));
  const clock = el("div", "logtop__clock", "0:00"); clock.id = "logclock";
  clockBox.appendChild(clock);
  top.appendChild(clockBox);
  const finish = el("button", "logtop__finish", "Finish"); finish.type = "button";
  finish.addEventListener("click", () => saveSession(w, finish, status));
  top.appendChild(finish);
  main.appendChild(top);

  sessionStart();          // stamp the session start (drives the header clock)
  RT.showBar();
  if (loadDraft()) main.appendChild(el("div", "draftflag", "Unsaved draft restored"));

  const rerender = () => renderLogger(w);
  if (STRETCH && STRETCH.pre.items.length)
    main.appendChild(stretchCard("Warm-up stretches", STRETCH.pre, rerender));
  MODEL.forEach(mex => main.appendChild(loggerCard(mex, rerender)));
  if (STRETCH && STRETCH.post.items.length)
    main.appendChild(stretchCard("Cool-down stretches", STRETCH.post, rerender));

  const addEx = el("button", "addex", "＋ Add exercise"); addEx.type = "button";
  addEx.addEventListener("click", async () => {
    await loadCatalog();
    openExercisePicker({ title: "Add exercise" }, async (name, isNew) => {
      // New exercises default to 4 sets; seedFromHistory fills weight/reps
      // from the last logged session of this movement.
      const mex = { exercise_name: "", is_bodyweight: false, rest_seconds: 90,
                    alternates: [], setup: "",
                    sets: Array.from({ length: 4 }, () =>
                      ({ weight: 0, reps: 0, rpe: "", type: "normal", done: false })) };
      MODEL.push(mex);
      if (isNew) await addUnknownExercise(mex, name, rerender);
      else await pickInto(mex, name, CATALOG.bw.has(name), rerender);
    });
  });
  main.appendChild(addEx);

  const bar = el("div", "logbar");
  const cancel = el("button", "cancel", "Cancel"); cancel.type = "button";
  cancel.addEventListener("click", () => { LOGGING = false; render(CURRENT); });
  bar.appendChild(cancel);
  main.appendChild(bar);
  main.appendChild(status);

  const discard = el("button", "discardbtn", "✕ Discard this workout");
  discard.type = "button";
  discard.addEventListener("click", discardWorkout);
  main.appendChild(discard);

  // Keep the scroll position across rebuilds so the page doesn't jump (the
  // exercise picker is an overlay now, so this applies unconditionally).
  requestAnimationFrame(() => window.scrollTo(0, keepY));
}

async function saveSession(w, saveBtn, status) {
  const exercises = MODEL.map(mex => ({
    exercise_name: mex.exercise_name,
    note: (mex.note || "").trim() || undefined,
    sets: mex.sets
      .filter(s => (s.reps || 0) > 0)
      .map(s => { const type = setType(s);
                  return { weight_kg: s.weight || 0, reps: s.reps || 0,
                           rpe: s.rpe === "" ? null : parseFloat(s.rpe),
                           is_warmup: type === "warmup", set_type: type }; }),
  })).filter(e => e.sets.length);

  // Setups persist independently of whether sets were logged this time.
  const setups = MODEL.filter(m => (m.setup || "").trim() && m.exercise_name)
                      .map(m => ({ exercise: m.exercise_name, setup: m.setup.trim() }));

  if (!exercises.length) {
    status.className = "logstatus err";
    status.textContent = "Add at least one set with reps before saving.";
    status.scrollIntoView({ block: "nearest" });
    return;
  }
  saveBtn.disabled = true;
  status.className = "logstatus"; status.textContent = "Saving…";
  try {
    const r = await fetch(LOG_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: CURRENT.date, session_type: w.session_type,
                             workout_name: w.title, exercises, setups,
                             stretches: STRETCH ? { pre_done: !!STRETCH.pre.done,
                                                    post_done: !!STRETCH.post.done } : null }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    clearDraft();
    clearSessionStart();
    status.className = "logstatus ok";
    status.textContent = "Saved " + d.sets_written + " sets — your coach can see it now.";
    setTimeout(() => { LOGGING = false; render(CURRENT); }, 1400);
  } catch (e) {
    saveBtn.disabled = false;
    status.className = "logstatus err";
    status.textContent = "Save failed — " + e.message;
    status.scrollIntoView({ block: "nearest" });
  }
}

function render(d) {
  CURRENT = d;
  if (LOGGING && d && d.workout) { renderLogger(d.workout); return; }
  document.body.classList.remove("logging-active");
  RT.hideBar();
  const main = document.getElementById("main");
  main.textContent = "";
  main.classList.add("srt-reveal");
  setTimeout(() => main.classList.remove("srt-reveal"), 700);

  const w = d.workout;
  if (!w) {
    const box = el("div", "empty");
    const where = d.uses_hevy === false
      ? "Your coach programmes a session on training days — once one's ready it shows up here."
      : "Your coach programmes a workout into your Hevy app on training days — once one's posted it shows up here.";
    box.innerHTML = "No prescribed session yet. " + where + " Ask in the "
      + "<b><a href=\"" + CHAT_URL + "\">chat</a></b> to generate today's session.";
    main.appendChild(box);
    return;
  }

  const exercises = w.exercises || [];
  const working = exercises.reduce(
    (a, ex) => a + (ex.sets || []).filter(s => !s.is_warmup).length, 0);

  const banner = el("div", "banner");
  const figs = sessionMuscleFigs(w);
  if (figs) { banner.appendChild(figs); banner.classList.add("banner--figs"); }
  if (w.session_type) banner.appendChild(el("span", "banner__type", w.session_type));
  banner.appendChild(el("div", "banner__title", w.title || "Prescribed session"));
  const when = el("div", "banner__when " + (d.is_today ? "today" : "stale"));
  when.textContent = d.is_today
    ? "Today's session"
    : "Prescribed " + fmtDate(d.date) + " — no newer session yet";
  banner.appendChild(when);
  banner.appendChild(el("div", "banner__meta",
    exercises.length + (exercises.length === 1 ? " exercise" : " exercises")
    + " · " + working + " working sets"));
  const logBtn = el("button", "logbtn" + (loadDraft() ? " on" : ""),
    loadDraft() ? "Resume logging" : "Log this session");
  logBtn.type = "button";
  logBtn.addEventListener("click", () => enterLogging(w));
  banner.appendChild(logBtn);
  if (loadDraft()) {
    const disc = el("button", "discardbtn inline", "✕ Discard");
    disc.type = "button";
    disc.addEventListener("click", discardWorkout);
    banner.appendChild(disc);
  }
  main.appendChild(banner);

  if (d.upcoming && d.upcoming.length) main.appendChild(comingUp(d.upcoming));

  exercises.forEach((ex, i) => main.appendChild(exerciseCard(ex, i)));

  if (w.reasoning) {
    const det = el("details", "why");
    det.appendChild(el("summary", null, "Why this session"));
    det.appendChild(el("div", "why__body", w.reasoning));
    main.appendChild(det);
  }
}

// Re-arm audio when returning to the tab (iOS suspends the context in background).
document.addEventListener("visibilitychange", () => { if (!document.hidden) _audio(); });

// Wait for the visuals index too (local + tiny) so thumbnails are on the
// first paint rather than popping in on a later rerender.
Promise.all([fetch(DATA_URL).then(r => r.json()), EXLIB_READY])
  .then(([d]) => { if (d.error) throw new Error(d.error); render(d); })
  .catch(e => {
    document.getElementById("main").innerHTML =
      '<p class="muted">Could not load your workout (' + e.message + ').</p>';
  });
</script>
