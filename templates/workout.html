<style>
  /* Workout screen in the Sortie idiom. Colours, faces and surfaces come from
     tokens; depth is hairlines and translucency — no radius, no shadows. */
  main { padding: var(--space-5) var(--space-4); max-width: 720px; margin: 0 auto;
         padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom)); }
  .muted { color: var(--ink-muted); }
  .empty { background: var(--panel); border: var(--hairline) solid var(--line);
           padding: var(--space-4); font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .empty a { color: var(--corp); }

  /* Session banner — a panel slab whose hairlines overrun the sides */
  .banner { position: relative; background: var(--panel);
            border-top: var(--hairline) solid var(--line);
            border-bottom: var(--hairline) solid var(--line);
            padding: var(--space-4); margin-bottom: var(--space-4); }
  .banner::before, .banner::after { content: ""; position: absolute;
            left: calc(-1 * var(--bracket-len)); right: calc(-1 * var(--bracket-len));
            height: var(--hairline); background: var(--line); pointer-events: none; }
  .banner::before { top: -1px; } .banner::after { bottom: -1px; }
  .banner__type { display: inline-flex; align-items: center; gap: var(--space-1);
                  font-family: var(--font-mono); font-size: 12px; line-height: 16px;
                  letter-spacing: .06em; text-transform: uppercase; color: var(--ink);
                  background: var(--panel-raised); padding: 2px var(--space-2);
                  margin-bottom: var(--space-2); }
  .banner__type::before { content: "//"; color: var(--ink-muted); }
  .banner__title { font-family: var(--font-display); font-size: 18px; line-height: 24px;
                   font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
                   color: var(--ink); }
  .banner__when { font-family: var(--font-label); font-size: 10px; line-height: 14px;
                  letter-spacing: .18em; text-transform: uppercase; margin-top: var(--space-2); }
  .banner__when.today { color: var(--ok); }
  .banner__when.stale { color: var(--ink-muted); }
  /* Session target muscles: a small front/back pair pinned top-right. */
  .banner__figs { position: absolute; top: var(--space-4); right: var(--space-4);
                  display: flex; gap: var(--space-2); }
  .banner__figs .mfig { height: 92px; width: 42px; }
  .banner--figs { padding-right: 118px; }
  .banner__meta { font-family: var(--font-mono); font-size: 12px; line-height: 16px;
                  color: var(--ink-muted); margin-top: var(--space-1); }
  body.logging-active .banner { border-left: 2px solid var(--accent); }

  /* Adaptive "coming up" forecast strip */
  .coming { margin: 0 0 var(--space-4); padding: var(--space-3); background: var(--panel);
            border: var(--hairline) solid var(--line); }
  .coming__label { display: flex; align-items: center; gap: var(--space-2);
                   font-family: var(--font-label); font-size: 10px; line-height: 14px;
                   letter-spacing: .18em; text-transform: uppercase; color: var(--ink-muted);
                   margin-bottom: var(--space-2); }
  .coming__label::before { content: ""; width: 6px; height: 6px; background: currentColor; flex: none; }
  .coming__row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .coming__chip { font-family: var(--font-mono); font-size: 12px; line-height: 16px;
                  letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted);
                  background: var(--bg-200); border: var(--hairline) solid var(--line);
                  padding: 2px var(--space-2); }
  .coming__chip.now { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .coming__arrow { color: var(--ink-faint); font-family: var(--font-mono); font-size: 12px; }
  .coming__note { font-size: 12px; color: var(--ink-muted); line-height: 17px; margin-top: var(--space-2); }

  /* One panel slab per exercise */
  .ex { position: relative; background: var(--panel);
        border-top: var(--hairline) solid var(--line);
        border-bottom: var(--hairline) solid var(--line);
        padding: var(--space-4); margin-bottom: var(--space-5); }
  .ex::before, .ex::after { content: ""; position: absolute;
        left: calc(-1 * var(--bracket-len)); right: calc(-1 * var(--bracket-len));
        height: var(--hairline); background: var(--line); pointer-events: none; }
  .ex::before { top: -1px; } .ex::after { bottom: -1px; }
  .ex.main { border-left: 2px solid var(--gold); }
  .ex.logging { background: var(--panel); }
  /* Card header: name + info grouped left, remaining actions pinned right. */
  .ex__head { display: flex; align-items: center; gap: var(--space-3); }
  .ex__title { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--space-2); }
  .ex__name { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere;
              font-family: var(--font-display); font-size: 16px; line-height: 20px;
              font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
              color: var(--ink); }
  .ex__actions { display: flex; gap: var(--space-2); flex: none; align-self: flex-start; }
  /* Meta row: uniform square tags, fixed order, identical size/weight. */
  .ex__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
              margin-top: var(--space-2); }
  .ex__meta > *, .ex__tag { font-family: var(--font-mono); font-size: 11px; line-height: 16px;
                  letter-spacing: .06em; text-transform: uppercase; padding: 2px var(--space-2);
                  background: var(--bg-200); border: var(--hairline) solid var(--line);
                  color: var(--ink-muted); white-space: nowrap; }
  .ex__tag--main { color: var(--gold); border-color: var(--gold); background: transparent; }
  .ready { display: inline-flex; align-items: center; gap: var(--space-2); }
  .rag-dot { width: 6px; height: 6px; background: currentColor; flex: none; }
  .rag-green { color: var(--ok); border-color: var(--ok); background: transparent; }
  .rag-amber { color: var(--gold); border-color: var(--gold); background: transparent; }
  .rag-red   { color: var(--lamp); border-color: var(--lamp); background: transparent; }
  .readnote { font-family: var(--font-mono); font-size: 11px; line-height: 16px;
              color: var(--ink-muted); margin-top: var(--space-2); }
  .hist-btn { font-family: var(--font-label); font-size: 10px; line-height: 14px;
              letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
              background: transparent; border: var(--hairline) solid var(--line);
              padding: var(--space-2) var(--space-3); min-height: 32px; cursor: pointer;
              white-space: nowrap; }
  .hist-btn:hover, .hist-btn[aria-expanded="true"] { color: var(--ink);
              border-color: var(--line-strong); }

  /* Per-exercise history panel (revealed under the card) */
  .hist { margin-top: var(--space-3); border-top: var(--hairline) solid var(--line);
          padding-top: var(--space-3); animation: fadeIn .3s ease both; }
  .hist__summary { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4);
                   margin-bottom: var(--space-2); font-family: var(--font-mono); font-size: 12px; }
  .hist__summary .k { color: var(--ink-muted); text-transform: uppercase; letter-spacing: .1em; }
  .hist__summary .v { color: var(--ink); font-family: var(--font-display); font-weight: 600;
                      font-variant-numeric: tabular-nums; }
  .hist__summary .v.up { color: var(--ok); } .hist__summary .v.down { color: var(--lamp); }
  .hist__note { font-size: 13px; color: var(--ink-muted); line-height: 18px; }
  .chart svg { width: 100%; height: 120px; display: block; overflow: visible;
               color: var(--ink); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .sets { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0 0; }
  .set { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink);
         background: var(--bg-200); border: var(--hairline) solid var(--line);
         padding: 2px var(--space-2); }
  .set.warm { color: var(--ink-muted); border-style: dashed; }
  .set b { font-family: var(--font-display); font-weight: 600; color: var(--ink);
           font-variant-numeric: tabular-nums; }
  /* Expected-RPE tag on the prescription card: informational, corp blue. */
  .set.pred { color: var(--corp); border-color: var(--corp); border-style: dotted;
              background: transparent; }
  .rest { font-family: var(--font-label); font-size: 10px; line-height: 14px;
          letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
          margin-top: var(--space-3); }
  .rest--btn { background: transparent; border: var(--hairline) solid var(--line);
               cursor: pointer; padding: var(--space-2) var(--space-3); min-height: 32px; }
  .rest--btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .notes { font-size: 14px; line-height: 20px; color: var(--ink); margin-top: var(--space-3);
           white-space: pre-wrap; overflow-wrap: break-word; }
  .alts { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted);
          margin-top: var(--space-3); line-height: 2; }
  .alts b { color: var(--ink-muted); font-family: var(--font-label); font-size: 10px;
            font-weight: 400; letter-spacing: .14em; text-transform: uppercase; }
  .alt-btn { font-family: var(--font-mono); font-size: 12px; color: var(--ink);
             background: transparent; border: var(--hairline) solid var(--line);
             padding: 2px var(--space-2); margin: 0 var(--space-2) 2px 0; cursor: pointer;
             white-space: nowrap; }
  .alt-btn:hover { border-color: var(--line-strong); }
  .alt-btn:disabled { opacity: var(--opacity-disabled); cursor: default; }
  .alts__status { font-family: var(--font-mono); font-size: 11px;
                  color: var(--ink-muted); margin-left: var(--space-2); }
  .alts__status.err { color: var(--lamp); }

  /* ── Logging mode ─────────────────────────────────────────── */
  /* The one amber action on the view screen: enter (or resume) logging. */
  .logbtn { display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: 0 var(--space-5); font-family: var(--font-body);
            font-size: 15px; line-height: 20px; letter-spacing: .02em;
            color: var(--on-accent); background: var(--accent);
            border: var(--hairline) solid var(--accent); margin-top: var(--space-3);
            cursor: pointer; }
  .logbtn:hover { filter: brightness(1.08); }
  .logbtn.on { background: var(--accent); }
  /* Hevy-style set table: SET | PREVIOUS | KG | REPS | RPE | ✓.
     Tap the badge for set type / remove; tap PREVIOUS to copy it in;
     tick on the right completes the set and arms the rest timer. */
  .sett { display: grid; grid-template-columns: 30px minmax(0, 1fr) 54px 46px 42px 38px;
          gap: var(--space-2); align-items: center; margin: var(--space-2) 0;
          padding: 2px 0; }
  .sett-head { margin: var(--space-3) 0 var(--space-1); padding: 0;
          font-family: var(--font-label); font-size: 9px; line-height: 13px;
          letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .sett-head span { text-align: center; overflow: hidden; }
  .sett-head .h-prev { text-align: left; }
  /* 16px min font on inputs stops iOS Safari auto-zooming on focus. */
  .sett input[type=number] { width: 100%; font-family: var(--font-display); font-size: 16px;
            font-variant-numeric: tabular-nums; text-align: center; color: var(--ink);
            background: var(--bg-200); border: var(--hairline) solid var(--line);
            padding: var(--space-2) 2px; min-height: 36px;
            appearance: textfield; -moz-appearance: textfield; }
  .sett input[type=number]::-webkit-inner-spin-button,
  .sett input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .sett input[type=number]:focus { border-color: var(--line-strong);
            outline: var(--hairline) solid var(--focus); outline-offset: 2px; }
  .prevcell { font-family: var(--font-mono); font-size: 11px; line-height: 14px;
            color: var(--ink-muted); background: transparent; border: 0; text-align: left;
            padding: 0; min-height: 36px; cursor: pointer; overflow: hidden;
            white-space: nowrap; text-overflow: ellipsis; }
  .prevcell:hover { color: var(--ink); }
  .prevcell:disabled { color: var(--ink-faint); cursor: default; }
  .donebtn { width: 100%; min-height: 36px; font-size: 15px; line-height: 1;
            color: var(--ink-muted); background: var(--bg-200);
            border: var(--hairline) solid var(--line); cursor: pointer; }
  .donebtn:hover { border-color: var(--line-strong); }
  /* Done: the row carries an ok tint and the tick goes solid — success in
     green with the ✓ as its word. */
  .sett.is-done { background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .sett.is-done input[type=number], .sett.is-done .rpe-cell {
            color: var(--ok); background: transparent;
            border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .sett.is-done .prevcell { color: var(--ink-faint); }
  .sett.is-done .donebtn { color: var(--bg-100); background: var(--ok); border-color: var(--ok); }
  /* Optional stretch routines: accent-tinted card, single done toggle. */
  .stretchcard { background: var(--accent-soft); border: var(--hairline) solid var(--accent);
                 padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); }
  .stretchcard__head { display: flex; align-items: center; gap: var(--space-3); }
  .stretchcard__eyebrow { color: var(--accent); flex: 1; min-width: 0; }
  .stretchcard__btn { flex: none; min-height: 36px; padding: 0 var(--space-3);
                 font-family: var(--font-body); font-size: 14px; color: var(--ink);
                 background: var(--panel-raised); border: var(--hairline) solid var(--line);
                 cursor: pointer; }
  .stretchcard.is-done { background: transparent; border-color: var(--line); }
  .stretchcard.is-done .stretchcard__eyebrow { color: var(--ink-muted); }
  .stretchcard.is-done .stretchcard__btn { color: var(--ok); border-color: var(--ok);
                 background: transparent; }
  .stretchcard__list { display: flex; flex-wrap: wrap; gap: var(--space-2);
                 margin-top: var(--space-2); }
  .stretchcard__item { font-family: var(--font-mono); font-size: 12px; line-height: 16px;
                 color: var(--ink); background: var(--bg-200);
                 border: var(--hairline) solid var(--line); padding: 2px var(--space-2); }
  .stretchcard.is-done .stretchcard__item { color: var(--ink-muted); }

  .addset { display: block; width: 100%; font-family: var(--font-label); font-size: 10px;
            letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
            background: transparent; border: var(--hairline) dashed var(--line);
            padding: var(--space-2) var(--space-3);
            margin-top: var(--space-2); min-height: 36px; cursor: pointer; }
  .addset:hover { color: var(--ink); border-color: var(--line-strong); }

  /* Bottom sheets (set-type + RPE pickers): square slabs on the scrim. */
  .sheet-overlay { position: fixed; inset: 0; z-index: 80; background: var(--scrim);
                   display: flex; align-items: flex-end; opacity: 0; transition: opacity .16s ease;
                   overscroll-behavior: contain; }
  .sheet-overlay.open { opacity: 1; }
  .sheet-overlay.closing { opacity: 0; }
  /* While any sheet is open the page behind must not scroll. */
  body.sheet-open { overflow: hidden; }
  .sheet { position: relative; width: 100%; max-width: 720px; margin: 0 auto;
           background: var(--panel-solid);
           border-top: var(--hairline) solid var(--line-strong);
           padding: var(--space-4) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom));
           transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
           overscroll-behavior: contain; }
  .sheet-overlay.open .sheet { transform: none; }
  .sheet-overlay.closing .sheet { transform: translateY(100%); }
  .sheet__close { position: absolute; top: var(--space-2); right: var(--space-3);
           width: 36px; height: 36px; display: grid; place-items: center;
           font-family: var(--font-mono); font-size: 14px; line-height: 1;
           color: var(--ink-muted); background: var(--panel-raised);
           border: var(--hairline) solid var(--line); cursor: pointer; z-index: 2; }
  .sheet__close:hover { color: var(--ink); border-color: var(--line-strong); }
  .sheet__title { font-family: var(--font-display); font-size: 16px; line-height: 20px;
                  font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
                  text-align: center; color: var(--ink); padding: var(--space-1) 0 var(--space-2); }
  .sheet__sub { font-family: var(--font-mono); font-size: 12px; text-align: center;
                color: var(--ink-muted); margin-bottom: var(--space-2); }
  .sheet__opt { display: flex; align-items: center; gap: var(--space-3); width: 100%;
                text-align: left; background: transparent; border: 0;
                border-top: var(--hairline) solid var(--line);
                padding: var(--space-3) var(--space-1); min-height: 44px; cursor: pointer;
                color: var(--ink); font: inherit; }
  .sheet__opt:hover { background: var(--panel-raised); }
  .sheet__optlabel { font-family: var(--font-body); font-size: 15px; }
  .sheet__opt.danger .sheet__optlabel { color: var(--target); }
  /* Set-type badge (row + sheet) */
  .st-badge { display: inline-flex; align-items: center; justify-content: center;
              width: 28px; height: 28px; flex: none; font-family: var(--font-display);
              font-size: 13px; font-weight: 600; border: var(--hairline) solid var(--line);
              background: var(--bg-200); cursor: pointer; }
  .st-warm   { color: var(--ink-muted); border-style: dashed; }
  .st-normal { color: var(--ink); }
  .st-fail   { color: var(--target); border-color: var(--target); }
  .st-drop   { color: var(--corp); border-color: var(--corp); }
  .st-remove { color: var(--target); border-color: transparent; background: transparent; }
  /* RPE cell (row) + picker (sheet) */
  .rpe-cell { min-width: 48px; font-family: var(--font-display); font-size: 16px;
              font-variant-numeric: tabular-nums; text-align: center; color: var(--ink);
              background: var(--bg-200); border: var(--hairline) solid var(--line);
              padding: var(--space-2) 2px; cursor: pointer; }
  .rpe-cell.empty { color: var(--ink-faint); }
  .rpe-big { font-family: var(--font-display); font-size: 44px; line-height: 48px;
             font-weight: 600; font-variant-numeric: tabular-nums; text-align: center;
             color: var(--ink); }
  .rpe-hint { font-size: 13px; line-height: 18px; text-align: center; color: var(--ink-muted);
              margin: var(--space-1) 0 var(--space-3); min-height: 18px; }
  .rpe-row { display: flex; flex-wrap: nowrap; gap: var(--space-1); justify-content: center; }
  .rpe-opt { flex: 1 1 0; min-width: 0; font-family: var(--font-display); font-size: 14px;
             font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink);
             background: var(--panel-raised); border: var(--hairline) solid var(--line);
             padding: var(--space-3) 2px; min-height: 44px; cursor: pointer; }
  .rpe-opt.on { color: var(--ink); background: var(--panel-selected);
                border-color: var(--line-strong); }
  /* The sheet's one amber action. */
  .sheet__done { display: flex; align-items: center; justify-content: center; width: 100%;
                 margin-top: var(--space-3); min-height: 44px; font-family: var(--font-body);
                 font-size: 15px; letter-spacing: .02em; color: var(--on-accent);
                 background: var(--accent); border: var(--hairline) solid var(--accent);
                 cursor: pointer; }
  .sheet__done:hover { filter: brightness(1.08); }
  .sheet__done:disabled { opacity: var(--opacity-disabled); }
  .sheet__clear { width: 100%; margin-top: var(--space-2); font-family: var(--font-label);
                  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
                  color: var(--ink-muted); background: transparent;
                  border: var(--hairline) solid var(--line); padding: var(--space-3);
                  min-height: 40px; cursor: pointer; }
  .sheet__clear:hover { color: var(--ink); border-color: var(--line-strong); }
  .classify-info { border-top: var(--hairline) solid var(--line); margin: var(--space-1) 0 var(--space-2); }
  .classify-row { display: flex; justify-content: space-between; gap: var(--space-4);
                  padding: var(--space-2) var(--space-1);
                  border-bottom: var(--hairline) solid var(--line);
                  font-family: var(--font-mono); font-size: 13px; }
  .classify-k { color: var(--ink-muted); text-transform: uppercase; letter-spacing: .14em;
                font-family: var(--font-label); font-size: 10px; align-self: center; }
  .classify-v { color: var(--ink); text-transform: capitalize; }
  .classify-q { font-size: 14px; color: var(--ink); text-align: center; line-height: 20px;
                margin: var(--space-3) 0 var(--space-2); }

  /* How-to sheet (info): breakdown + mini floating chat for follow-ups.
     One scroll region between title and ask bar; overscroll contained so
     the workout behind never moves. */
  .sheet--howto { height: 80vh; display: flex; flex-direction: column; }
  .howto__scroll { flex: 1; min-height: 0; overflow-y: auto;
                   overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .howto__thread { display: flex; flex-direction: column;
                   gap: var(--space-2); padding: var(--space-2) 0 var(--space-3);
                   border-top: var(--hairline) solid var(--line); }
  .howto__a { font-size: 14px; line-height: 20px; color: var(--ink); white-space: pre-wrap;
              background: var(--bg-200); border-left: 2px solid var(--corp);
              padding: var(--space-2) var(--space-3); }
  .howto__q { align-self: flex-end; max-width: 85%; font-size: 14px; line-height: 20px;
              color: var(--ink); background: var(--corp-soft);
              padding: var(--space-2) var(--space-3); }
  .howto__ask { display: flex; gap: var(--space-2); padding-top: var(--space-3); }
  .howto__inp { flex: 1; font-family: var(--font-body); font-size: 16px; color: var(--ink);
                background: var(--bg-200); border: var(--hairline) solid var(--line);
                padding: var(--space-2) var(--space-3); min-height: 44px; }
  .howto__inp:focus { border-color: var(--line-strong);
                      outline: var(--hairline) solid var(--focus); outline-offset: 2px; }
  .howto__send { font-family: var(--font-body); font-size: 15px; letter-spacing: .02em;
                 color: var(--on-accent); background: var(--accent);
                 border: var(--hairline) solid var(--accent); padding: 0 var(--space-4);
                 min-height: 44px; cursor: pointer; }
  .howto__send:disabled { opacity: var(--opacity-disabled); }

  /* Add / swap exercise controls in the logger */
  .ex__ctl { font-family: var(--font-mono); font-size: 13px; line-height: 1;
             color: var(--ink-muted); background: transparent;
             border: var(--hairline) solid var(--line); width: 36px; min-height: 32px;
             text-align: center; cursor: pointer; }
  .ex__ctl:hover { border-color: var(--line-strong); color: var(--ink); }
  .ex__ctl.del:hover { border-color: var(--target); color: var(--target); }
  /* Floating exercise picker (rides the bottom-sheet machinery) */
  .sheet--picker { height: 86vh; display: flex; flex-direction: column; }
  .picker__search { width: 100%; box-sizing: border-box; font-family: var(--font-body);
                    font-size: 16px; color: var(--ink); background: var(--bg-200);
                    border: var(--hairline) solid var(--line-strong);
                    padding: var(--space-2) var(--space-3); margin-top: var(--space-1);
                    min-height: 44px; }
  .picker__search:focus { outline: var(--hairline) solid var(--focus); outline-offset: 2px; }
  .picker__search::placeholder { color: var(--ink-faint); }
  .picker__filters { display: flex; gap: var(--space-1); overflow-x: auto; flex: none;
                     padding: var(--space-2) 0 2px; -webkit-overflow-scrolling: touch; }
  .picker__filters--sub { padding: var(--space-1) 0 var(--space-2); }
  .picker__filters[hidden] { display: none; }
  .pchip { flex: none; display: inline-flex; align-items: center; gap: var(--space-1);
           font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
           text-transform: capitalize; color: var(--ink-muted); background: var(--bg-200);
           border: var(--hairline) solid var(--line); padding: var(--space-1) var(--space-2);
           min-height: 32px; cursor: pointer; }
  .pchip .mfig { height: 22px; width: 10px; }
  .pchip.on { color: var(--ink); background: var(--panel-selected);
              border-color: var(--line-strong); }
  .pchip--region { text-transform: uppercase; letter-spacing: .1em; }
  .picker__list { flex: 1; overflow-y: auto; border-top: var(--hairline) solid var(--line);
                  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .picker__row { display: flex; align-items: center; gap: var(--space-3); width: 100%;
                 text-align: left; background: transparent; border: 0;
                 border-bottom: var(--hairline) solid var(--line);
                 padding: var(--space-3) var(--space-1); min-height: 44px; cursor: pointer;
                 color: var(--ink); font: inherit; }
  .picker__row:hover { background: var(--panel-raised); }
  .picker__main { min-width: 0; }
  .picker__name { font-family: var(--font-body); font-size: 15px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .picker__meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);
                  text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
  .picker__days { margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 11px;
                  letter-spacing: .04em; color: var(--ink-muted); white-space: nowrap; }
  .picker__days.recent { color: var(--ok); }
  .picker__hdr { font-family: var(--font-label); font-size: 10px; letter-spacing: .18em;
                 text-transform: uppercase; color: var(--ink-muted);
                 padding: var(--space-2) var(--space-1) var(--space-1);
                 border-bottom: var(--hairline) solid var(--line); }
  .picker__create .picker__name { color: var(--corp); }
  .picker__empty { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted);
                   text-align: center; padding: var(--space-5) 0; }

  /* ── Exercise visuals ─────────────────────────────────────────
     Thumbnails come from the vendored free-exercise-db photos (public
     domain); when an exercise has none, a muscle figure stands in. The
     figure is the vendored polygon body (muscles.js): ground-coloured
     regions, primary muscles in accent, secondary in corp. */
  /* Explicit width AND height everywhere — Safari sizes auto-width SVGs
     unreliably in flex/grid, which clipped the figure on device. */
  .mfig { display: block; height: 128px; width: 58px; }
  .mfig polygon { fill: var(--bg-200); stroke: var(--line); stroke-width: 3; }
  .mfig polygon.is-prim { fill: var(--accent); stroke: var(--accent); }
  .mfig polygon.is-sec { fill: var(--corp-soft); stroke: var(--corp); }
  .picker__thumb { width: 44px; height: 44px; flex: none; display: inline-flex;
                   align-items: center; justify-content: center; overflow: hidden;
                   background: var(--bg-000); border: var(--hairline) solid var(--line); }
  .picker__thumb .mfig { height: 38px; width: 17px; }
  .ex__thumb { width: 36px; height: 36px; flex: none; display: inline-flex;
               align-items: center; justify-content: center; overflow: hidden;
               background: var(--bg-000); border: var(--hairline) solid var(--line); }
  .ex__thumb .mfig { height: 30px; width: 14px; }
  /* Tappable thumbs are buttons — reset chrome, keep the slab look. */
  button.ex__thumb { padding: 0; cursor: pointer; }
  button.ex__thumb:hover { border-color: var(--line-strong); }
  .picker__thumb img, .ex__thumb img { width: 100%; height: 100%;
               object-fit: cover; display: block; }

  /* How-to sheet: compact movement animation + the spinning muscle figure. */
  .howto__vis { display: flex; gap: var(--space-5); align-items: center;
                justify-content: center; margin-bottom: var(--space-3); }
  /* Gymvisual art keeps its white ground — 180px palette GIFs with motion
     ghosting can't be segmented cleanly, so the ONE consistent treatment
     everywhere is: original art, slightly dimmed, in a hairline frame. */
  .gv-media { filter: brightness(.94) saturate(.9); }
  .howto__anim { position: relative; width: 148px; flex: none; cursor: pointer;
                 border: var(--hairline) solid var(--line); background: var(--bg-000); }
  .howto__anim img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
  .howto__credit { font-family: var(--font-mono); font-size: 10px; line-height: 14px;
                 color: var(--ink-faint); margin: 0 0 var(--space-3); }
  .howto__anim::after { content: "❚❚"; position: absolute; right: var(--space-1);
                 bottom: var(--space-1); font-family: var(--font-mono); font-size: 10px;
                 color: var(--ink-muted); background: var(--scrim);
                 padding: 1px var(--space-1); }
  .howto__anim.is-paused::after { content: "▶"; }

  /* The body-part indicator: the polygon figure on a slow turntable about
     the vertical axis. Front and back views are the outer faces; stacked
     silhouette layers between them give the body thickness, so edge-on it
     reads as a solid rather than vanishing paper. */
  .mfig3d { width: 70px; height: 132px; flex: none; perspective: 700px; }
  .mfig3d-inner { position: relative; width: 100%; height: 100%;
                  transform-style: preserve-3d;
                  animation: mfigspin 9s linear infinite; }
  .mfig3d .mfig { position: absolute; inset: 0; width: 100%; height: 100%;
                  backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .mfig3d .mfig.is-back { transform: rotateY(180deg) translateZ(9px); }
  .mfig3d .mfig.is-front { transform: translateZ(9px); }
  .mfig3d .mfig.is-mid { backface-visibility: visible; -webkit-backface-visibility: visible; }
  .mfig3d .mfig.is-mid polygon { fill: var(--panel-raised); stroke: var(--line); }
  @keyframes mfigspin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .mfig3d-inner { animation: none; transform: rotateY(24deg); }
  }
  .howto__muscles { font-family: var(--font-mono); font-size: 12px; line-height: 16px;
                 color: var(--ink-muted); margin: 0 0 var(--space-3); }
  .howto__muscles b { color: var(--accent); font-weight: 400; }
  .howto__muscles i { color: var(--corp); font-style: normal; }
  .howto__steps { margin: 0 0 var(--space-3); padding-left: 1.3em;
                 font-size: 14px; line-height: 20px; display: grid; gap: var(--space-1); }
  .howto__steps li::marker { color: var(--ink-faint); font-family: var(--font-mono); }
  .addex { display: block; width: 100%; font-family: var(--font-label); font-size: 10px;
           letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
           background: transparent; border: var(--hairline) dashed var(--line);
           padding: var(--space-3); margin: var(--space-1) 0 var(--space-2);
           min-height: 44px; cursor: pointer; }
  .addex:hover { color: var(--ink); border-color: var(--line-strong); }

  /* Rest timer — Hevy-style accessory bar: full width, flat on the bottom
     edge, [-15] [time] [+15] [Skip]. Appears only while a rest runs, and
     rides above the on-screen keyboard (transform slides, no popping). */
  .rtimer { position: fixed; left: 50%; bottom: 0;
            transform: translate3d(-50%, 0, 0);
            will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            transition: transform .18s ease-out;
            z-index: 70; display: flex; align-items: center; gap: var(--space-2);
            width: 100%; max-width: 720px;
            background: var(--panel-solid); border-top: var(--hairline) solid var(--line-strong);
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
            padding: var(--space-2) var(--space-3) calc(var(--space-2) + env(safe-area-inset-bottom)); }
  body.logging-active main { padding-bottom: calc(7.5rem + env(safe-area-inset-bottom)); }
  .rtimer[hidden] { display: none; }
  /* The countdown is the hero numeral: display face, tabular, accent while live. */
  .rtimer__time { flex: 1; font-family: var(--font-display); font-size: 28px; line-height: 32px;
                  font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent);
                  text-align: center; }
  .rtimer.done { animation: rtflash .6s steps(1) infinite; }
  .rtimer.done .rtimer__time { color: var(--ok); }
  @keyframes rtflash { 50% { opacity: .5; } }
  .rtimer__btn { font-family: var(--font-display); font-size: 14px; font-weight: 500;
                 font-variant-numeric: tabular-nums; color: var(--ink);
                 background: var(--panel-raised); border: var(--hairline) solid var(--line);
                 padding: 0 var(--space-3); min-width: 52px; min-height: 44px;
                 text-align: center; cursor: pointer; flex: none; }
  .rtimer__btn:hover { background: var(--panel-selected); }
  .rtimer__skip { color: var(--corp); border-color: var(--corp); background: transparent; }
  /* Remaining-rest gauge: a thin fill on a hairline track along the top edge. */
  .rtimer__gauge { position: absolute; left: 0; right: 0; top: -1px; height: 3px;
                   background: var(--line); pointer-events: none; }
  .rtimer__gauge-fill { height: 100%; width: 0; background: var(--accent); }

  /* Per-exercise workout note in the logger */
  .exnote { display: block; width: 100%; box-sizing: border-box; font-family: var(--font-body);
            font-size: 16px; color: var(--ink); background: var(--bg-200);
            border: var(--hairline) solid var(--line); padding: var(--space-2) var(--space-3);
            margin-top: var(--space-2); }
  .exnote:focus { border-color: var(--line-strong);
                  outline: var(--hairline) solid var(--focus); outline-offset: 2px; }
  .exnote::placeholder { color: var(--ink-faint); }
  .exsetup { color: var(--corp); }

  /* Sticky logging header (Hevy's Log Workout bar): elapsed clock on the
     left, Finish — the one amber action while logging — on the right. */
  .logtop { position: sticky; top: calc(49px + env(safe-area-inset-top)); z-index: 40;
            display: flex; align-items: baseline; gap: var(--space-3);
            margin: 0 0 var(--space-4); padding: var(--space-2) 0;
            background: var(--bg-100); border-bottom: var(--hairline) solid var(--line); }
  .logtop__label { font-family: var(--font-label); font-size: 9px; line-height: 13px;
            letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
            max-width: 230px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .logtop__clock { font-family: var(--font-display); font-size: 20px; line-height: 24px;
            font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .logtop__finish { margin-left: auto; align-self: center; min-height: 40px;
            padding: 0 var(--space-5); font-family: var(--font-body); font-size: 15px;
            letter-spacing: .02em; color: var(--on-accent); background: var(--accent);
            border: var(--hairline) solid var(--accent); cursor: pointer; }
  .logtop__finish:hover { filter: brightness(1.08); }
  .logtop__finish:disabled { opacity: var(--opacity-disabled); cursor: default; }

  /* Bottom bar: just Cancel now (Finish lives in the sticky header). */
  .logbar { position: sticky; bottom: 0; display: flex; gap: var(--space-3);
            margin-top: var(--space-4);
            padding: var(--space-3) 0 calc(var(--space-2) + env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--bg-100) 70%, transparent); }
  /* While the keyboard is up the bottom edge belongs to the timer bar —
     the Cancel bar would float behind the keyboard accessory row. */
  body.logging-active:has(input:focus) .logbar { visibility: hidden; }
  .logbar button { flex: 1; font-family: var(--font-body); font-size: 15px;
            letter-spacing: .02em; min-height: 44px; cursor: pointer; }
  .logbar .cancel { color: var(--ink); background: var(--panel-raised);
            border: var(--hairline) solid var(--line); }

  /* Per-exercise chip row (rest timer, notes toggle) + the coach's note. */
  .exchips { display: flex; gap: var(--space-2); flex-wrap: wrap; margin: var(--space-2) 0 0; }
  .chipbtn { display: inline-flex; align-items: center; gap: var(--space-1);
            font-family: var(--font-mono); font-size: 12px; line-height: 16px;
            color: var(--ink-muted); background: var(--bg-200);
            border: var(--hairline) solid var(--line);
            padding: var(--space-1) var(--space-2); min-height: 32px; cursor: pointer; }
  .chipbtn:hover { color: var(--ink); border-color: var(--line-strong); }
  .chipbtn.on { color: var(--ink); background: var(--panel-raised);
            border-color: var(--line-strong); }
  .lognote { font-size: 14px; line-height: 20px; color: var(--ink);
            margin: var(--space-3) 0 0; padding-left: var(--space-3);
            border-left: 2px solid var(--corp);
            white-space: pre-wrap; overflow-wrap: break-word; }
  /* In the logger the name is a button (identity blue, taps to How-to) —
     inherits the .ex__name face/size, just resets button chrome. */
  .ex.logging .ex__name { color: var(--corp); background: transparent; border: 0;
            padding: 0; cursor: pointer; text-align: left; }
  .logstatus { font-family: var(--font-mono); font-size: 12px; text-align: center;
               margin-top: var(--space-3); color: var(--ink-muted); }
  .logstatus.err { color: var(--lamp); } .logstatus.ok { color: var(--ok); }
  .discardbtn { display: block; margin: var(--space-3) auto 0; font-family: var(--font-label);
                font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
                color: var(--target); background: transparent;
                border: var(--hairline) solid transparent;
                padding: var(--space-2) var(--space-3); min-height: 36px; cursor: pointer; }
  .discardbtn:hover { border-color: var(--target); }
  .discardbtn.inline { display: inline-block; margin: var(--space-3) 0 0 var(--space-2); }
  .draftflag { display: flex; align-items: center; gap: var(--space-2);
               font-family: var(--font-label); font-size: 10px; letter-spacing: .14em;
               text-transform: uppercase; color: var(--accent); margin: 0 0 var(--space-3); }
  .draftflag::before { content: ""; width: 6px; height: 6px; background: currentColor; flex: none; }

  /* Reasoning */
  details.why { background: var(--panel); border: var(--hairline) solid var(--line);
                margin-top: var(--space-5); }
  details.why > summary { list-style: none; cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-label); font-size: 10px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--ink-muted);
      padding: var(--space-3) var(--space-4); }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary::after { content: "▾"; color: var(--ink-faint); margin-left: auto; }
  details.why[open] > summary::after { content: "▴"; }
  details.why[open] > summary { color: var(--ink); }
  .why__body { font-size: 14px; line-height: 20px; color: var(--ink-muted);
               padding: 0 var(--space-4) var(--space-4); white-space: pre-wrap;
               overflow-wrap: break-word; }

  @media (prefers-reduced-motion: reduce) {
    .hist { animation: none; }
    .rtimer.done { animation: none; }
    .sheet-overlay, .sheet { transition: none; }
  }
</style>
</head>
<body class="srt srt-ground">
<header class="srt-appbar">
  <div class="srt-appbar-bar">
    <h1 class="srt-appbar-title">Workout</h1>
    <span class="srt-tag is-chapter">//{{ user }}</span>
    <span class="srt-appbar-spacer"></span>
    <details class="srt-menu">
      <summary>Menu</summary>
      <nav class="srt-menu-panel">
        <a href="{{ chat_url }}">Chat</a>
        <a aria-current="page" href="{{ chat_url }}/workout">Workout</a>
        <a href="{{ chat_url }}/review">Review</a>
        <a href="{{ chat_url }}/stats">Stats</a>
        <a href="{{ chat_url }}/log">Log</a>
        <a href="{{ chat_url }}/settings">Settings</a>
      </nav>
    </details>
  </div>
</header>
<main id="main">
  <div class="srt-boot">
    <div class="srt-boot-label"><span>Loading</span><span class="srt-boot-sys">//workout</span></div>
    <div class="srt-boot-track"></div>
    <div class="srt-boot-micro">retrieving prescription</div>
  </div>
</main>
<script>
const DATA_URL = "{{ data_url }}";
const CHAT_URL = "{{ chat_url }}";
const USER     = "{{ user }}";
const HIST_URL = CHAT_URL + "/workout/history";
const SWAP_URL = CHAT_URL + "/workout/swap";
const LOG_URL    = CHAT_URL + "/workout/log";
const LOGGED_URL = CHAT_URL + "/workout/logged";
const EXLIST_URL = CHAT_URL + "/workout/exercises";
const SETUP_URL  = CHAT_URL + "/workout/setup";
const CLASSIFY_URL = CHAT_URL + "/workout/classify";
const HOWTO_URL  = CHAT_URL + "/workout/howto";
const TOKENS = getComputedStyle(document.documentElement);
const token = n => (TOKENS.getPropertyValue(n) || "").trim();
const INK = token("--ink"), ACCENT = token("--accent");
let swapping = false;   // one swap (Hevy PUT) at a time, across all cards
let LOGGING = false;      // editable logging mode on the Workout tab
let REVEAL_LOG = false;   // one-shot entrance animation when logging opens
let STRETCH = null;       // optional pre/post routines: {pre:{items,done}, post:{items,done}}
let CURRENT = null;     // last /workout/data payload, for re-rendering on toggle
const SVGNS = "http://www.w3.org/2000/svg";
const MONO = token("--font-mono") || "monospace";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en", { weekday: "short", day: "2-digit", month: "short" });
}

// Union of the session's target muscles: each exercise's primaries (library
// entry first, catalog muscle as fallback) in accent, remaining secondaries
// in corp — one figure pair summarising what the whole workout hits.
function sessionMuscleFigs(w) {
  const prim = new Set(), sec = new Set();
  (w.exercises || []).forEach(ex => {
    const le = EXLIB[ex.exercise_name];
    const p = (le && le.primary && le.primary.length) ? le.primary
            : (ex.muscle_group ? [ex.muscle_group] : []);
    p.forEach(m => prim.add(m));
    ((le && le.secondary) || []).forEach(m => sec.add(m));
  });
  const primary = [...prim];
  const secondary = [...sec].filter(m => !prim.has(m));
  if (!primary.length) return null;
  const figs = el("div", "banner__figs");
  figs.title = "Muscles this session targets";
  figs.appendChild(muscleSvg("front", primary, secondary));
  figs.appendChild(muscleSvg("back", primary, secondary));
  return figs;
}

// Equipment names for display: the catalog's "none" reads as bodyweight.
function equipLabel(e) {
  return e === "none" ? "BW" : e;
}

function isBodyweight(ex) {
  return (ex.exercise_type && ex.exercise_type.indexOf("bodyweight") !== -1)
      || ex.equipment_category === "none";
}

// Human label for a single set's load.
function loadLabel(set, ex) {
  const w = set.weight_kg || 0;
  if (isBodyweight(ex)) return w > 0 ? "BW +" + w + " kg" : "BW";
  return w > 0 ? w + " kg" : "—";
}

// Collapse consecutive identical sets into "N ×" groups.
function groupSets(sets, ex) {
  const out = [];
  for (const s of sets || []) {
    const label = loadLabel(s, ex);
    const warm = !!s.is_warmup;
    const last = out[out.length - 1];
    if (last && last.reps === s.reps && last.label === label && last.warm === warm) {
      last.count += 1;
    } else {
      out.push({ count: 1, reps: s.reps, label, warm });
    }
  }
  return out;
}

// ── Rest timer ──────────────────────────────────────────────────────────────
// One floating countdown, shared across view + logging. Auto-armed when a set is
// ticked done in the logger; also startable by tapping any exercise's rest line.
// Beeps + vibrates at zero (sounds from /static/alarm.js; choice lives in
// Settings).
//
// In the iOS app the GymTimer native plugin upgrades this: a local
// notification mirrors the countdown (alarm fires even with the phone locked
// or the app backgrounded), and at a foreground zero-cross the app takes
// audio focus — pausing whatever's playing — fires a haptic, then releases
// focus so the other app's audio resumes. On the web these are no-ops.
const NT = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GymTimer) || null;
function ntArm(seconds, name) {
  if (!NT || seconds < 1) return;
  NT.armAlarm({ seconds: Math.round(seconds),
                label: name ? name + " — next set." : "Back to it — next set." })
    .catch(() => {});
}
function ntDisarm() { if (NT) NT.disarmAlarm().catch(() => {}); }

// Fixed bar centred at the bottom of the screen. Always shown while logging
// (with a white TOTAL session clock under the controls); the rest countdown
// appears above it when armed. Countdown is driven by an absolute end-time, so
// the alarm fires exactly when the display hits 0 (no drift between them).
const RT = {
  el: null, disp: null, gfill: null, exname: "",
  endAt: 0, remain: 0, total: 0, timer: null, running: false, resting: false,
  hideAt: 0,
  ensure() {
    if (this.el) return;
    // Hevy-style accessory bar: [-15] [time] [+15] [Skip], full width, flat
    // against the bottom — and it rides above the keyboard while typing.
    const bar = el("div", "rtimer"); bar.hidden = true;
    const gauge = el("div", "rtimer__gauge");
    this.gfill = el("div", "rtimer__gauge-fill");
    gauge.appendChild(this.gfill);
    bar.appendChild(gauge);
    const mk = (t, cls, fn) => { const b = el("button", cls, t); b.type = "button";
                                 b.addEventListener("click", fn); return b; };
    bar.appendChild(mk("-15", "rtimer__btn", () => this.bump(-15)));
    this.disp = el("div", "rtimer__time", "0:00");
    bar.appendChild(this.disp);
    bar.appendChild(mk("+15", "rtimer__btn", () => this.bump(15)));
    bar.appendChild(mk("Skip", "rtimer__btn rtimer__skip", () => this.stopRest()));
    document.body.appendChild(bar);
    this.el = bar;

    // Ride above the on-screen keyboard. Don't ASSUME how much the keyboard
    // covers — WKWebView sometimes shrinks the layout viewport itself, and a
    // blind innerHeight-based lift then doubles up (bar lands mid-screen).
    // Instead measure where the bar actually is and move its bottom edge to
    // the visual viewport's bottom edge; self-correcting either way.
    if (window.visualViewport) {
      const place = () => {
        const vv = window.visualViewport;
        // Natural bottom of a fixed bottom:0 element = layout viewport
        // height; move it to the visual viewport's bottom edge.
        const lift = Math.max(0, Math.round(
          document.documentElement.clientHeight - (vv.offsetTop + vv.height)));
        bar.style.transform = `translate3d(-50%, ${-lift}px, 0)`;
      };
      this._place = place;
      window.visualViewport.addEventListener("resize", place);
      window.visualViewport.addEventListener("scroll", place);
      place();
    }
  },
  fmt(s) { s = Math.max(0, Math.round(s));
           return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); },
  // Drive the elapsed clock in the sticky logging header (the countdown bar
  // itself only appears while a rest is running — Hevy-style).
  showBar() { this.ensure(); this.loop(); },
  hideBar() { if (this.timer) clearInterval(this.timer); this.timer = null;
              this.resting = false; ntDisarm();
              if (this.el) this.el.hidden = true; },
  loop() {
    clearInterval(this.timer);
    this.timer = setInterval(() => this.paint(), 250);
    this.paint();
  },
  paint() {
    const lc = document.getElementById("logclock");
    if (lc) lc.textContent = fmtClock(Date.now() - sessionStart());
    if (!this.resting) { if (this.el && !this.el.hidden) this.el.hidden = true; return; }
    if (this.running) this.remain = (this.endAt - Date.now()) / 1000;
    if (this.running && this.remain <= 0) { this.remain = 0; this.fire(); }
    this.disp.textContent = this.fmt(this.remain);
    if (this.gfill) this.gfill.style.width =
      (this.total ? Math.max(0, this.remain) / this.total * 100 : 0) + "%";
    this.el.classList.toggle("done", this.remain <= 0);
    // Done: flash briefly, then put the bar away by itself.
    if (this.remain <= 0 && this.hideAt && Date.now() >= this.hideAt) this.stopRest();
  },
  start(seconds, name) {
    this.ensure();
    _audio();                        // prime/unlock while we're in the tap that started it
    this.el.hidden = false;
    if (this._place) this._place();
    this.total  = Math.max(1, seconds || 90);
    this.remain = this.total;
    this.endAt  = Date.now() + this.total * 1000;
    this.running = true; this.resting = true; this.hideAt = 0;
    this.exname = name || "";
    this.el.classList.remove("done");
    ntArm(this.total, name);
    this.loop();
  },
  fire() {
    this.running = false;
    this.hideAt = Date.now() + 2200;
    // If the zero-cross happened while the app was backgrounded (web timers
    // suspended), the native notification already alerted — don't replay the
    // alarm when the athlete comes back to a long-expired timer.
    const late = Date.now() - this.endAt > 3000;
    if (late) { this.stopRest(); return; }
    if (NT) {
      // focus=true interrupts playback: video apps stay paused, music apps
      // auto-resume after release. Toggleable in Settings ("rt:pausevideo").
      let focus = true;
      try { focus = localStorage.getItem("rt:pausevideo") !== "off"; } catch (e) {}
      NT.fireAlarm({ duration: 2.5, focus }).catch(() => {});
    }
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    playAlarm();
  },
  bump(d) { if (!this.resting) return;
            this.remain = Math.max(0, this.remain + d);
            this.endAt = Date.now() + this.remain * 1000;
            if (d > 0) { this.running = true; this.hideAt = 0;
                         this.el.classList.remove("done"); }
            if (this.running) ntArm(this.remain, this.exname);
            this.paint(); },
  stopRest() { this.resting = false; this.running = false; ntDisarm();
               if (this.gfill) this.gfill.style.width = "0%";
               if (this.el) { this.el.classList.remove("done"); this.el.hidden = true; } },
}

// ── Exercise visuals ─────────────────────────────────────────────────────────
// Index of vendored gymvisual media (static/gvlib/): per exercise a 180px
// still + animation GIF (media (c) Gym visual — credit shown in the how-to
// sheet), English instruction steps and muscle lists.
let EXLIB = {};
const EXLIB_READY = fetch("/static/gvlib/index.json")
  .then(r => (r.ok ? r.json() : {}))
  .then(d => { EXLIB = d || {}; })
  .catch(() => {});
function gvStill(name) {
  const e = EXLIB[name];
  return e && e.img ? "/static/gvlib/media/" + e.img : null;
}
function gvGif(name) {
  const e = EXLIB[name];
  return e && e.gif ? "/static/gvlib/media/" + e.gif : null;
}

// Muscle figure: the vendored polygon body (muscles.js) with the given
// muscles highlighted — primary in accent, secondary in corp. Accepts both
// our catalog's muscle names and free-exercise-db's (MUSCLE_MAP folds both).
function muscleSvg(view, primary, secondary) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  // 2210 not 2000: the back view's soleus polygons reach y≈2200 and were
  // getting their feet cut off. Same box on both views keeps them aligned.
  svg.setAttribute("viewBox", "0 0 1000 2210");
  svg.setAttribute("class", "mfig");
  svg.setAttribute("aria-hidden", "true");
  const fold = names => {
    const out = new Set();
    (names || []).forEach(m => (MUSCLE_MAP[(m || "").replace(/ /g, "_")] ||
                                MUSCLE_MAP[m] || []).forEach(x => out.add(x)));
    return out;
  };
  const prim = fold(primary), sec = fold(secondary);
  MUSCLE_SVG[view].forEach(part => part.p.forEach(pts => {
    const pg = document.createElementNS(NS, "polygon");
    pg.setAttribute("points", pts);
    if (prim.has(part.m)) pg.setAttribute("class", "is-prim");
    else if (sec.has(part.m)) pg.setAttribute("class", "is-sec");
    svg.appendChild(pg);
  }));
  return svg;
}
// Which view shows this muscle (front wins when visible in both).
const FRONT_REGIONS = new Set(MUSCLE_SVG.front.map(p => p.m));
function figView(muscle) {
  const regions = MUSCLE_MAP[(muscle || "").replace(/ /g, "_")] || MUSCLE_MAP[muscle] || [];
  return regions.length && !regions.some(r => FRONT_REGIONS.has(r)) ? "back" : "front";
}
// Thumbnail for a list row: the gymvisual still, else a muscle figure. The
// wrapper carries the slab (border/background) and the img only the dark-
// treatment filter — a filter on the slab itself would invert its ground
// colour to a pale flash while the image loads.
function exThumb(name, muscle, cls, onTap) {
  // With a tap action it becomes a button (the visible way into the info
  // sheet); inside the picker rows it stays a plain span (no nested buttons).
  const wrap = el(onTap ? "button" : "span", cls);
  if (onTap) { wrap.type = "button"; wrap.title = "Exercise info";
               wrap.addEventListener("click", onTap); }
  const url = gvStill(name);
  if (url) {
    const im = el("img", "gv-media"); im.src = url; im.loading = "lazy"; im.alt = "";
    wrap.appendChild(im);
  } else {
    wrap.classList.add("is-fig");
    wrap.appendChild(muscleSvg(figView(muscle), muscle ? [muscle] : [], []));
  }
  return wrap;
}

// Saved per-exercise setup notes (seat height, pin, pad), keyed by exercise name.
let SETUPS = {};
async function loadSetups() {
  try { const r = await fetch(SETUP_URL); const d = await r.json(); SETUPS = d.setups || {}; }
  catch (e) { SETUPS = {}; }
  return SETUPS;
}

// ── Exercise catalogue (for add / swap pickers in the logger) ────────────────
let CATALOG = null;   // { items: [{name,muscle,equipment,days_ago}], bw: Set<name> }
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  try {
    const r = await fetch(EXLIST_URL);
    const d = await r.json();
    const list = d.exercises || [];
    CATALOG = { items: list,
                bw: new Set(list.filter(e => e.bodyweight).map(e => e.name)) };
  } catch (e) {
    CATALOG = { items: [], bw: new Set() };
  }
  return CATALOG;
}

// ── Floating exercise picker (Hevy-style) ───────────────────────────────────
// Full-height sheet: search box, body-part filter chips, and a scrollable list
// with each exercise's muscle · equipment and days-since-last-performed. With
// no query, recently-trained exercises float to the top (suggested alternates
// above them for swaps). A non-matching query offers "create new" → classify.
function daysLabel(d) {
  if (d == null) return "never";
  if (d === 0) return "today";
  if (d === 1) return "1d ago";
  return d + "d ago";
}

function openExercisePicker(opts, onPick) {
  const items = (CATALOG && CATALOG.items) || [];
  const byName = {};
  items.forEach(it => { byName[it.name] = it; });
  openSheet((sheet, close) => {
    sheet.classList.add("sheet--picker");
    sheet.appendChild(el("div", "sheet__title", opts.title || "Add exercise"));
    sheetClose(sheet, close);
    const inp = el("input", "picker__search");
    inp.type = "text"; inp.autocomplete = "off"; inp.placeholder = "Search exercises…";
    sheet.appendChild(inp);
    const regionRow = el("div", "picker__filters");
    sheet.appendChild(regionRow);
    const muscleRow = el("div", "picker__filters picker__filters--sub");
    sheet.appendChild(muscleRow);
    const list = el("div", "picker__list");
    sheet.appendChild(list);

    // Two-tier body-part filter: region first, then that region's muscles.
    const REGIONS = {
      "upper body": ["abdominals", "chest", "lats", "neck", "traps", "upper back",
                     "biceps", "forearms", "lower back", "shoulders", "triceps"],
      "lower body": ["abductors", "adductors", "calves", "glutes",
                     "hamstrings", "quadriceps"],
    };
    let region = "";   // "" | "upper body" | "lower body"
    let muscle = "";   // "" | a muscle within the active region
    const present = new Set(items.map(i => i.muscle).filter(Boolean));
    const matches = it => {
      if (muscle) return it.muscle === muscle;
      if (region) return REGIONS[region].includes(it.muscle);
      return true;
    };

    const pick = (name, isNew) => { close(); onPick(name, !!isNew); };

    const row = it => {
      const b = el("button", "picker__row"); b.type = "button";
      b.appendChild(exThumb(it.name, it.muscle, "picker__thumb"));
      const main = el("div", "picker__main");
      main.appendChild(el("div", "picker__name", it.name));
      const meta = [it.muscle, equipLabel(it.equipment)].filter(Boolean).join(" · ");
      if (meta) main.appendChild(el("div", "picker__meta", meta));
      b.appendChild(main);
      const d = el("span", "picker__days" + (it.days_ago != null && it.days_ago <= 7 ? " recent" : ""),
                   daysLabel(it.days_ago));
      b.appendChild(d);
      b.addEventListener("click", () => pick(it.name));
      return b;
    };

    function renderChips() {
      regionRow.textContent = "";
      muscleRow.textContent = "";
      const mk = (row, label, on, fn, cls, muscle) => {
        const c = el("button", "pchip" + (cls ? " " + cls : "") + (on ? " on" : ""));
        if (muscle) c.appendChild(muscleSvg(figView(muscle), [muscle], []));
        c.appendChild(document.createTextNode(label));
        c.type = "button";
        c.addEventListener("click", () => { fn(); renderChips(); renderList(); });
        row.appendChild(c);
      };
      mk(regionRow, "All", !region, () => { region = ""; muscle = ""; }, "pchip--region");
      Object.keys(REGIONS).forEach(r =>
        mk(regionRow, r, region === r, () => { region = r; muscle = ""; }, "pchip--region"));
      if (region) {
        mk(muscleRow, "all " + region, !muscle, () => { muscle = ""; });
        REGIONS[region].filter(m => present.has(m)).forEach(m =>
          mk(muscleRow, m, muscle === m, () => { muscle = m; }, "", m));
      }
      muscleRow.hidden = !region;
    }

    function renderList() {
      list.textContent = "";
      const q = (inp.value || "").trim().toLowerCase();
      let pool = items.filter(matches);

      if (!q) {
        // Suggested alternates first (swap flow), then most-recently-trained.
        const sugg = (opts.suggested || []).filter(n => n && matches(byName[n] || {}));
        if (sugg.length) {
          list.appendChild(el("div", "picker__hdr", "Suggested"));
          sugg.forEach(n => list.appendChild(row(byName[n] || { name: n, days_ago: null })));
          list.appendChild(el("div", "picker__hdr", "All exercises"));
        }
        pool = pool.slice().sort((a, b) => {
          const da = a.days_ago == null ? 1e9 : a.days_ago;
          const db = b.days_ago == null ? 1e9 : b.days_ago;
          return da - db || a.name.localeCompare(b.name);
        });
      } else {
        const starts = [], contains = [];
        for (const it of pool) {
          const nl = it.name.toLowerCase();
          if (nl.startsWith(q)) starts.push(it);
          else if (nl.indexOf(q) !== -1) contains.push(it);
        }
        pool = starts.concat(contains);
      }

      pool.slice(0, 80).forEach(it => list.appendChild(row(it)));
      if (!pool.length && !q) list.appendChild(el("div", "picker__empty", "No exercises here yet."));

      // Offer create-new whenever the typed name isn't an exact match.
      const typed = (inp.value || "").trim();
      if (typed && !items.some(i => i.name.toLowerCase() === q)) {
        const c = el("button", "picker__row picker__create"); c.type = "button";
        const main = el("div", "picker__main");
        main.appendChild(el("div", "picker__name", "＋ Create “" + typed + "”"));
        main.appendChild(el("div", "picker__meta", "new exercise — Claude will classify it"));
        c.appendChild(main);
        c.addEventListener("click", () => pick(typed, true));
        list.appendChild(c);
      }
    }

    inp.addEventListener("input", renderList);
    renderChips();
    renderList();
    setTimeout(() => inp.focus(), 0);
  });
}

function exerciseCard(ex, idx) {
  const card = el("div", "ex" + (ex.is_main_lift ? " main" : ""));

  // Row 1: tappable thumbnail (opens the info sheet) + name; History far right.
  // Row 2: meta chips in a fixed order (muscle · equipment · main · readiness).
  const head = el("div", "ex__head");
  const title = el("div", "ex__title");
  title.appendChild(exThumb(ex.exercise_name, ex.muscle_group, "ex__thumb",
    () => openHowTo(ex.exercise_name)));
  title.appendChild(el("span", "ex__name", ex.exercise_name));
  head.appendChild(title);
  const histBtn = el("button", "hist-btn", "History");
  histBtn.type = "button";
  histBtn.setAttribute("aria-expanded", "false");
  head.appendChild(histBtn);
  card.appendChild(head);

  const meta = el("div", "ex__meta");
  if (ex.muscle_group) meta.appendChild(el("span", "ex__tag", ex.muscle_group.replace(/_/g, " ")));
  if (ex.equipment_category) meta.appendChild(el("span", "ex__tag", equipLabel(ex.equipment_category)));
  if (ex.is_main_lift) meta.appendChild(el("span", "ex__tag ex__tag--main", "main lift"));
  if (ex.readiness && ex.readiness.rag && ex.readiness.rag !== "none") {
    const chip = el("span", "ready rag-" + ex.readiness.rag);
    chip.appendChild(el("span", "rag-dot"));
    chip.appendChild(document.createTextNode(ex.readiness.label));
    chip.title = ex.readiness.detail || "";
    meta.appendChild(chip);
  }
  if (meta.children.length) card.appendChild(meta);

  const sets = el("div", "sets");
  for (const g of groupSets(ex.sets, ex)) {
    const chip = el("div", "set" + (g.warm ? " warm" : ""));
    const n = g.count > 1 ? g.count + " × " : "";
    chip.innerHTML = (g.warm ? "warm-up · " : "") + n + "<b>" + g.reps + "</b> reps @ " + g.label;
    sets.appendChild(chip);
  }
  if (ex.predicted_rpe) {
    const p = el("div", "set pred", "~RPE " + ex.predicted_rpe);
    p.title = "Expected effort on the top set, from your e1RM";
    sets.appendChild(p);
  }
  card.appendChild(sets);

  if (ex.readiness && ex.readiness.state && ex.readiness.state !== "new" && ex.readiness.detail) {
    card.appendChild(el("div", "readnote", ex.readiness.detail));
  }

  if (ex.rest_seconds) {
    // Display only — the timer belongs to the logging view.
    card.appendChild(el("div", "rest", "Rest " + ex.rest_seconds + "s between sets"));
  }
  if (ex.notes) card.appendChild(el("div", "notes", ex.notes));
  if (ex.alternates && ex.alternates.length) {
    const alts = el("div", "alts");
    alts.appendChild(el("b", null, "Swap to: "));
    const status = el("span", "alts__status");
    for (const name of ex.alternates) {
      const b = el("button", "alt-btn", name);
      b.type = "button";
      b.title = "Replace " + ex.exercise_name + " with " + name
        + (CURRENT && CURRENT.uses_hevy === false ? " in this session" : " in your Hevy routine");
      b.addEventListener("click", () => doSwap(idx, name, status));
      alts.appendChild(b);
    }
    alts.appendChild(status);
    card.appendChild(alts);
  }

  // Lazily-loaded e1RM progression graph, toggled by the History button.
  const panel = el("div", "hist");
  panel.hidden = true;
  const colour = ex.is_main_lift ? ACCENT : INK;
  let loaded = false;
  histBtn.addEventListener("click", async () => {
    if (histBtn.getAttribute("aria-expanded") === "true") {
      panel.hidden = true;
      histBtn.setAttribute("aria-expanded", "false");
      histBtn.textContent = "History";
      return;
    }
    panel.hidden = false;
    panel.classList.add("srt-reveal");
    setTimeout(() => panel.classList.remove("srt-reveal"), 700);
    histBtn.setAttribute("aria-expanded", "true");
    histBtn.textContent = "Hide";
    if (loaded) return;
    loaded = true;
    panel.textContent = "";
    panel.appendChild(el("div", "hist__note", "Loading history…"));
    try {
      const r = await fetch(HIST_URL + "?name=" + encodeURIComponent(ex.exercise_name));
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      renderHistory(panel, d, colour);
    } catch (e2) {
      panel.textContent = "";
      panel.appendChild(el("div", "hist__note", "Couldn't load history (" + e2.message + ")."));
      loaded = false;  // let them retry
    }
  });
  card.appendChild(panel);
  return card;
}

// Swap one exercise for a listed alternate. The server re-posts the whole
// routine to Hevy and returns the updated workout, which we re-render.
async function doSwap(index, to, statusEl) {
  if (swapping) return;
  swapping = true;
  document.querySelectorAll(".alt-btn").forEach(b => b.disabled = true);
  statusEl.classList.remove("err");
  statusEl.textContent = "swapping in " + to + "…";
  try {
    const r = await fetch(SWAP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index, to }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    swapping = false;
    render(d);   // rebuild with the updated routine (buttons re-enabled fresh)
  } catch (e) {
    statusEl.classList.add("err");
    statusEl.textContent = "swap failed — " + e.message;
    document.querySelectorAll(".alt-btn").forEach(b => b.disabled = false);
    swapping = false;
  }
}

function renderHistory(panel, d, colour) {
  panel.textContent = "";
  const s = d.series || [];
  if (!s.length) {
    panel.appendChild(el("div", "hist__note",
      "No logged sets for this exercise yet — its e1RM progression will chart here once you train it."));
    return;
  }

  const sum = el("div", "hist__summary");
  const add = (k, v, cls) => {
    sum.appendChild(el("span", "k", k));
    sum.appendChild(el("span", "v" + (cls ? " " + cls : ""), v));
  };
  add("Latest", d.latest_e1rm + " kg e1RM");
  add("Best", d.best_e1rm + " kg");
  if (d.first_e1rm != null && s.length >= 2) {
    const delta = Math.round((d.latest_e1rm - d.first_e1rm) * 10) / 10;
    add("Change", (delta >= 0 ? "+" : "") + delta + " kg",
        delta > 0 ? "up" : delta < 0 ? "down" : "");
  }
  add("Sessions", String(d.sessions));
  panel.appendChild(sum);

  if (s.length < 2) {
    panel.appendChild(el("div", "hist__note",
      "Only one session logged — the progression graph fills in from the second."));
    return;
  }
  const chart = el("div", "chart");
  chart.appendChild(lineChart(s, colour));
  panel.appendChild(chart);
}

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Compact HUD-style e1RM line chart (area fade, graticule, glow, end markers).
function lineChart(series, colour) {
  const W = 300, H = 120, padL = 34, padR = 12, padT = 12, padB = 18;
  const gid = "wgrad" + Math.random().toString(36).slice(2, 8);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });

  const vals = series.map(p => p.e1rm);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => padL + (W - padL - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const x0 = padL, x1 = W - padR, yB = H - padB;

  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": colour, "stop-opacity": .38 }));
  grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": colour, "stop-opacity": 0 }));
  defs.appendChild(grad); svg.appendChild(defs);

  for (let i = 0; i <= 4; i++) {
    const gy = padT + (yB - padT) * i / 4;
    svg.appendChild(svgEl("line", { x1: x0, y1: gy, x2: x1, y2: gy,
      stroke: "currentColor", "stroke-opacity": .09 }));
  }
  for (const v of [lo + pad, hi - pad]) {
    const t = svgEl("text", { x: x0 - 4, y: y(v) + 3, "text-anchor": "end",
      "font-size": 8, "font-family": MONO, fill: "currentColor", "fill-opacity": .5 });
    t.textContent = Math.round(v); svg.appendChild(t);
  }

  const pts = series.map((p, i) => [x(i), y(p.e1rm)]);
  const areaD = `M${pts[0][0]},${yB} ` + pts.map(p => `L${p[0]},${p[1]}`).join(" ")
              + ` L${pts[pts.length - 1][0]},${yB} Z`;
  svg.appendChild(svgEl("path", { d: areaD, fill: `url(#${gid})`, stroke: "none" }));

  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  const trace = svgEl("path", { d, fill: "none", stroke: colour, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round" });
  svg.appendChild(trace);

  if (series.length <= 40) {
    pts.forEach((p, i) => {
      const m = svgEl("rect", { x: p[0] - 1.5, y: p[1] - 1.5, width: 3, height: 3,
        fill: colour });
      const pt = series[i];
      const set = (pt.weight ? pt.weight + "kg × " + pt.reps : "BW × " + pt.reps);
      const title = svgEl("title", {});
      title.textContent = pt.date + " · " + set + " · e1RM " + pt.e1rm + "kg";
      m.appendChild(title);
      svg.appendChild(m);
    });
  }
  return svg;
}

const SESSION_LABEL = { push: "Push", pull: "Pull", legs: "Legs", arms: "Arms" };

function comingUp(seq) {

// ── Logging mode ────────────────────────────────────────────────────────────
// A session is logged as an in-memory MODEL (list of exercises, each with set
// rows: {weight, reps, rpe, type, done}). Seeded from the prescription, then
// overlaid with any previously-saved session or an unsaved localStorage draft.
let MODEL = null;

function draftKey() {
  const d = (CURRENT && CURRENT.date) || new Date().toISOString().slice(0, 10);
  return "log:" + USER + ":" + d;
}
function saveDraft() {
  try { localStorage.setItem(draftKey(), JSON.stringify(MODEL)); } catch (e) {}
}
function clearDraft() {
  try { localStorage.removeItem(draftKey()); } catch (e) {}
  try { localStorage.removeItem(draftKey() + ":stretch"); } catch (e) {}
}
function saveStretchDraft() {
  try { localStorage.setItem(draftKey() + ":stretch", JSON.stringify(STRETCH)); } catch (e) {}
}
function loadStretchDraft() {
  try { const r = localStorage.getItem(draftKey() + ":stretch"); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function loadDraft() {
  try { const r = localStorage.getItem(draftKey()); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
// Throw away the in-progress (unsaved) workout entirely: draft, session clock,
// timer. Does NOT touch anything already saved to the DB this day.
function discardWorkout() {
  if (!confirm("Discard this in-progress workout? Any sets you haven't saved will be lost.")) return;
  clearDraft();
  clearSessionStart();
  RT.hideBar();
  LOGGING = false;
  render(CURRENT);
}

// ── Total session clock (counts up from first entry into logging) ────────────
function startKey() {
  const d = (CURRENT && CURRENT.date) || new Date().toISOString().slice(0, 10);
  return "logstart:" + USER + ":" + d;
}
function sessionStart() {
  let t = 0;
  try { t = parseInt(localStorage.getItem(startKey()) || "0", 10); } catch (e) {}
  if (!t) { t = Date.now(); try { localStorage.setItem(startKey(), String(t)); } catch (e) {} }
  return t;
}
function clearSessionStart() { try { localStorage.removeItem(startKey()); } catch (e) {} }
function fmtClock(ms) {
  let s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}

// Prefill a freshly-added/swapped exercise from its last logged session:
// attach the full set list (PREVIOUS column) and fill blank weight/reps.
async function seedFromHistory(mex) {
  try {
    const r = await fetch(HIST_URL + "?name=" + encodeURIComponent(mex.exercise_name));
    const d = await r.json();
    if (d.previous && d.previous.sets && d.previous.sets.length) {
      mex.previous = d.previous.sets;
      mex.prev_date = d.previous.date;
    }
    const s = d.series || [];
    if (!s.length) return;
    const last = s[s.length - 1];
    const w = last.weight || 0, reps = last.reps || 0;
    mex.sets.forEach(set => {                    // fill blanks only — never clobber typed values
      if (!set.done && !set.weight) set.weight = w;
      if (!set.done && !set.reps)   set.reps = reps;
    });
  } catch (e) {}
}

// ── Bottom sheets: set-type classifier + RPE picker (Hevy-style) ─────────────
function openSheet(build) {
  const overlay = el("div", "sheet-overlay");
  const sheet = el("div", "sheet");
  // Lock the page behind the sheet — without this, inner scrolls chain to
  // the body on iOS and the workout scrolls under the popup.
  document.body.classList.add("sheet-open");
  const close = () => { overlay.classList.add("closing");
                        document.body.classList.remove("sheet-open");
                        setTimeout(() => overlay.remove(), 200); };
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  build(sheet, close);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add("open"));
  return close;
}

// Square hairline ✕ in the sheet's top corner — the visible way out
// (backdrop tap still works).
function sheetClose(sheet, close) {
  const b = el("button", "sheet__close", "✕"); b.type = "button";
  b.title = "Close";
  b.addEventListener("click", close);
  sheet.appendChild(b);
}

const SET_TYPES = [
  { key: "warmup",  badge: "W", label: "Warm-up set", cls: "st-warm" },
  { key: "normal",  badge: "1", label: "Normal set",  cls: "st-normal" },
  { key: "failure", badge: "F", label: "Failure set", cls: "st-fail" },
  { key: "drop",    badge: "D", label: "Drop set",    cls: "st-drop" },
];
const SET_TYPE_BY = Object.fromEntries(SET_TYPES.map(t => [t.key, t]));
function setType(mset) { return mset.type || (mset.warmup ? "warmup" : "normal"); }
function isWarm(mset)  { return setType(mset) === "warmup"; }

function openSetType(mset, mex, rerender) {
  openSheet((sheet, close) => {
    sheet.appendChild(el("div", "sheet__title", "Select set type"));
    SET_TYPES.forEach(t => {

      row.appendChild(el("span", "sheet__optlabel", t.label));

    });

}

const RPE_VALUES = [6, 7, 7.5, 8, 8.5, 9, 9.5, 10];
const RPE_DESC = {
  6:   "could definitely do 4 more",
  7:   "could definitely do 3 more",
  7.5: "could maybe do 3 more",
  8:   "could definitely do 2 more",
  8.5: "could maybe do 2 more",
  9:   "could definitely do 1 more",
  9.5: "could maybe do 1 more",

};
