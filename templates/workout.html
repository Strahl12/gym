<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Today's Workout — {{ user }}</title>
<link rel="stylesheet" href="/static/tdr.css?v=8">
<style>
  body { margin: 0; }
  main { padding: 1rem; max-width: 720px; margin: 0 auto;
         padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
  .muted { color: var(--dim); }
  .empty { background: var(--panel); border: 1px solid var(--line); padding: 1.1rem 1rem;
           font-size: .88rem; color: var(--dim); line-height: 1.55; }
  .empty b { color: var(--cyan); }
  .empty a { color: var(--cyan); }

  /* Session banner */
  .banner { background: var(--panel); border: 1px solid var(--line);
            border-left: 2px solid var(--magenta); box-shadow: -3px 0 12px rgba(255,0,102,.14);
            padding: .9rem 1rem; margin-bottom: 1rem; }
  .banner__type { display: inline-block; font-family: var(--mono); font-size: .62rem;
                  letter-spacing: .16em; text-transform: uppercase; color: #05050a;
                  background: var(--magenta); padding: .16rem .55rem; margin-bottom: .5rem;
                  box-shadow: 0 0 12px rgba(255,0,102,.5); }
  .banner__title { font-family: var(--mono); font-size: .96rem; font-weight: 700;
                   letter-spacing: .02em; color: var(--ink); line-height: 1.35; }
  .banner__when { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em;
                  text-transform: uppercase; margin-top: .5rem; }
  .banner__when.today { color: var(--lime); text-shadow: 0 0 8px rgba(182,255,0,.6); }
  .banner__when.stale { color: var(--dim); }
  .banner__meta { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
                  text-transform: uppercase; color: var(--dim); margin-top: .3rem; }

  /* Adaptive "coming up" forecast strip */
  .coming { margin: 0 0 1rem; padding: .7rem .8rem; background: var(--panel);
            border: 1px solid var(--line); }
  .coming__label { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em;
                   text-transform: uppercase; color: var(--dim); margin-bottom: .5rem; }
  .coming__row { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  .coming__chip { font-family: var(--mono); font-size: .68rem; font-weight: 700;
                  letter-spacing: .06em; text-transform: uppercase; padding: .2rem .5rem;
                  border: 1px solid var(--line); opacity: .6; }
  .coming__chip.now { opacity: 1; }
  .coming__arrow { color: var(--dim); font-size: .8rem; }
  .coming__note { font-size: .7rem; color: var(--dim); line-height: 1.45; margin-top: .55rem; }

  /* One card per exercise */
  .ex { background: var(--panel); border: 1px solid var(--line);
        border-left: 2px solid var(--cyan); box-shadow: -3px 0 12px rgba(0,229,255,.12);
        margin-bottom: .9rem; padding: .8rem .9rem; }
  .ex.main { border-left-color: var(--lime); box-shadow: -3px 0 12px rgba(182,255,0,.15); }
  .ex__head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .ex__name { font-family: var(--mono); font-size: .9rem; font-weight: 700;
              letter-spacing: .03em; text-transform: uppercase; color: var(--cyan);
              text-shadow: 0 0 9px rgba(0,229,255,.55); }
  .ex.main .ex__name { color: var(--lime); text-shadow: 0 0 9px rgba(182,255,0,.6); }
  .ex__tag { font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
             text-transform: uppercase; color: var(--dim);
             border: 1px solid var(--line); padding: .08rem .4rem; }
  .ex__flag { font-family: var(--mono); font-size: .56rem;
              letter-spacing: .12em; text-transform: uppercase; color: var(--lime);
              text-shadow: 0 0 8px rgba(182,255,0,.5); }
  .ready { font-family: var(--mono); font-size: .55rem; letter-spacing: .08em;
           text-transform: uppercase; padding: .1rem .42rem; border: 1px solid;
           white-space: nowrap; }
  .ready--ready { color: var(--lime); border-color: var(--lime); text-shadow: 0 0 7px rgba(182,255,0,.5); }
  .ready--build { color: var(--cyan); border-color: var(--cyan); }
  .ready--hold  { color: #ffb300; border-color: #ffb300; }
  .ready--ease  { color: var(--danger); border-color: var(--danger); }
  .readnote { font-family: var(--mono); font-size: .6rem; letter-spacing: .03em;
              color: var(--dim); margin-top: .45rem; line-height: 1.4; }
  .hist-btn { margin-left: auto; font-family: var(--mono); font-size: .56rem;
              letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
              background: transparent; border: 1px solid var(--line); border-radius: 0;
              padding: .16rem .5rem; cursor: pointer; white-space: nowrap; }
  .hist-btn:hover, .hist-btn[aria-expanded="true"] { color: var(--cyan); border-color: var(--cyan);
              box-shadow: inset 0 0 0 1px rgba(0,229,255,.3), 0 0 8px rgba(0,229,255,.35);
              text-shadow: 0 0 8px rgba(0,229,255,.7); }

  /* Per-exercise history panel (revealed under the card) */
  .hist { margin-top: .7rem; border-top: 1px solid rgba(255,255,255,.07); padding-top: .7rem;
          animation: fadeIn .3s ease both; }
  .hist__summary { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-bottom: .5rem;
                   font-family: var(--mono); font-size: .62rem; letter-spacing: .05em; }
  .hist__summary .k { color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
  .hist__summary .v { color: var(--cyan); font-weight: 700; }
  .hist__summary .v.up { color: var(--lime); } .hist__summary .v.down { color: var(--danger); }
  .hist__note { font-size: .8rem; color: var(--dim); line-height: 1.5; }
  .chart svg { width: 100%; height: 120px; display: block; overflow: visible;
               color: var(--ink); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .sets { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 .1rem; }
  .set { font-family: var(--mono); font-size: .74rem; font-weight: 700; letter-spacing: .03em;
         color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
         padding: .22rem .55rem; }
  .set.warm { color: var(--dim); font-weight: 500; border-style: dashed; }
  .set b { color: var(--cyan); font-weight: 700; }
  .ex.main .set b { color: var(--lime); }
  .rest { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em;
          text-transform: uppercase; color: var(--dim); margin-top: .5rem; }
  .notes { font-size: .86rem; line-height: 1.5; color: var(--ink); margin-top: .55rem;
           white-space: pre-wrap; overflow-wrap: break-word; }
  .alts { font-family: var(--mono); font-size: .62rem; letter-spacing: .04em; color: var(--dim);
          margin-top: .55rem; line-height: 1.8; }
  .alts b { color: var(--cyan); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .alt-btn { font-family: var(--mono); font-size: .62rem; letter-spacing: .03em; color: var(--cyan);
             background: transparent; border: 1px solid var(--line); border-radius: 0;
             padding: .12rem .5rem; margin: 0 .3rem .1rem 0; cursor: pointer; white-space: nowrap; }
  .alt-btn:hover { border-color: var(--cyan);
             box-shadow: inset 0 0 0 1px rgba(0,229,255,.3), 0 0 8px rgba(0,229,255,.35);
             text-shadow: 0 0 8px rgba(0,229,255,.7); }
  .alt-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .alts__status { font-family: var(--mono); font-size: .58rem; letter-spacing: .06em;
                  color: var(--dim); margin-left: .3rem; }
  .alts__status.err { color: var(--danger); }

  /* ── Logging mode ─────────────────────────────────────────── */
  .logbtn { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em;
            text-transform: uppercase; color: var(--magenta); background: transparent;
            border: 1px solid var(--magenta); border-radius: 0; padding: .28rem .7rem;
            margin-top: .7rem; cursor: pointer; }
  .logbtn:hover { box-shadow: 0 0 10px rgba(255,0,102,.4); text-shadow: 0 0 8px rgba(255,0,102,.6); }
  .logbtn.on { color: #05050a; background: var(--magenta); }
  .ex.logging { border-left-color: var(--magenta); box-shadow: -3px 0 12px rgba(255,0,102,.14); }
  .setrow { display: flex; align-items: center; gap: .4rem; margin: .35rem 0;
            font-family: var(--mono); font-size: .74rem; }
  /* 16px min font on inputs stops iOS Safari auto-zooming on focus. */
  .setrow input[type=number] { width: 3.4rem; font-family: var(--mono); font-size: 16px;
            text-align: center; color: var(--ink); background: var(--panel-2);
            border: 1px solid var(--line); border-radius: 0; padding: .22rem .2rem; }
  .setrow input.rpe { width: 3rem; }
  .setrow input[type=number]:focus { outline: none; border-color: var(--cyan);
            box-shadow: inset 0 0 0 1px rgba(0,229,255,.3); }
  .setrow .x { color: var(--dim); }
  .setrow .warmtag { font-size: .55rem; letter-spacing: .08em; text-transform: uppercase;
            color: var(--dim); border: 1px solid var(--line); padding: .05rem .3rem; cursor: pointer; }
  .setrow .warmtag.on { color: #05050a; background: var(--dim); border-color: var(--dim); }
  .setrow .done { width: 1.15rem; height: 1.15rem; accent-color: var(--lime); cursor: pointer; }
  .setrow.is-done { opacity: .55; }
  .setrow .rm { margin-left: auto; color: var(--danger); background: transparent; border: none;
            font-size: 1rem; line-height: 1; cursor: pointer; padding: 0 .2rem; }
  .addset { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em;
            text-transform: uppercase; color: var(--cyan); background: transparent;
            border: 1px dashed var(--line); border-radius: 0; padding: .2rem .55rem;
            margin-top: .35rem; cursor: pointer; }
  .addset:hover { border-color: var(--cyan); }

  /* Bottom sheets (set-type + RPE pickers, Hevy-style) */
  .sheet-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.55);
                   display: flex; align-items: flex-end; opacity: 0; transition: opacity .16s ease; }
  .sheet-overlay.open { opacity: 1; }
  .sheet { width: 100%; max-width: 720px; margin: 0 auto; background: var(--panel);
           border-top: 1px solid var(--cyan); box-shadow: 0 -8px 30px rgba(0,229,255,.2);
           padding: .8rem 1rem calc(1rem + env(safe-area-inset-bottom));
           transform: translateY(14px); transition: transform .16s ease; }
  .sheet-overlay.open .sheet { transform: none; }
  .sheet__title { font-family: var(--mono); font-size: .8rem; font-weight: 700; text-align: center;
                  letter-spacing: .06em; color: var(--ink); padding: .3rem 0 .5rem; }
  .sheet__sub { font-family: var(--mono); font-size: .66rem; text-align: center; color: var(--dim);
                margin-bottom: .5rem; }
  .sheet__opt { display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left;
                background: transparent; border: 0; border-top: 1px solid var(--line);
                padding: .85rem .3rem; cursor: pointer; color: var(--ink); font: inherit; }
  .sheet__opt:hover { background: var(--panel-2); }
  .sheet__optlabel { font-family: var(--mono); font-size: .82rem; letter-spacing: .02em; }
  .sheet__opt.danger .sheet__optlabel { color: var(--danger); }
  /* Set-type badge (row + sheet) */
  .st-badge { display: inline-flex; align-items: center; justify-content: center;
              width: 1.55rem; height: 1.55rem; flex: none; font-family: var(--mono);
              font-size: .78rem; font-weight: 800; border: 1px solid var(--line);
              background: var(--panel-2); border-radius: 0; cursor: pointer; }
  .st-warm   { color: #ffb300; border-color: #ffb300; }
  .st-normal { color: var(--ink); }
  .st-fail   { color: var(--danger); border-color: var(--danger); }
  .st-drop   { color: var(--cyan); border-color: var(--cyan); }
  .st-remove { color: var(--danger); border-color: transparent; background: transparent; }
  /* RPE cell (row) + picker (sheet) */
  .rpe-cell { min-width: 2.9rem; font-family: var(--mono); font-size: 16px; text-align: center;
              color: var(--cyan); background: var(--panel-2); border: 1px solid var(--line);
              border-radius: 0; padding: .22rem .2rem; cursor: pointer; }
  .rpe-cell.empty { color: var(--dim); }
  .rpe-big { font-family: var(--mono); font-size: 2.6rem; font-weight: 800; text-align: center;
             color: var(--cyan); text-shadow: 0 0 14px rgba(0,229,255,.5); line-height: 1.1; }
  .rpe-hint { font-family: var(--mono); font-size: .72rem; text-align: center; color: var(--dim);
              margin: .1rem 0 .7rem; min-height: 1.1rem; line-height: 1.3; }
  .rpe-row { display: flex; flex-wrap: nowrap; gap: .25rem; justify-content: center; }
  .rpe-opt { flex: 1 1 0; min-width: 0; font-family: var(--mono); font-size: .82rem; font-weight: 700;
             color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 0;
             padding: .55rem .1rem; cursor: pointer; }
  .rpe-opt.on { color: #05050a; background: var(--cyan); border-color: var(--cyan);
                box-shadow: 0 0 12px rgba(0,229,255,.5); }
  .sheet__done { width: 100%; margin-top: .8rem; font-family: var(--mono); font-size: .8rem; font-weight: 700;
                 letter-spacing: .08em; text-transform: uppercase; color: #05050a; background: var(--lime);
                 border: 0; border-radius: 0; padding: .7rem; cursor: pointer; }
  .sheet__clear { width: 100%; margin-top: .4rem; font-family: var(--mono); font-size: .62rem;
                  letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
                  background: transparent; border: 1px solid var(--line); border-radius: 0;
                  padding: .5rem; cursor: pointer; }

  /* Add / swap exercise controls in the logger */
  .ex__ctl { font-family: var(--mono); font-size: .68rem; line-height: 1; color: var(--ink);
             background: transparent; border: 1px solid var(--line); border-radius: 0;
             padding: .2rem .45rem; cursor: pointer; }
  .ex__ctl.first { margin-left: auto; }
  .ex__ctl:hover { border-color: var(--cyan); color: var(--cyan); }
  .ex__ctl.del:hover { border-color: var(--danger); color: var(--danger); }
  .ex__pick { flex: 1 1 100%; font-family: var(--mono); font-size: 16px; color: var(--ink);
              background: var(--panel-2); border: 1px solid var(--cyan); border-radius: 0;
              padding: .3rem .5rem; }
  .ex__pick:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(0,229,255,.35); }
  .pickalts { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin: .5rem 0 .1rem; }
  .pickalts__lbl { font-family: var(--mono); font-size: .55rem; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--dim); }
  .addex { display: block; width: 100%; font-family: var(--mono); font-size: .62rem;
           letter-spacing: .1em; text-transform: uppercase; color: var(--cyan);
           background: transparent; border: 1px dashed var(--line); border-radius: 0;
           padding: .55rem; margin: .2rem 0 .3rem; cursor: pointer; }
  .addex:hover { border-color: var(--cyan); }
  .rest--btn { background: transparent; border: 1px solid var(--line); border-radius: 0;
               cursor: pointer; padding: .22rem .5rem; }
  .rest--btn:hover { color: var(--cyan); border-color: var(--cyan); }

  /* Rest timer — fixed neon bar pinned to the right edge, so the number keyboard
     (which covers the bottom) never hides it. */
  .rtimer { position: fixed; right: .4rem; top: 50%;
            transform: translate3d(0, -50%, 0);   /* 3d transform → own compositor layer,
                                                     so it never repaints/lags on scroll */
            will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            z-index: 60; display: flex; flex-direction: column; align-items: center; gap: .3rem;
            background: var(--panel); border: 1px solid var(--cyan);
            box-shadow: 0 0 16px rgba(0,229,255,.35); padding: .5rem .35rem; }
  .rtimer[hidden] { display: none; }
  .rtimer__rest { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
  .rtimer__rest[hidden] { display: none; }
  .rtimer__label { font-family: var(--mono); font-size: .5rem; letter-spacing: .06em;
                   text-transform: uppercase; color: var(--dim); max-width: 3.4rem;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .rtimer__time { font-family: var(--mono); font-size: 1.15rem; font-weight: 700; color: var(--cyan);
                  text-shadow: 0 0 9px rgba(0,229,255,.55); min-width: 2.8rem; text-align: center; }
  .rtimer__rest.done { animation: rtflash .6s steps(1) infinite; }
  .rtimer__rest.done .rtimer__time { color: var(--lime); text-shadow: 0 0 12px rgba(182,255,0,.7); }
  .rtimer__rest.done ~ .rtimer__totalbox .rtimer__total { color: var(--lime); }
  @keyframes rtflash { 50% { opacity: .5; } }
  .rtimer__ctl { display: flex; flex-direction: column; gap: .28rem; }
  .rtimer__btn { font-family: var(--mono); font-size: .62rem; color: var(--ink);
                 background: transparent; border: 1px solid var(--line); border-radius: 0;
                 padding: .2rem .35rem; cursor: pointer; min-width: 2.2rem; }
  .rtimer__btn:hover { border-color: var(--cyan); color: var(--cyan); }
  /* White TOTAL session clock, under the rest controls */
  .rtimer__totalbox { display: flex; flex-direction: column; align-items: center; gap: .05rem; }
  .rtimer__rest:not([hidden]) ~ .rtimer__totalbox { margin-top: .4rem; padding-top: .4rem;
                 border-top: 1px solid rgba(255,255,255,.14); }
  .rtimer__totallabel { font-family: var(--mono); font-size: .48rem; letter-spacing: .12em;
                 text-transform: uppercase; color: var(--dim); }
  .rtimer__total { font-family: var(--mono); font-size: .95rem; font-weight: 700; color: #fff;
                 text-shadow: 0 0 6px rgba(255,255,255,.35); text-align: center; }

  /* Live total-session time in the logging banner */
  .banner__clock { font-family: var(--mono); font-size: .74rem; font-weight: 700; letter-spacing: .06em;
                   color: var(--lime); text-shadow: 0 0 8px rgba(182,255,0,.5); margin-top: .4rem; }
  .banner__clock b { color: var(--dim); font-weight: 400; font-size: .58rem;
                     letter-spacing: .1em; text-transform: uppercase; }

  /* Per-exercise workout note in the logger */
  .exnote { display: block; width: 100%; box-sizing: border-box; font-family: var(--mono);
            font-size: 16px; color: var(--ink); background: var(--panel-2);
            border: 1px solid var(--line); border-radius: 0; padding: .28rem .45rem;
            margin-top: .45rem; }
  .exnote:focus { outline: none; border-color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(0,229,255,.3); }
  .exnote::placeholder { color: var(--dim); }
  .exsetup { color: var(--cyan); }
  .exsetup:focus { border-color: var(--cyan); }

  /* ── Neon boost while logging ─────────────────────────────────────────── */
  body.logging-active { background:
      radial-gradient(circle at 50% -12%, rgba(255,0,102,.10), transparent 55%), var(--bg); }
  body.logging-active .banner { border-color: var(--magenta);
      box-shadow: 0 0 18px rgba(255,0,102,.35), inset 0 0 22px rgba(255,0,102,.06); }
  body.logging-active .banner__title { color: var(--magenta); text-shadow: 0 0 10px rgba(255,0,102,.6); }
  body.logging-active .ex.logging { border: 1px solid var(--magenta);
      box-shadow: 0 0 14px rgba(255,0,102,.28), inset 0 0 14px rgba(255,0,102,.05); }
  body.logging-active .ex.logging .ex__name { color: var(--magenta); text-shadow: 0 0 9px rgba(255,0,102,.6); }
  body.logging-active .setrow input[type=number] { color: var(--cyan);
      border-color: rgba(0,229,255,.4); box-shadow: inset 0 0 8px rgba(0,229,255,.09);
      text-shadow: 0 0 6px rgba(0,229,255,.4); }
  body.logging-active .setrow input[type=number]:focus { border-color: var(--cyan);
      box-shadow: inset 0 0 0 1px var(--cyan), 0 0 12px rgba(0,229,255,.5); }
  /* Completed sets glow lime (positive) instead of fading out. */
  body.logging-active .setrow.is-done { opacity: 1; }
  body.logging-active .setrow.is-done input[type=number] { color: var(--lime);
      border-color: rgba(182,255,0,.5); text-shadow: 0 0 7px rgba(182,255,0,.5);
      box-shadow: inset 0 0 8px rgba(182,255,0,.12); }
  body.logging-active .addex, body.logging-active .addset { color: var(--cyan);
      border-color: rgba(0,229,255,.5); box-shadow: 0 0 8px rgba(0,229,255,.15); }
  body.logging-active .exnote { border-color: rgba(255,0,102,.4);
      box-shadow: inset 0 0 8px rgba(255,0,102,.06); }
  body.logging-active .exnote:focus { border-color: var(--magenta);
      box-shadow: inset 0 0 0 1px var(--magenta), 0 0 10px rgba(255,0,102,.4); }
  body.logging-active .logbar .save { box-shadow: 0 0 20px rgba(182,255,0,.6);
      animation: neonPulse 1.8s ease-in-out infinite; }
  @keyframes neonPulse { 50% { box-shadow: 0 0 30px rgba(182,255,0,.9); } }
  .logbar { position: sticky; bottom: 0; display: flex; gap: .6rem; margin-top: 1rem;
            padding: .8rem 0 calc(.4rem + env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .logbar button { flex: 1; font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
            text-transform: uppercase; border-radius: 0; padding: .6rem; cursor: pointer; }
  .logbar .save { color: #05050a; background: var(--lime); border: 1px solid var(--lime);
            font-weight: 700; box-shadow: 0 0 14px rgba(182,255,0,.4); }
  .logbar .save:disabled { opacity: .5; box-shadow: none; cursor: default; }
  .logbar .cancel { color: var(--dim); background: transparent; border: 1px solid var(--line); }
  .logstatus { font-family: var(--mono); font-size: .64rem; letter-spacing: .06em;
               text-align: center; margin-top: .6rem; color: var(--dim); }
  .logstatus.err { color: var(--danger); } .logstatus.ok { color: var(--lime); }
  .discardbtn { display: block; margin: .6rem auto 0; font-family: var(--mono); font-size: .6rem;
                letter-spacing: .1em; text-transform: uppercase; color: var(--danger);
                background: transparent; border: 1px solid transparent; border-radius: 0;
                padding: .3rem .6rem; cursor: pointer; opacity: .8; }
  .discardbtn:hover { opacity: 1; border-color: var(--danger); text-shadow: 0 0 8px rgba(255,45,85,.6); }
  .discardbtn.inline { display: inline-block; margin: .55rem 0 0 .5rem; }
  .draftflag { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em;
               text-transform: uppercase; color: var(--amber, #ffb300); margin-top: .3rem; }

  /* Reasoning */
  details.why { background: var(--panel); border: 1px solid var(--line); margin-top: 1.1rem; }
  details.why > summary { list-style: none; cursor: pointer; user-select: none;
      font-family: var(--mono); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--dim); padding: .7rem .9rem; }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary::after { content: " ▸"; color: var(--cyan); }
  details.why[open] > summary::after { content: " ▾"; }
  details.why[open] > summary { color: var(--cyan); }
  .why__body { font-size: .84rem; line-height: 1.55; color: var(--dim);
               padding: 0 .9rem .9rem; white-space: pre-wrap; overflow-wrap: break-word; }
</style>
</head>
<body>
<header class="hud">
  <div class="hud__bar">
    <span class="hud__brand"><b>■</b>WORKOUT</span>
    <span class="hud__jp">ワークアウト</span>
    <span class="tag">{{ user }}</span>
    <span class="hud__spacer"></span>
    <details class="hud__menu">
      <summary>Menu</summary>
      <div class="hud__menu-panel">
        <a href="{{ chat_url }}">▸ Chat</a>
        <a class="current" href="{{ chat_url }}/workout">▸ Workout</a>
        <a href="{{ chat_url }}/review">▸ Review</a>
        <a href="{{ chat_url }}/stats">▸ Stats</a>
        <a href="{{ chat_url }}/log">▸ Log</a>
      </div>
    </details>
  </div>
  <div class="hud__hazard"></div>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const DATA_URL = "{{ data_url }}";
const CHAT_URL = "{{ chat_url }}";
const USER     = "{{ user }}";
const HIST_URL = CHAT_URL + "/workout/history";
const SWAP_URL = CHAT_URL + "/workout/swap";
const LOG_URL    = CHAT_URL + "/workout/log";
const LOGGED_URL = CHAT_URL + "/workout/logged";
const EXLIST_URL = CHAT_URL + "/workout/exercises";
const SETUP_URL  = CHAT_URL + "/workout/setup";
const CYAN = "#00e5ff", LIME = "#b6ff00";
let swapping = false;   // one swap (Hevy PUT) at a time, across all cards
let LOGGING = false;    // editable logging mode on the Workout tab
let CURRENT = null;     // last /workout/data payload, for re-rendering on toggle
const SVGNS = "http://www.w3.org/2000/svg";
const MONO = "ui-monospace, Menlo, monospace";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en", { weekday: "short", day: "2-digit", month: "short" });
}

function isBodyweight(ex) {
  return (ex.exercise_type && ex.exercise_type.indexOf("bodyweight") !== -1)
      || ex.equipment_category === "none";
}

// Human label for a single set's load.
function loadLabel(set, ex) {
  const w = set.weight_kg || 0;
  if (isBodyweight(ex)) return w > 0 ? "BW +" + w + " kg" : "BW";
  return w > 0 ? w + " kg" : "—";
}

// Collapse consecutive identical sets into "N ×" groups.
function groupSets(sets, ex) {
  const out = [];
  for (const s of sets || []) {
    const label = loadLabel(s, ex);
    const warm = !!s.is_warmup;
    const last = out[out.length - 1];
    if (last && last.reps === s.reps && last.label === label && last.warm === warm) {
      last.count += 1;
    } else {
      out.push({ count: 1, reps: s.reps, label, warm });
    }
  }
  return out;
}

// ── Rest timer ──────────────────────────────────────────────────────────────
// One floating countdown, shared across view + logging. Auto-armed when a set is
// ticked done in the logger; also startable by tapping any exercise's rest line.
// Beeps + vibrates at zero. Pure client-side — no server state.
let _ac = null;
function _audio() {                    // lazily create + unlock (needs a user gesture)
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === "suspended") _ac.resume();
    return _ac;
  } catch (e) { return null; }
}
const SOUNDS = ["beep", "screamo", "off"];        // cycle order
const SOUND_ICON = { beep: "🔊", screamo: "🔥", off: "🔇" };
function soundMode() { try { return localStorage.getItem("rt:sound") || "beep"; } catch (e) { return "beep"; } }
function setSoundMode(m) { try { localStorage.setItem("rt:sound", m); } catch (e) {} }

// Timer alarm. "beep" = rising sine blips; "screamo" = harsh detuned + noise burst.
// iOS suspends the AudioContext between reps / when the screen dims, so resume it
// first and emit only once it's actually running (resume is async).
function playAlarm(mode) {
  mode = mode || soundMode();
  if (mode === "off") return;
  const ac = _audio();
  if (!ac) return;
  if (ac.state === "suspended") { ac.resume().then(() => _emit(mode, ac)).catch(() => {}); }
  else _emit(mode, ac);
}
function _emit(mode, ac) {
  const t0 = ac.currentTime;
  if (mode === "screamo") {
    const dur = 1.1;
    const master = ac.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(0.5, t0 + 0.03);
    master.gain.setValueAtTime(0.5, t0 + dur - 0.15);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    master.connect(ac.destination);
    const dist = ac.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 4); }
    dist.curve = curve; dist.connect(master);
    [110, 138, 220, 277].forEach(f => {
      const o = ac.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f * 1.5, t0 + dur);
      const g = ac.createGain(); g.gain.value = 0.25;
      o.connect(g); g.connect(dist); o.start(t0); o.stop(t0 + dur);
    });
    const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * 0.4;
    const ns = ac.createBufferSource(); ns.buffer = nb;
    const ng = ac.createGain(); ng.gain.value = 0.15;
    ns.connect(ng); ng.connect(dist); ns.start(t0); ns.stop(t0 + dur);
  } else {
    [660, 880, 1180].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      const s = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.15);
      o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + 0.16);
    });
  }
}

// Fixed neon bar pinned to the right-hand centre. Always shown while logging
// (with a white TOTAL session clock under the controls); the rest countdown
// appears above it when armed. Countdown is driven by an absolute end-time, so
// the alarm fires exactly when the display hits 0 (no drift between them).
const RT = {
  el: null, rest: null, disp: null, label: null, pauseBtn: null, soundBtn: null, totalEl: null,
  endAt: 0, remain: 0, total: 0, timer: null, running: false, resting: false,
  ensure() {
    if (this.el) return;
    const bar = el("div", "rtimer"); bar.hidden = true;
    const rest = el("div", "rtimer__rest"); rest.hidden = true;
    this.label = el("div", "rtimer__label", "Rest");
    this.disp  = el("div", "rtimer__time", "0:00");
    const ctl  = el("div", "rtimer__ctl");
    const mk = (t, fn) => { const b = el("button", "rtimer__btn", t); b.type = "button";
                            b.addEventListener("click", fn); return b; };
    this.soundBtn = mk(SOUND_ICON[soundMode()] || "🔊", () => this.cycleSound());
    this.soundBtn.title = "Alarm sound: " + soundMode() + " (tap to change)";
    ctl.appendChild(this.soundBtn);
    ctl.appendChild(mk("−15", () => this.bump(-15)));
    ctl.appendChild(mk("＋15", () => this.bump(15)));
    this.pauseBtn = mk("❚❚", () => this.toggle());
    ctl.appendChild(this.pauseBtn);
    ctl.appendChild(mk("✕", () => this.stopRest()));
    rest.appendChild(this.label); rest.appendChild(this.disp); rest.appendChild(ctl);
    this.rest = rest;

    const tot = el("div", "rtimer__totalbox");
    tot.appendChild(el("div", "rtimer__totallabel", "Total"));
    this.totalEl = el("div", "rtimer__total", "0:00");
    tot.appendChild(this.totalEl);

    bar.appendChild(rest); bar.appendChild(tot);
    document.body.appendChild(bar);
    this.el = bar;
  },
  fmt(s) { s = Math.max(0, Math.round(s));
           return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); },
  // Show the bar + drive the total clock (called on entering/rendering logging).
  showBar() { this.ensure(); this.el.hidden = false; this.loop(); },
  hideBar() { if (this.timer) clearInterval(this.timer); this.timer = null;
              this.resting = false; if (this.rest) this.rest.hidden = true;
              if (this.el) this.el.hidden = true; },
  loop() {
    clearInterval(this.timer);
    this.timer = setInterval(() => this.paint(), 250);
    this.paint();
  },
  paint() {
    if (this.totalEl) this.totalEl.textContent = fmtClock(Date.now() - sessionStart());
    if (!this.resting) return;
    if (this.running) this.remain = (this.endAt - Date.now()) / 1000;
    if (this.running && this.remain <= 0) { this.remain = 0; this.fire(); }
    this.disp.textContent = this.fmt(this.remain);
    this.rest.classList.toggle("done", this.remain <= 0);
    this.pauseBtn.textContent = this.running ? "❚❚" : "▶";
  },
  cycleSound() {
    const next = SOUNDS[(SOUNDS.indexOf(soundMode()) + 1) % SOUNDS.length];
    setSoundMode(next);
    this.soundBtn.textContent = SOUND_ICON[next];
    this.soundBtn.title = "Alarm sound: " + next + " (tap to change)";
    playAlarm(next);                 // preview + unlocks audio on this gesture
  },
  start(seconds, name) {
    this.ensure();
    _audio();                        // prime/unlock while we're in the tap that started it
    this.el.hidden = false;
    this.total  = Math.max(1, seconds || 90);
    this.remain = this.total;
    this.endAt  = Date.now() + this.total * 1000;
    this.running = true; this.resting = true;
    this.label.textContent = name ? "Rest · " + name : "Rest";
    this.rest.hidden = false; this.rest.classList.remove("done");
    this.loop();
  },
  fire() { this.running = false;
           try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
           playAlarm(); },
  toggle() {
    if (!this.resting) return;
    if (this.remain <= 0) { this.start(this.total, this.label.textContent.replace(/^Rest · /, "")); return; }
    if (this.running) { this.running = false; }                 // pause: freeze remain
    else { this.running = true; this.endAt = Date.now() + this.remain * 1000; }
    this.paint();
  },
  bump(d) { this.remain = Math.max(0, this.remain + d);
            this.endAt = Date.now() + this.remain * 1000;
            if (d > 0) this.rest.classList.remove("done"); this.paint(); },
  stopRest() { this.resting = false; this.running = false;
               if (this.rest) this.rest.hidden = true; this.paint(); },
};

// Saved per-exercise setup notes (seat height, pin, pad), keyed by exercise name.
let SETUPS = {};
async function loadSetups() {
  try { const r = await fetch(SETUP_URL); const d = await r.json(); SETUPS = d.setups || {}; }
  catch (e) { SETUPS = {}; }
  return SETUPS;
}

// ── Exercise catalogue (for add / swap pickers in the logger) ────────────────
let CATALOG = null;   // { names: [...], bw: Set<name> }
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  try {
    const r = await fetch(EXLIST_URL);
    const d = await r.json();
    const list = d.exercises || [];
    CATALOG = { names: list.map(e => e.name),
                bw: new Set(list.filter(e => e.bodyweight).map(e => e.name)) };
  } catch (e) {
    CATALOG = { names: [], bw: new Set() };
  }
  let dl = document.getElementById("exlist");
  if (!dl) { dl = el("datalist"); dl.id = "exlist"; document.body.appendChild(dl); }
  dl.textContent = "";
  CATALOG.names.forEach(n => { const o = el("option"); o.value = n; dl.appendChild(o); });
  return CATALOG;
}

function exerciseCard(ex, idx) {
  const card = el("div", "ex" + (ex.is_main_lift ? " main" : ""));

  const head = el("div", "ex__head");
  head.appendChild(el("span", "ex__name", ex.exercise_name));
  if (ex.muscle_group) head.appendChild(el("span", "ex__tag", ex.muscle_group.replace(/_/g, " ")));
  if (ex.equipment_category) head.appendChild(el("span", "ex__tag", ex.equipment_category));
  if (ex.is_main_lift) head.appendChild(el("span", "ex__flag", "★ Main lift"));
  if (ex.readiness && ex.readiness.state && ex.readiness.state !== "new") {
    const chip = el("span", "ready ready--" + ex.readiness.state, ex.readiness.label);
    chip.title = ex.readiness.detail || "";
    head.appendChild(chip);
  }

  const histBtn = el("button", "hist-btn", "◷ History");
  histBtn.type = "button";
  histBtn.setAttribute("aria-expanded", "false");
  head.appendChild(histBtn);
  card.appendChild(head);

  const sets = el("div", "sets");
  for (const g of groupSets(ex.sets, ex)) {
    const chip = el("div", "set" + (g.warm ? " warm" : ""));
    const n = g.count > 1 ? g.count + " × " : "";
    chip.innerHTML = (g.warm ? "warm-up · " : "") + n + "<b>" + g.reps + "</b> reps @ " + g.label;
    sets.appendChild(chip);
  }
  card.appendChild(sets);

  if (ex.readiness && ex.readiness.state && ex.readiness.state !== "new" && ex.readiness.detail) {
    card.appendChild(el("div", "readnote", ex.readiness.detail));
  }

  if (ex.rest_seconds) {
    const rest = el("button", "rest rest--btn", "▸ Rest " + ex.rest_seconds + "s between sets");
    rest.type = "button"; rest.title = "Start rest timer";
    rest.addEventListener("click", () => RT.start(ex.rest_seconds, ex.exercise_name));
    card.appendChild(rest);
  }
  if (ex.notes) card.appendChild(el("div", "notes", ex.notes));
  if (ex.alternates && ex.alternates.length) {
    const alts = el("div", "alts");
    alts.appendChild(el("b", null, "Swap to: "));
    const status = el("span", "alts__status");
    for (const name of ex.alternates) {
      const b = el("button", "alt-btn", name);
      b.type = "button";
      b.title = "Replace " + ex.exercise_name + " with " + name
        + (CURRENT && CURRENT.uses_hevy === false ? " in this session" : " in your Hevy routine");
      b.addEventListener("click", () => doSwap(idx, name, status));
      alts.appendChild(b);
    }
    alts.appendChild(status);
    card.appendChild(alts);
  }

  // Lazily-loaded e1RM progression graph, toggled by the History button.
  const panel = el("div", "hist");
  panel.hidden = true;
  const colour = ex.is_main_lift ? LIME : CYAN;
  let loaded = false;
  histBtn.addEventListener("click", async () => {
    if (histBtn.getAttribute("aria-expanded") === "true") {
      panel.hidden = true;
      histBtn.setAttribute("aria-expanded", "false");
      histBtn.textContent = "◷ History";
      return;
    }
    panel.hidden = false;
    histBtn.setAttribute("aria-expanded", "true");
    histBtn.textContent = "◷ Hide";
    if (loaded) return;
    loaded = true;
    panel.textContent = "";
    panel.appendChild(el("div", "hist__note", "Loading history…"));
    try {
      const r = await fetch(HIST_URL + "?name=" + encodeURIComponent(ex.exercise_name));
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      renderHistory(panel, d, colour);
    } catch (e2) {
      panel.textContent = "";
      panel.appendChild(el("div", "hist__note", "Couldn't load history (" + e2.message + ")."));
      loaded = false;  // let them retry
    }
  });
  card.appendChild(panel);
  return card;
}

// Swap one exercise for a listed alternate. The server re-posts the whole
// routine to Hevy and returns the updated workout, which we re-render.
async function doSwap(index, to, statusEl) {
  if (swapping) return;
  swapping = true;
  document.querySelectorAll(".alt-btn").forEach(b => b.disabled = true);
  statusEl.classList.remove("err");
  statusEl.textContent = "swapping in " + to + "…";
  try {
    const r = await fetch(SWAP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index, to }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    swapping = false;
    render(d);   // rebuild with the updated routine (buttons re-enabled fresh)
  } catch (e) {
    statusEl.classList.add("err");
    statusEl.textContent = "swap failed — " + e.message;
    document.querySelectorAll(".alt-btn").forEach(b => b.disabled = false);
    swapping = false;
  }
}

function renderHistory(panel, d, colour) {
  panel.textContent = "";
  const s = d.series || [];
  if (!s.length) {
    panel.appendChild(el("div", "hist__note",
      "No logged sets for this exercise yet — its e1RM progression will chart here once you train it."));
    return;
  }

  const sum = el("div", "hist__summary");
  const add = (k, v, cls) => {
    sum.appendChild(el("span", "k", k));
    sum.appendChild(el("span", "v" + (cls ? " " + cls : ""), v));
  };
  add("Latest", d.latest_e1rm + " kg e1RM");
  add("Best", d.best_e1rm + " kg");
  if (d.first_e1rm != null && s.length >= 2) {
    const delta = Math.round((d.latest_e1rm - d.first_e1rm) * 10) / 10;
    add("Change", (delta >= 0 ? "+" : "") + delta + " kg",
        delta > 0 ? "up" : delta < 0 ? "down" : "");
  }
  add("Sessions", String(d.sessions));
  panel.appendChild(sum);

  if (s.length < 2) {
    panel.appendChild(el("div", "hist__note",
      "Only one session logged — the progression graph fills in from the second."));
    return;
  }
  const chart = el("div", "chart");
  chart.appendChild(lineChart(s, colour));
  panel.appendChild(chart);
}

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Compact HUD-style e1RM line chart (area fade, graticule, glow, end markers).
function lineChart(series, colour) {
  const W = 300, H = 120, padL = 34, padR = 12, padT = 12, padB = 18;
  const gid = "wgrad" + Math.random().toString(36).slice(2, 8);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const glow = c => `filter: drop-shadow(0 0 2px ${c}) drop-shadow(0 0 6px ${c})`;

  const vals = series.map(p => p.e1rm);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => padL + (W - padL - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const x0 = padL, x1 = W - padR, yB = H - padB;

  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": colour, "stop-opacity": .38 }));
  grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": colour, "stop-opacity": 0 }));
  defs.appendChild(grad); svg.appendChild(defs);

  for (let i = 0; i <= 4; i++) {
    const gy = padT + (yB - padT) * i / 4;
    svg.appendChild(svgEl("line", { x1: x0, y1: gy, x2: x1, y2: gy,
      stroke: "currentColor", "stroke-opacity": .09 }));
  }
  for (const v of [lo + pad, hi - pad]) {
    const t = svgEl("text", { x: x0 - 4, y: y(v) + 3, "text-anchor": "end",
      "font-size": 8, "font-family": MONO, fill: "currentColor", "fill-opacity": .5 });
    t.textContent = Math.round(v); svg.appendChild(t);
  }

  const pts = series.map((p, i) => [x(i), y(p.e1rm)]);
  const areaD = `M${pts[0][0]},${yB} ` + pts.map(p => `L${p[0]},${p[1]}`).join(" ")
              + ` L${pts[pts.length - 1][0]},${yB} Z`;
  svg.appendChild(svgEl("path", { d: areaD, fill: `url(#${gid})`, stroke: "none" }));

  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  const trace = svgEl("path", { d, fill: "none", stroke: colour, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round" });
  trace.setAttribute("style", glow(colour));
  svg.appendChild(trace);

  if (series.length <= 40) {
    pts.forEach((p, i) => {
      const m = svgEl("rect", { x: p[0] - 1.5, y: p[1] - 1.5, width: 3, height: 3,
        fill: colour, style: glow(colour) });
      const pt = series[i];
      const set = (pt.weight ? pt.weight + "kg × " + pt.reps : "BW × " + pt.reps);
      const title = svgEl("title", {});
      title.textContent = pt.date + " · " + set + " · e1RM " + pt.e1rm + "kg";
      m.appendChild(title);
      svg.appendChild(m);
    });
  }
  return svg;
}

const SESSION_COLOURS = { push: "#00e5ff", pull: "#b6ff00", legs: "#ff6a00", arms: "#ff0066" };
const SESSION_LABEL   = { push: "Push", pull: "Pull", legs: "Legs", arms: "Arms" };

function comingUp(seq) {
  const box = el("div", "coming");
  box.appendChild(el("div", "coming__label", "Coming up"));
  const row = el("div", "coming__row");
  seq.forEach((st, i) => {
    if (i > 0) row.appendChild(el("span", "coming__arrow", "›"));
    const colour = SESSION_COLOURS[st] || CYAN;
    const chip = el("span", "coming__chip" + (i === 0 ? " now" : ""),
                    SESSION_LABEL[st] || st);
    chip.style.color = colour;
    chip.style.borderColor = colour;
    if (i === 0) chip.style.boxShadow = "0 0 8px " + colour + "66, inset 0 0 12px " + colour + "22";
    row.appendChild(chip);
  });
  box.appendChild(row);
  box.appendChild(el("div", "coming__note",
    "Forecast from your training pattern — not a fixed schedule. Train (or rest) any day; "
    + "if you do a different session, this re-plans around it."));
  return box;
}

// ── Logging mode ────────────────────────────────────────────────────────────
// A session is logged as an in-memory MODEL (list of exercises, each with set
// rows: {weight, reps, rpe, type, done}). Seeded from the prescription, then
// overlaid with any previously-saved session or an unsaved localStorage draft.
let MODEL = null;

function draftKey() {
  const d = (CURRENT && CURRENT.date) || new Date().toISOString().slice(0, 10);
  return "log:" + USER + ":" + d;
}
function saveDraft() {
  try { localStorage.setItem(draftKey(), JSON.stringify(MODEL)); } catch (e) {}
}
function clearDraft() {
  try { localStorage.removeItem(draftKey()); } catch (e) {}
}
function loadDraft() {
  try { const r = localStorage.getItem(draftKey()); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
// Throw away the in-progress (unsaved) workout entirely: draft, session clock,
// timer. Does NOT touch anything already saved to the DB this day.
function discardWorkout() {
  if (!confirm("Discard this in-progress workout? Any sets you haven't saved will be lost.")) return;
  clearDraft();
  clearSessionStart();
  RT.hideBar();
  LOGGING = false;
  render(CURRENT);
}

// ── Total session clock (counts up from first entry into logging) ────────────
function startKey() {
  const d = (CURRENT && CURRENT.date) || new Date().toISOString().slice(0, 10);
  return "logstart:" + USER + ":" + d;
}
function sessionStart() {
  let t = 0;
  try { t = parseInt(localStorage.getItem(startKey()) || "0", 10); } catch (e) {}
  if (!t) { t = Date.now(); try { localStorage.setItem(startKey(), String(t)); } catch (e) {} }
  return t;
}
function clearSessionStart() { try { localStorage.removeItem(startKey()); } catch (e) {} }
function fmtClock(ms) {
  let s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}

// Prefill a freshly-added/swapped exercise's blank sets from its last logged
// session (weight + reps), so you're not starting from zero.
async function seedFromHistory(mex) {
  try {
    const r = await fetch(HIST_URL + "?name=" + encodeURIComponent(mex.exercise_name));
    const d = await r.json();
    const s = d.series || [];
    if (!s.length) return;
    const last = s[s.length - 1];
    const w = last.weight || 0, reps = last.reps || 0;
    mex.sets.forEach(set => {                    // fill blanks only — never clobber typed values
      if (!set.done && !set.weight) set.weight = w;
      if (!set.done && !set.reps)   set.reps = reps;
    });
  } catch (e) {}
}

// ── Bottom sheets: set-type classifier + RPE picker (Hevy-style) ─────────────
function openSheet(build) {
  const overlay = el("div", "sheet-overlay");
  const sheet = el("div", "sheet");
  const close = () => { overlay.classList.remove("open");
                        setTimeout(() => overlay.remove(), 160); };
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  build(sheet, close);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add("open"));
  return close;
}

const SET_TYPES = [
  { key: "warmup",  badge: "W", label: "Warm Up Set", cls: "st-warm" },
  { key: "normal",  badge: "1", label: "Normal Set",  cls: "st-normal" },
  { key: "failure", badge: "F", label: "Failure Set", cls: "st-fail" },
  { key: "drop",    badge: "D", label: "Drop Set",    cls: "st-drop" },
];
const SET_TYPE_BY = Object.fromEntries(SET_TYPES.map(t => [t.key, t]));
function setType(mset) { return mset.type || (mset.warmup ? "warmup" : "normal"); }
function isWarm(mset)  { return setType(mset) === "warmup"; }

function openSetType(mset, mex, rerender) {
  openSheet((sheet, close) => {
    sheet.appendChild(el("div", "sheet__title", "Select Set Type"));
    SET_TYPES.forEach(t => {
      const row = el("button", "sheet__opt"); row.type = "button";
      row.appendChild(el("span", "st-badge " + t.cls, t.badge));
      row.appendChild(el("span", "sheet__optlabel", t.label));
      row.addEventListener("click", () => { mset.type = t.key; delete mset.warmup;
        saveDraft(); close(); rerender(); });
      sheet.appendChild(row);
    });
    const rm = el("button", "sheet__opt danger"); rm.type = "button";
    rm.appendChild(el("span", "st-badge st-remove", "✕"));
    rm.appendChild(el("span", "sheet__optlabel", "Remove Set"));
    rm.addEventListener("click", () => {
      mex.sets.splice(mex.sets.indexOf(mset), 1); saveDraft(); close(); rerender();
    });
    sheet.appendChild(rm);
  });
}

const RPE_VALUES = [6, 7, 7.5, 8, 8.5, 9, 9.5, 10];
const RPE_DESC = {
  6:   "could definitely do 4 more",
  7:   "could definitely do 3 more",
  7.5: "could maybe do 3 more",
  8:   "could definitely do 2 more",
  8.5: "could maybe do 2 more",
  9:   "could definitely do 1 more",
  9.5: "could maybe do 1 more",
  10:  "couldn't do any more",
};
function openRpe(mset, rerender) {
  openSheet((sheet, close) => {
    sheet.appendChild(el("div", "sheet__title", "Log Set RPE"));
    const sub = (mset.weight ? mset.weight + "kg × " : "") + (mset.reps || 0) + " reps";
    sheet.appendChild(el("div", "sheet__sub", sub));
    const has = mset.rpe !== "" && mset.rpe != null;
    const big = el("div", "rpe-big", has ? String(mset.rpe) : "—");
    sheet.appendChild(big);
    const desc = el("div", "rpe-hint",
      has ? (RPE_DESC[parseFloat(mset.rpe)] || "Select RPE") : "How hard was that set?");
    sheet.appendChild(desc);
    const row = el("div", "rpe-row");
    RPE_VALUES.forEach(v => {
      const b = el("button", "rpe-opt" + (parseFloat(mset.rpe) === v ? " on" : ""), String(v));
      b.type = "button";
      b.addEventListener("click", () => {
        mset.rpe = v; big.textContent = String(v); desc.textContent = RPE_DESC[v] || ""; saveDraft();
        row.querySelectorAll(".rpe-opt").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      });
      row.appendChild(b);
    });
    sheet.appendChild(row);
    const done = el("button", "sheet__done", "Done ✓"); done.type = "button";
    done.addEventListener("click", () => { close(); rerender(); });
    sheet.appendChild(done);
    const clr = el("button", "sheet__clear", "Clear"); clr.type = "button";
    clr.addEventListener("click", () => { mset.rpe = ""; saveDraft(); close(); rerender(); });
    sheet.appendChild(clr);
  });
}

// Build the editable model from the prescribed workout.
function modelFromPrescription(w) {
  return (w.exercises || []).map(ex => ({
    exercise_name: ex.exercise_name,
    is_bodyweight: isBodyweight(ex),
    rest_seconds: ex.rest_seconds || 90,
    alternates: (ex.alternates || []).slice(),
    setup: SETUPS[ex.exercise_name] || "",
    sets: (ex.sets || []).map(s => ({
      weight: s.weight_kg || 0, reps: s.reps || 0, rpe: "",
      type: s.is_warmup ? "warmup" : "normal", done: false,
    })),
  }));
}
// Overlay a saved/logged session (matched by exercise name) onto the model.
function overlaySaved(model, logged) {
  const byName = {};
  (logged.exercises || []).forEach(e => { byName[e.exercise_name] = e.sets; });
  model.forEach(m => {
    const saved = byName[m.exercise_name];
    if (saved) m.sets = saved.map(s => ({
      weight: s.weight_kg || 0, reps: s.reps || 0,
      rpe: s.rpe == null ? "" : s.rpe,
      type: s.set_type || (s.is_warmup ? "warmup" : "normal"), done: true,
    }));
  });
  return model;
}

function setRow(mset, mex, rerender) {
  const row = el("div", "setrow" + (mset.done ? " is-done" : ""));

  const done = el("input", "done"); done.type = "checkbox"; done.checked = mset.done;
  done.title = "Mark set completed";
  done.addEventListener("change", () => { mset.done = done.checked; saveDraft();
    row.classList.toggle("is-done", mset.done);
    if (mset.done && !isWarm(mset)) RT.start(mex.rest_seconds || 90, mex.exercise_name); });
  row.appendChild(done);

  // Set-type badge (W / 1 / F / D) — opens the classifier sheet.
  const t = SET_TYPE_BY[setType(mset)] || SET_TYPE_BY.normal;
  const badge = el("button", "st-badge " + t.cls, t.badge); badge.type = "button";
  badge.title = "Set type";
  badge.addEventListener("click", () => openSetType(mset, mex, rerender));
  row.appendChild(badge);

  // Highlight the whole value on focus so a new number types straight over it.
  const selectAll = inp => inp.addEventListener("focus", () => { try { inp.select(); } catch (e) {} });

  const w = el("input"); w.type = "number"; w.step = "2.5"; w.min = "0";
  w.value = mset.weight || ""; w.placeholder = mex.is_bodyweight ? "BW+" : "kg";
  w.inputMode = "decimal"; selectAll(w);
  w.addEventListener("input", () => { mset.weight = parseFloat(w.value) || 0; saveDraft(); });
  row.appendChild(w);

  row.appendChild(el("span", "x", "×"));

  const reps = el("input"); reps.type = "number"; reps.step = "1"; reps.min = "0";
  reps.value = mset.reps || ""; reps.placeholder = "reps"; reps.inputMode = "numeric"; selectAll(reps);
  reps.addEventListener("input", () => { mset.reps = parseInt(reps.value) || 0; saveDraft(); });
  row.appendChild(reps);

  const has = mset.rpe !== "" && mset.rpe != null;
  const rpeCell = el("button", "rpe-cell" + (has ? "" : " empty"), has ? String(mset.rpe) : "RPE");
  rpeCell.type = "button"; rpeCell.title = "Log RPE";
  rpeCell.addEventListener("click", () => openRpe(mset, rerender));
  row.appendChild(rpeCell);

  const rm = el("button", "rm", "×"); rm.type = "button"; rm.title = "Remove set";
  rm.addEventListener("click", () => {
    mex.sets.splice(mex.sets.indexOf(mset), 1); saveDraft(); rerender();
  });
  row.appendChild(rm);

  return row;
}

function loggerCard(mex, rerender) {
  const card = el("div", "ex logging");
  const head = el("div", "ex__head");

  if (mex._editing) {
    // Inline exercise picker (add or swap). Commit on ✓ or Enter; blank keeps old.
    const inp = el("input", "ex__pick");
    inp.type = "text"; inp.setAttribute("list", "exlist");
    inp.placeholder = "Search exercise…"; inp.value = mex.exercise_name || "";
    const commit = async () => {
      const v = inp.value.trim();
      if (v && v !== mex.exercise_name) {
        mex.exercise_name = v;
        mex.is_bodyweight = !!(CATALOG && CATALOG.bw.has(v));
        mex.setup = SETUPS[v] || "";
        await seedFromHistory(mex);            // suggest weight + reps from history
      }
      if (mex.exercise_name) { delete mex._editing; saveDraft(); rerender(); }
    };
    const pickName = async nm => {
      mex.exercise_name = nm;
      mex.is_bodyweight = !!(CATALOG && CATALOG.bw.has(nm));
      mex.setup = SETUPS[nm] || "";
      await seedFromHistory(mex);
      delete mex._editing; saveDraft(); rerender();
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
    const ok = el("button", "ex__ctl first", "✓"); ok.type = "button"; ok.title = "Confirm";
    ok.addEventListener("click", commit);
    head.appendChild(inp); head.appendChild(ok);
    card.appendChild(head);

    // Sensible same-slot alternates from the prescription, as quick-pick chips.
    const alts = (mex.alternates || []).filter(a => a && a !== mex.exercise_name);
    if (alts.length) {
      const box = el("div", "pickalts");
      box.appendChild(el("span", "pickalts__lbl", "Suggested:"));
      alts.forEach(nm => {
        const b = el("button", "alt-btn", nm); b.type = "button";
        b.addEventListener("click", () => pickName(nm));
        box.appendChild(b);
      });
      card.appendChild(box);
    }
    setTimeout(() => inp.focus(), 0);
  } else {
    head.appendChild(el("span", "ex__name", mex.exercise_name));
    const swap = el("button", "ex__ctl first", "⇄"); swap.type = "button";
    swap.title = "Swap this exercise";
    swap.addEventListener("click", () => { mex._editing = true; rerender(); });
    const del = el("button", "ex__ctl del", "✕"); del.type = "button";
    del.title = "Remove exercise";
    del.addEventListener("click", () => {
      if (mex.sets.some(s => s.done) &&
          !confirm("Remove " + mex.exercise_name + " and its logged sets?")) return;
      MODEL.splice(MODEL.indexOf(mex), 1); saveDraft(); rerender();
    });
    head.appendChild(swap); head.appendChild(del);
    card.appendChild(head);
  }

  mex.sets.forEach(mset => card.appendChild(setRow(mset, mex, rerender)));

  const add = el("button", "addset", "＋ set"); add.type = "button";
  add.addEventListener("click", () => {
    const last = mex.sets[mex.sets.length - 1];
    mex.sets.push(last
      ? { weight: last.weight, reps: last.reps, rpe: "", type: "normal", done: false }
      : { weight: 0, reps: 0, rpe: "", type: "normal", done: false });
    saveDraft(); rerender();
  });
  card.appendChild(add);

  const setup = el("input", "exnote exsetup"); setup.type = "text";
  setup.placeholder = "⚙ Setup — seat / pin / pad numbers (saved for next time)";
  setup.value = mex.setup || "";
  setup.addEventListener("input", () => { mex.setup = setup.value; saveDraft(); });
  card.appendChild(setup);

  const note = el("input", "exnote"); note.type = "text";
  note.placeholder = "Tag a note (form cue, pain, felt easy…)";
  note.value = mex.note || "";
  note.addEventListener("input", () => { mex.note = note.value; saveDraft(); });
  card.appendChild(note);
  return card;
}

async function enterLogging(w) {
  LOGGING = true;
  loadCatalog();                         // fire-and-forget; datalist ready shortly
  await loadSetups();                    // saved seat/pin numbers, before we build the model
  MODEL = modelFromPrescription(w);
  const draft = loadDraft();
  if (draft && draft.length) {
    MODEL = draft;                       // unsaved edits win
  } else {
    try {                                // else seed from an already-saved session
      const qs = CURRENT && CURRENT.date ? "?date=" + encodeURIComponent(CURRENT.date) : "";
      const r = await fetch(LOGGED_URL + qs);
      const d = await r.json();
      if (d.logged) overlaySaved(MODEL, d.logged);
    } catch (e) {}
  }
  renderLogger(w);
}

function renderLogger(w) {
  document.body.classList.add("logging-active");
  const editing = !!(MODEL && MODEL.some(m => m._editing));
  const keepY = window.scrollY;
  const main = document.getElementById("main");
  main.textContent = "";

  const banner = el("div", "banner");
  if (w.session_type) banner.appendChild(el("span", "banner__type", w.session_type));
  banner.appendChild(el("div", "banner__title", "Logging — " + (w.title || "session")));
  banner.appendChild(el("div", "banner__meta",
    "Enter what you actually did. Tick each set as you go — saved to this device."));
  main.appendChild(banner);
  sessionStart();          // stamp the session start (drives the sidebar TOTAL clock)
  RT.showBar();
  if (loadDraft()) main.appendChild(el("div", "draftflag", "● unsaved draft restored"));

  const rerender = () => renderLogger(w);
  MODEL.forEach(mex => main.appendChild(loggerCard(mex, rerender)));

  const addEx = el("button", "addex", "＋ Add exercise"); addEx.type = "button";
  addEx.addEventListener("click", () => {
    MODEL.push({ exercise_name: "", is_bodyweight: false, rest_seconds: 90, _editing: true,
                 alternates: [], setup: "",
                 sets: [{ weight: 0, reps: 0, rpe: "", type: "normal", done: false }] });
    saveDraft(); rerender();
  });
  main.appendChild(addEx);

  const status = el("div", "logstatus");
  const bar = el("div", "logbar");
  const save = el("button", "save", "✓ Finish & save"); save.type = "button";
  const cancel = el("button", "cancel", "Cancel"); cancel.type = "button";
  cancel.addEventListener("click", () => { LOGGING = false; render(CURRENT); });
  save.addEventListener("click", () => saveSession(w, save, status));
  bar.appendChild(cancel); bar.appendChild(save);
  main.appendChild(bar);
  main.appendChild(status);

  const discard = el("button", "discardbtn", "✕ Discard this workout");
  discard.type = "button";
  discard.addEventListener("click", discardWorkout);
  main.appendChild(discard);

  // Keep the scroll position across rebuilds so the page doesn't jump (unless a
  // picker just opened, where we want the focused input scrolled into view).
  if (!editing) requestAnimationFrame(() => window.scrollTo(0, keepY));
}

async function saveSession(w, saveBtn, status) {
  const exercises = MODEL.map(mex => ({
    exercise_name: mex.exercise_name,
    note: (mex.note || "").trim() || undefined,
    sets: mex.sets
      .filter(s => (s.reps || 0) > 0)
      .map(s => { const type = setType(s);
                  return { weight_kg: s.weight || 0, reps: s.reps || 0,
                           rpe: s.rpe === "" ? null : parseFloat(s.rpe),
                           is_warmup: type === "warmup", set_type: type }; }),
  })).filter(e => e.sets.length);

  // Setups persist independently of whether sets were logged this time.
  const setups = MODEL.filter(m => (m.setup || "").trim() && m.exercise_name)
                      .map(m => ({ exercise: m.exercise_name, setup: m.setup.trim() }));

  if (!exercises.length) {
    status.className = "logstatus err";
    status.textContent = "Add at least one set with reps before saving.";
    return;
  }
  saveBtn.disabled = true;
  status.className = "logstatus"; status.textContent = "Saving…";
  try {
    const r = await fetch(LOG_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: CURRENT.date, session_type: w.session_type,
                             workout_name: w.title, exercises, setups }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    clearDraft();
    clearSessionStart();
    status.className = "logstatus ok";
    status.textContent = "✓ Saved " + d.sets_written + " sets — your coach can see it now.";
    setTimeout(() => { LOGGING = false; render(CURRENT); }, 1400);
  } catch (e) {
    saveBtn.disabled = false;
    status.className = "logstatus err";
    status.textContent = "Save failed — " + e.message;
  }
}

function render(d) {
  CURRENT = d;
  if (LOGGING && d && d.workout) { renderLogger(d.workout); return; }
  document.body.classList.remove("logging-active");
  RT.hideBar();
  const main = document.getElementById("main");
  main.textContent = "";

  const w = d.workout;
  if (!w) {
    const box = el("div", "empty");
    const where = d.uses_hevy === false
      ? "Your coach programmes a session on training days — once one's ready it shows up here."
      : "Your coach programmes a workout into your Hevy app on training days — once one's posted it shows up here.";
    box.innerHTML = "No prescribed session yet. " + where + " Ask in the "
      + "<b><a href=\"" + CHAT_URL + "\">chat</a></b> to generate today's session.";
    main.appendChild(box);
    return;
  }

  const exercises = w.exercises || [];
  const working = exercises.reduce(
    (a, ex) => a + (ex.sets || []).filter(s => !s.is_warmup).length, 0);

  const banner = el("div", "banner");
  if (w.session_type) banner.appendChild(el("span", "banner__type", w.session_type));
  banner.appendChild(el("div", "banner__title", w.title || "Prescribed session"));
  const when = el("div", "banner__when " + (d.is_today ? "today" : "stale"));
  when.textContent = d.is_today
    ? "▸ Today's session"
    : "▸ Prescribed " + fmtDate(d.date) + " — no newer session yet";
  banner.appendChild(when);
  banner.appendChild(el("div", "banner__meta",
    exercises.length + (exercises.length === 1 ? " exercise" : " exercises")
    + " · " + working + " working sets"));
  const logBtn = el("button", "logbtn" + (loadDraft() ? " on" : ""),
    loadDraft() ? "▸ Resume logging" : "▸ Log this session");
  logBtn.type = "button";
  logBtn.addEventListener("click", () => enterLogging(w));
  banner.appendChild(logBtn);
  if (loadDraft()) {
    const disc = el("button", "discardbtn inline", "✕ Discard");
    disc.type = "button";
    disc.addEventListener("click", discardWorkout);
    banner.appendChild(disc);
  }
  main.appendChild(banner);

  if (d.upcoming && d.upcoming.length) main.appendChild(comingUp(d.upcoming));

  exercises.forEach((ex, i) => main.appendChild(exerciseCard(ex, i)));

  if (w.reasoning) {
    const det = el("details", "why");
    det.appendChild(el("summary", null, "Why this session"));
    det.appendChild(el("div", "why__body", w.reasoning));
    main.appendChild(det);
  }
}

// Re-arm audio when returning to the tab (iOS suspends the context in background).
document.addEventListener("visibilitychange", () => { if (!document.hidden) _audio(); });

fetch(DATA_URL)
  .then(r => r.json())
  .then(d => { if (d.error) throw new Error(d.error); render(d); })
  .catch(e => {
    document.getElementById("main").innerHTML =
      '<p class="muted">Could not load your workout (' + e.message + ').</p>';
  });
</script>
