<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Workout — {{ user }}</title>
<link rel="stylesheet" href="/static/tdr.css?v=8">
<style>
  body { margin: 0; }
  main { padding: 1rem; max-width: 720px; margin: 0 auto;
         padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
  .muted { color: var(--dim); }
  .empty { background: var(--panel); border: 1px solid var(--line); padding: 1.1rem 1rem;
           font-size: .88rem; color: var(--dim); line-height: 1.55; }
  .empty b { color: var(--cyan); }
  .empty a { color: var(--cyan); }

  /* Session banner */
  .banner { background: var(--panel); border: 1px solid var(--line);
            border-left: 2px solid var(--magenta); box-shadow: -3px 0 12px rgba(255,0,102,.14);
            padding: .9rem 1rem; margin-bottom: 1rem; }
  .banner__type { display: inline-block; font-family: var(--mono); font-size: .62rem;
                  letter-spacing: .16em; text-transform: uppercase; color: #05050a;
                  background: var(--magenta); padding: .16rem .55rem; margin-bottom: .5rem;
                  box-shadow: 0 0 12px rgba(255,0,102,.5); }
  .banner__title { font-family: var(--mono); font-size: .96rem; font-weight: 700;
                   letter-spacing: .02em; color: var(--ink); line-height: 1.35; }
  .banner__when { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em;
                  text-transform: uppercase; margin-top: .5rem; }
  .banner__when.today { color: var(--lime); text-shadow: 0 0 8px rgba(182,255,0,.6); }
  .banner__when.stale { color: var(--dim); }
  .banner__meta { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
                  text-transform: uppercase; color: var(--dim); margin-top: .3rem; }

  /* Adaptive "coming up" forecast strip */
  .coming { margin: 0 0 1rem; padding: .7rem .8rem; background: var(--panel);
            border: 1px solid var(--line); }
  .coming__label { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em;
                   text-transform: uppercase; color: var(--dim); margin-bottom: .5rem; }
  .coming__row { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  .coming__chip { font-family: var(--mono); font-size: .68rem; font-weight: 700;
                  letter-spacing: .06em; text-transform: uppercase; padding: .2rem .5rem;
                  border: 1px solid var(--line); opacity: .6; }
  .coming__chip.now { opacity: 1; }
  .coming__arrow { color: var(--dim); font-size: .8rem; }
  .coming__note { font-size: .7rem; color: var(--dim); line-height: 1.45; margin-top: .55rem; }

  /* One card per exercise */
  .ex { background: var(--panel); border: 1px solid var(--line);
        border-left: 2px solid var(--cyan); box-shadow: -3px 0 12px rgba(0,229,255,.12);
        margin-bottom: .9rem; padding: .8rem .9rem; }
  .ex.main { border-left-color: var(--lime); box-shadow: -3px 0 12px rgba(182,255,0,.15); }
  .ex__head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .ex__name { font-family: var(--mono); font-size: .9rem; font-weight: 700;
              letter-spacing: .03em; text-transform: uppercase; color: var(--cyan);
              text-shadow: 0 0 9px rgba(0,229,255,.55); }
  .ex.main .ex__name { color: var(--lime); text-shadow: 0 0 9px rgba(182,255,0,.6); }
  .ex__tag { font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
             text-transform: uppercase; color: var(--dim);
             border: 1px solid var(--line); padding: .08rem .4rem; }
  .ex__flag { font-family: var(--mono); font-size: .56rem;
              letter-spacing: .12em; text-transform: uppercase; color: var(--lime);
              text-shadow: 0 0 8px rgba(182,255,0,.5); }
  .hist-btn { margin-left: auto; font-family: var(--mono); font-size: .56rem;
              letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
              background: transparent; border: 1px solid var(--line); border-radius: 0;
              padding: .16rem .5rem; cursor: pointer; white-space: nowrap; }
  .hist-btn:hover, .hist-btn[aria-expanded="true"] { color: var(--cyan); border-color: var(--cyan);
              box-shadow: inset 0 0 0 1px rgba(0,229,255,.3), 0 0 8px rgba(0,229,255,.35);
              text-shadow: 0 0 8px rgba(0,229,255,.7); }

  /* Per-exercise history panel (revealed under the card) */
  .hist { margin-top: .7rem; border-top: 1px solid rgba(255,255,255,.07); padding-top: .7rem;
          animation: fadeIn .3s ease both; }
  .hist__summary { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-bottom: .5rem;
                   font-family: var(--mono); font-size: .62rem; letter-spacing: .05em; }
  .hist__summary .k { color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
  .hist__summary .v { color: var(--cyan); font-weight: 700; }
  .hist__summary .v.up { color: var(--lime); } .hist__summary .v.down { color: var(--danger); }
  .hist__note { font-size: .8rem; color: var(--dim); line-height: 1.5; }
  .chart svg { width: 100%; height: 120px; display: block; overflow: visible;
               color: var(--ink); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .sets { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 .1rem; }
  .set { font-family: var(--mono); font-size: .74rem; font-weight: 700; letter-spacing: .03em;
         color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
         padding: .22rem .55rem; }
  .set.warm { color: var(--dim); font-weight: 500; border-style: dashed; }
  .set b { color: var(--cyan); font-weight: 700; }
  .ex.main .set b { color: var(--lime); }
  .rest { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em;
          text-transform: uppercase; color: var(--dim); margin-top: .5rem; }
  .notes { font-size: .86rem; line-height: 1.5; color: var(--ink); margin-top: .55rem;
           white-space: pre-wrap; overflow-wrap: break-word; }
  .alts { font-family: var(--mono); font-size: .62rem; letter-spacing: .04em; color: var(--dim);
          margin-top: .55rem; line-height: 1.8; }
  .alts b { color: var(--cyan); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .alt-btn { font-family: var(--mono); font-size: .62rem; letter-spacing: .03em; color: var(--cyan);
             background: transparent; border: 1px solid var(--line); border-radius: 0;
             padding: .12rem .5rem; margin: 0 .3rem .1rem 0; cursor: pointer; white-space: nowrap; }
  .alt-btn:hover { border-color: var(--cyan);
             box-shadow: inset 0 0 0 1px rgba(0,229,255,.3), 0 0 8px rgba(0,229,255,.35);
             text-shadow: 0 0 8px rgba(0,229,255,.7); }
  .alt-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .alts__status { font-family: var(--mono); font-size: .58rem; letter-spacing: .06em;
                  color: var(--dim); margin-left: .3rem; }
  .alts__status.err { color: var(--danger); }

  /* ── Logging mode ─────────────────────────────────────────── */
  .logbtn { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em;
            text-transform: uppercase; color: var(--magenta); background: transparent;
            border: 1px solid var(--magenta); border-radius: 0; padding: .28rem .7rem;
            margin-top: .7rem; cursor: pointer; }
  .logbtn:hover { box-shadow: 0 0 10px rgba(255,0,102,.4); text-shadow: 0 0 8px rgba(255,0,102,.6); }
  .logbtn.on { color: #05050a; background: var(--magenta); }
  .ex.logging { border-left-color: var(--magenta); box-shadow: -3px 0 12px rgba(255,0,102,.14); }
  .setrow { display: flex; align-items: center; gap: .4rem; margin: .35rem 0;
            font-family: var(--mono); font-size: .74rem; }
  .setrow input[type=number] { width: 3.4rem; font-family: var(--mono); font-size: .8rem;
            text-align: center; color: var(--ink); background: var(--panel-2);
            border: 1px solid var(--line); border-radius: 0; padding: .22rem .2rem; }
  .setrow input.rpe { width: 2.8rem; }
  .setrow input[type=number]:focus { outline: none; border-color: var(--cyan);
            box-shadow: inset 0 0 0 1px rgba(0,229,255,.3); }
  .setrow .x { color: var(--dim); }
  .setrow .warmtag { font-size: .55rem; letter-spacing: .08em; text-transform: uppercase;
            color: var(--dim); border: 1px solid var(--line); padding: .05rem .3rem; cursor: pointer; }
  .setrow .warmtag.on { color: #05050a; background: var(--dim); border-color: var(--dim); }
  .setrow .done { width: 1.15rem; height: 1.15rem; accent-color: var(--lime); cursor: pointer; }
  .setrow.is-done { opacity: .55; }
  .setrow .rm { margin-left: auto; color: var(--danger); background: transparent; border: none;
            font-size: 1rem; line-height: 1; cursor: pointer; padding: 0 .2rem; }
  .addset { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em;
            text-transform: uppercase; color: var(--cyan); background: transparent;
            border: 1px dashed var(--line); border-radius: 0; padding: .2rem .55rem;
            margin-top: .35rem; cursor: pointer; }
  .addset:hover { border-color: var(--cyan); }

  /* Add / swap exercise controls in the logger */
  .ex__ctl { font-family: var(--mono); font-size: .68rem; line-height: 1; color: var(--ink);
             background: transparent; border: 1px solid var(--line); border-radius: 0;
             padding: .2rem .45rem; cursor: pointer; }
  .ex__ctl.first { margin-left: auto; }
  .ex__ctl:hover { border-color: var(--cyan); color: var(--cyan); }
  .ex__ctl.del:hover { border-color: var(--danger); color: var(--danger); }
  .ex__pick { flex: 1 1 100%; font-family: var(--mono); font-size: .82rem; color: var(--ink);
              background: var(--panel-2); border: 1px solid var(--cyan); border-radius: 0;
              padding: .3rem .5rem; }
  .ex__pick:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(0,229,255,.35); }
  .addex { display: block; width: 100%; font-family: var(--mono); font-size: .62rem;
           letter-spacing: .1em; text-transform: uppercase; color: var(--cyan);
           background: transparent; border: 1px dashed var(--line); border-radius: 0;
           padding: .55rem; margin: .2rem 0 .3rem; cursor: pointer; }
  .addex:hover { border-color: var(--cyan); }
  .rest--btn { background: transparent; border: 1px solid var(--line); border-radius: 0;
               cursor: pointer; padding: .22rem .5rem; }
  .rest--btn:hover { color: var(--cyan); border-color: var(--cyan); }

  /* Floating rest timer (shared by view + logging) */
  .rtimer { position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(.8rem + env(safe-area-inset-bottom)); z-index: 40;
            display: flex; align-items: center; gap: .55rem; background: var(--panel);
            border: 1px solid var(--cyan); box-shadow: 0 0 16px rgba(0,229,255,.35);
            padding: .45rem .6rem; }
  .rtimer[hidden] { display: none; }
  body.logging-active .rtimer { bottom: calc(4.2rem + env(safe-area-inset-bottom)); }
  .rtimer__label { font-family: var(--mono); font-size: .55rem; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--dim); max-width: 8rem;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rtimer__time { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; color: var(--cyan);
                  text-shadow: 0 0 9px rgba(0,229,255,.55); min-width: 3.1rem; text-align: center; }
  .rtimer.done { border-color: var(--lime); box-shadow: 0 0 20px rgba(182,255,0,.5);
                 animation: rtflash .6s steps(1) infinite; }
  .rtimer.done .rtimer__time { color: var(--lime); text-shadow: 0 0 12px rgba(182,255,0,.7); }
  @keyframes rtflash { 50% { opacity: .5; } }
  .rtimer__ctl { display: flex; gap: .3rem; }
  .rtimer__btn { font-family: var(--mono); font-size: .62rem; color: var(--ink);
                 background: transparent; border: 1px solid var(--line); border-radius: 0;
                 padding: .22rem .4rem; cursor: pointer; }
  .rtimer__btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .logbar { position: sticky; bottom: 0; display: flex; gap: .6rem; margin-top: 1rem;
            padding: .8rem 0 calc(.4rem + env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .logbar button { flex: 1; font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
            text-transform: uppercase; border-radius: 0; padding: .6rem; cursor: pointer; }
  .logbar .save { color: #05050a; background: var(--lime); border: 1px solid var(--lime);
            font-weight: 700; box-shadow: 0 0 14px rgba(182,255,0,.4); }
  .logbar .save:disabled { opacity: .5; box-shadow: none; cursor: default; }
  .logbar .cancel { color: var(--dim); background: transparent; border: 1px solid var(--line); }
  .logstatus { font-family: var(--mono); font-size: .64rem; letter-spacing: .06em;
               text-align: center; margin-top: .6rem; color: var(--dim); }
  .logstatus.err { color: var(--danger); } .logstatus.ok { color: var(--lime); }
  .draftflag { font-family: var(--mono); font-size: .58rem; letter-spacing: .08em;
               text-transform: uppercase; color: var(--amber, #ffb300); margin-top: .3rem; }

  /* Reasoning */
  details.why { background: var(--panel); border: 1px solid var(--line); margin-top: 1.1rem; }
  details.why > summary { list-style: none; cursor: pointer; user-select: none;
      font-family: var(--mono); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--dim); padding: .7rem .9rem; }
  details.why > summary::-webkit-details-marker { display: none; }
  details.why > summary::after { content: " ▸"; color: var(--cyan); }
  details.why[open] > summary::after { content: " ▾"; }
  details.why[open] > summary { color: var(--cyan); }
  .why__body { font-size: .84rem; line-height: 1.55; color: var(--dim);
               padding: 0 .9rem .9rem; white-space: pre-wrap; overflow-wrap: break-word; }
</style>
</head>
<body>
<header class="hud">
  <div class="hud__bar">
    <span class="hud__brand"><b>■</b>WORKOUT</span>
    <span class="hud__jp">ワークアウト</span>
    <span class="tag">{{ user }}</span>
    <span class="hud__spacer"></span>
    <details class="hud__menu">
      <summary>Menu</summary>
      <div class="hud__menu-panel">
        <a href="{{ chat_url }}">▸ Chat</a>
        <a class="current" href="{{ chat_url }}/workout">▸ Workout</a>
        <a href="{{ chat_url }}/review">▸ Review</a>
        <a href="{{ chat_url }}/stats">▸ Stats</a>
        <a href="{{ chat_url }}/log">▸ Log</a>
      </div>
    </details>
  </div>
  <div class="hud__hazard"></div>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const DATA_URL = "{{ data_url }}";
const CHAT_URL = "{{ chat_url }}";
const USER     = "{{ user }}";
const HIST_URL = CHAT_URL + "/workout/history";
const SWAP_URL = CHAT_URL + "/workout/swap";
const LOG_URL    = CHAT_URL + "/workout/log";
const LOGGED_URL = CHAT_URL + "/workout/logged";
const EXLIST_URL = CHAT_URL + "/workout/exercises";
const CYAN = "#00e5ff", LIME = "#b6ff00";
let swapping = false;   // one swap (Hevy PUT) at a time, across all cards
let LOGGING = false;    // editable logging mode on the Workout tab
let CURRENT = null;     // last /workout/data payload, for re-rendering on toggle
const SVGNS = "http://www.w3.org/2000/svg";
const MONO = "ui-monospace, Menlo, monospace";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en", { weekday: "short", day: "2-digit", month: "short" });
}

function isBodyweight(ex) {
  return (ex.exercise_type && ex.exercise_type.indexOf("bodyweight") !== -1)
      || ex.equipment_category === "none";
}

// Human label for a single set's load.
function loadLabel(set, ex) {
  const w = set.weight_kg || 0;
  if (isBodyweight(ex)) return w > 0 ? "BW +" + w + " kg" : "BW";
  return w > 0 ? w + " kg" : "—";
}

// Collapse consecutive identical sets into "N ×" groups.
function groupSets(sets, ex) {
  const out = [];
  for (const s of sets || []) {
    const label = loadLabel(s, ex);
    const warm = !!s.is_warmup;
    const last = out[out.length - 1];
    if (last && last.reps === s.reps && last.label === label && last.warm === warm) {
      last.count += 1;
    } else {
      out.push({ count: 1, reps: s.reps, label, warm });
    }
  }
  return out;
}

// ── Rest timer ──────────────────────────────────────────────────────────────
// One floating countdown, shared across view + logging. Auto-armed when a set is
// ticked done in the logger; also startable by tapping any exercise's rest line.
// Beeps + vibrates at zero. Pure client-side — no server state.
let _ac = null;
function beep() {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === "suspended") _ac.resume();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.connect(g); g.connect(_ac.destination);
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, _ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, _ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, _ac.currentTime + 0.5);
    o.start(); o.stop(_ac.currentTime + 0.5);
  } catch (e) {}
}

const RT = {
  el: null, disp: null, label: null, pauseBtn: null,
  remain: 0, total: 0, timer: null, last: 0, running: false,
  ensure() {
    if (this.el) return;
    const bar = el("div", "rtimer"); bar.hidden = true;
    this.label = el("div", "rtimer__label", "Rest");
    this.disp  = el("div", "rtimer__time", "0:00");
    const ctl  = el("div", "rtimer__ctl");
    const mk = (t, fn) => { const b = el("button", "rtimer__btn", t); b.type = "button";
                            b.addEventListener("click", fn); return b; };
    ctl.appendChild(mk("−15", () => this.bump(-15)));
    ctl.appendChild(mk("＋15", () => this.bump(15)));
    this.pauseBtn = mk("❚❚", () => this.toggle());
    ctl.appendChild(this.pauseBtn);
    ctl.appendChild(mk("✕", () => this.stop()));
    bar.appendChild(this.label); bar.appendChild(this.disp); bar.appendChild(ctl);
    document.body.appendChild(bar);
    this.el = bar;
  },
  fmt(s) { s = Math.max(0, Math.round(s));
           return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); },
  paint() {
    this.disp.textContent = this.fmt(this.remain);
    this.el.classList.toggle("done", this.remain <= 0);
    this.pauseBtn.textContent = this.running ? "❚❚" : "▶";
  },
  start(seconds, name) {
    this.ensure();
    this.total = this.remain = Math.max(1, seconds || 90);
    this.label.textContent = name ? "Rest · " + name : "Rest";
    this.el.hidden = false;
    this.tick();
  },
  tick() {
    this.running = true;
    clearInterval(this.timer);
    this.last = Date.now();
    this.timer = setInterval(() => {
      const now = Date.now();
      this.remain -= (now - this.last) / 1000; this.last = now;
      if (this.remain <= 0) { this.remain = 0; this.fire(); }
      this.paint();
    }, 250);
    this.paint();
  },
  fire() { clearInterval(this.timer); this.running = false;
           try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
           beep(); },
  toggle() {
    if (this.remain <= 0) { this.remain = this.total; this.tick(); return; }
    if (this.running) { clearInterval(this.timer); this.running = false; this.paint(); }
    else this.tick();
  },
  bump(d) { this.remain = Math.max(0, this.remain + d);
            if (d > 0) this.el.classList.remove("done"); this.paint(); },
  stop() { clearInterval(this.timer); this.running = false;
           if (this.el) this.el.hidden = true; },
};

// ── Exercise catalogue (for add / swap pickers in the logger) ────────────────
let CATALOG = null;   // { names: [...], bw: Set<name> }
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  try {
    const r = await fetch(EXLIST_URL);
    const d = await r.json();
    const list = d.exercises || [];
    CATALOG = { names: list.map(e => e.name),
                bw: new Set(list.filter(e => e.bodyweight).map(e => e.name)) };
  } catch (e) {
    CATALOG = { names: [], bw: new Set() };
  }
  let dl = document.getElementById("exlist");
  if (!dl) { dl = el("datalist"); dl.id = "exlist"; document.body.appendChild(dl); }
  dl.textContent = "";
  CATALOG.names.forEach(n => { const o = el("option"); o.value = n; dl.appendChild(o); });
  return CATALOG;
}

function exerciseCard(ex, idx) {
  const card = el("div", "ex" + (ex.is_main_lift ? " main" : ""));

  const head = el("div", "ex__head");
  head.appendChild(el("span", "ex__name", ex.exercise_name));
  if (ex.muscle_group) head.appendChild(el("span", "ex__tag", ex.muscle_group.replace(/_/g, " ")));
  if (ex.equipment_category) head.appendChild(el("span", "ex__tag", ex.equipment_category));
  if (ex.is_main_lift) head.appendChild(el("span", "ex__flag", "★ Main lift"));

  const histBtn = el("button", "hist-btn", "◷ History");
  histBtn.type = "button";
  histBtn.setAttribute("aria-expanded", "false");
  head.appendChild(histBtn);
  card.appendChild(head);

  const sets = el("div", "sets");
  for (const g of groupSets(ex.sets, ex)) {
    const chip = el("div", "set" + (g.warm ? " warm" : ""));
    const n = g.count > 1 ? g.count + " × " : "";
    chip.innerHTML = (g.warm ? "warm-up · " : "") + n + "<b>" + g.reps + "</b> reps @ " + g.label;
    sets.appendChild(chip);
  }
  card.appendChild(sets);

  if (ex.rest_seconds) {
    const rest = el("button", "rest rest--btn", "▸ Rest " + ex.rest_seconds + "s between sets");
    rest.type = "button"; rest.title = "Start rest timer";
    rest.addEventListener("click", () => RT.start(ex.rest_seconds, ex.exercise_name));
    card.appendChild(rest);
  }
  if (ex.notes) card.appendChild(el("div", "notes", ex.notes));
  if (ex.alternates && ex.alternates.length) {
    const alts = el("div", "alts");
    alts.appendChild(el("b", null, "Swap to: "));
    const status = el("span", "alts__status");
    for (const name of ex.alternates) {
      const b = el("button", "alt-btn", name);
      b.type = "button";
      b.title = "Replace " + ex.exercise_name + " with " + name
        + (CURRENT && CURRENT.uses_hevy === false ? " in this session" : " in your Hevy routine");
      b.addEventListener("click", () => doSwap(idx, name, status));
      alts.appendChild(b);
    }
    alts.appendChild(status);
    card.appendChild(alts);
  }

  // Lazily-loaded e1RM progression graph, toggled by the History button.
  const panel = el("div", "hist");
  panel.hidden = true;
  const colour = ex.is_main_lift ? LIME : CYAN;
  let loaded = false;
  histBtn.addEventListener("click", async () => {
    if (histBtn.getAttribute("aria-expanded") === "true") {
      panel.hidden = true;
      histBtn.setAttribute("aria-expanded", "false");
      histBtn.textContent = "◷ History";
      return;
    }
    panel.hidden = false;
    histBtn.setAttribute("aria-expanded", "true");
    histBtn.textContent = "◷ Hide";
    if (loaded) return;
    loaded = true;
    panel.textContent = "";
    panel.appendChild(el("div", "hist__note", "Loading history…"));
    try {
      const r = await fetch(HIST_URL + "?name=" + encodeURIComponent(ex.exercise_name));
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      renderHistory(panel, d, colour);
    } catch (e2) {
      panel.textContent = "";
      panel.appendChild(el("div", "hist__note", "Couldn't load history (" + e2.message + ")."));
      loaded = false;  // let them retry
    }
  });
  card.appendChild(panel);
  return card;
}

// Swap one exercise for a listed alternate. The server re-posts the whole
// routine to Hevy and returns the updated workout, which we re-render.
async function doSwap(index, to, statusEl) {
  if (swapping) return;
  swapping = true;
  document.querySelectorAll(".alt-btn").forEach(b => b.disabled = true);
  statusEl.classList.remove("err");
  statusEl.textContent = "swapping in " + to + "…";
  try {
    const r = await fetch(SWAP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index, to }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    swapping = false;
    render(d);   // rebuild with the updated routine (buttons re-enabled fresh)
  } catch (e) {
    statusEl.classList.add("err");
    statusEl.textContent = "swap failed — " + e.message;
    document.querySelectorAll(".alt-btn").forEach(b => b.disabled = false);
    swapping = false;
  }
}

function renderHistory(panel, d, colour) {
  panel.textContent = "";
  const s = d.series || [];
  if (!s.length) {
    panel.appendChild(el("div", "hist__note",
      "No logged sets for this exercise yet — its e1RM progression will chart here once you train it."));
    return;
  }

  const sum = el("div", "hist__summary");
  const add = (k, v, cls) => {
    sum.appendChild(el("span", "k", k));
    sum.appendChild(el("span", "v" + (cls ? " " + cls : ""), v));
  };
  add("Latest", d.latest_e1rm + " kg e1RM");
  add("Best", d.best_e1rm + " kg");
  if (d.first_e1rm != null && s.length >= 2) {
    const delta = Math.round((d.latest_e1rm - d.first_e1rm) * 10) / 10;
    add("Change", (delta >= 0 ? "+" : "") + delta + " kg",
        delta > 0 ? "up" : delta < 0 ? "down" : "");
  }
  add("Sessions", String(d.sessions));
  panel.appendChild(sum);

  if (s.length < 2) {
    panel.appendChild(el("div", "hist__note",
      "Only one session logged — the progression graph fills in from the second."));
    return;
  }
  const chart = el("div", "chart");
  chart.appendChild(lineChart(s, colour));
  panel.appendChild(chart);
}

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Compact HUD-style e1RM line chart (area fade, graticule, glow, end markers).
function lineChart(series, colour) {
  const W = 300, H = 120, padL = 34, padR = 12, padT = 12, padB = 18;
  const gid = "wgrad" + Math.random().toString(36).slice(2, 8);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const glow = c => `filter: drop-shadow(0 0 2px ${c}) drop-shadow(0 0 6px ${c})`;

  const vals = series.map(p => p.e1rm);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => padL + (W - padL - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const x0 = padL, x1 = W - padR, yB = H - padB;

  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": colour, "stop-opacity": .38 }));
  grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": colour, "stop-opacity": 0 }));
  defs.appendChild(grad); svg.appendChild(defs);

  for (let i = 0; i <= 4; i++) {
    const gy = padT + (yB - padT) * i / 4;
    svg.appendChild(svgEl("line", { x1: x0, y1: gy, x2: x1, y2: gy,
      stroke: "currentColor", "stroke-opacity": .09 }));
  }
  for (const v of [lo + pad, hi - pad]) {
    const t = svgEl("text", { x: x0 - 4, y: y(v) + 3, "text-anchor": "end",
      "font-size": 8, "font-family": MONO, fill: "currentColor", "fill-opacity": .5 });
    t.textContent = Math.round(v); svg.appendChild(t);
  }

  const pts = series.map((p, i) => [x(i), y(p.e1rm)]);
  const areaD = `M${pts[0][0]},${yB} ` + pts.map(p => `L${p[0]},${p[1]}`).join(" ")
              + ` L${pts[pts.length - 1][0]},${yB} Z`;
  svg.appendChild(svgEl("path", { d: areaD, fill: `url(#${gid})`, stroke: "none" }));

  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  const trace = svgEl("path", { d, fill: "none", stroke: colour, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round" });
  trace.setAttribute("style", glow(colour));
  svg.appendChild(trace);

  if (series.length <= 40) {
    pts.forEach((p, i) => {
      const m = svgEl("rect", { x: p[0] - 1.5, y: p[1] - 1.5, width: 3, height: 3,
        fill: colour, style: glow(colour) });
      const pt = series[i];
      const set = (pt.weight ? pt.weight + "kg × " + pt.reps : "BW × " + pt.reps);
      const title = svgEl("title", {});
      title.textContent = pt.date + " · " + set + " · e1RM " + pt.e1rm + "kg";
      m.appendChild(title);
      svg.appendChild(m);
    });
  }
  return svg;
}

const SESSION_COLOURS = { push: "#00e5ff", pull: "#b6ff00", legs: "#ff6a00", arms: "#ff0066" };
const SESSION_LABEL   = { push: "Push", pull: "Pull", legs: "Legs", arms: "Arms" };

function comingUp(seq) {
  const box = el("div", "coming");
  box.appendChild(el("div", "coming__label", "Coming up"));
  const row = el("div", "coming__row");
  seq.forEach((st, i) => {
    if (i > 0) row.appendChild(el("span", "coming__arrow", "›"));
    const colour = SESSION_COLOURS[st] || CYAN;
    const chip = el("span", "coming__chip" + (i === 0 ? " now" : ""),
                    SESSION_LABEL[st] || st);
    chip.style.color = colour;
    chip.style.borderColor = colour;
    if (i === 0) chip.style.boxShadow = "0 0 8px " + colour + "66, inset 0 0 12px " + colour + "22";
    row.appendChild(chip);
  });
  box.appendChild(row);
  box.appendChild(el("div", "coming__note",
    "Forecast from your training pattern — not a fixed schedule. Train (or rest) any day; "
    + "if you do a different session, this re-plans around it."));
  return box;
}

// ── Logging mode ────────────────────────────────────────────────────────────
// A session is logged as an in-memory MODEL (list of exercises, each with set
// rows: {weight, reps, rpe, warmup, done}). Seeded from the prescription, then
// overlaid with any previously-saved session or an unsaved localStorage draft.
let MODEL = null;

function draftKey() {
  const d = (CURRENT && CURRENT.date) || new Date().toISOString().slice(0, 10);
  return "log:" + USER + ":" + d;
}
function saveDraft() {
  try { localStorage.setItem(draftKey(), JSON.stringify(MODEL)); } catch (e) {}
}
function clearDraft() {
  try { localStorage.removeItem(draftKey()); } catch (e) {}
}
function loadDraft() {
  try { const r = localStorage.getItem(draftKey()); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}

// Build the editable model from the prescribed workout.
function modelFromPrescription(w) {
  return (w.exercises || []).map(ex => ({
    exercise_name: ex.exercise_name,
    is_bodyweight: isBodyweight(ex),
    rest_seconds: ex.rest_seconds || 90,
    sets: (ex.sets || []).map(s => ({
      weight: s.weight_kg || 0, reps: s.reps || 0, rpe: "",
      warmup: !!s.is_warmup, done: false,
    })),
  }));
}
// Overlay a saved/logged session (matched by exercise name) onto the model.
function overlaySaved(model, logged) {
  const byName = {};
  (logged.exercises || []).forEach(e => { byName[e.exercise_name] = e.sets; });
  model.forEach(m => {
    const saved = byName[m.exercise_name];
    if (saved) m.sets = saved.map(s => ({
      weight: s.weight_kg || 0, reps: s.reps || 0,
      rpe: s.rpe == null ? "" : s.rpe, warmup: !!s.is_warmup, done: true,
    }));
  });
  return model;
}

function setRow(mset, mex, rerender) {
  const row = el("div", "setrow" + (mset.done ? " is-done" : ""));

  const done = el("input", "done"); done.type = "checkbox"; done.checked = mset.done;
  done.title = "Mark set completed";
  done.addEventListener("change", () => { mset.done = done.checked; saveDraft();
    row.classList.toggle("is-done", mset.done);
    if (mset.done && !mset.warmup) RT.start(mex.rest_seconds || 90, mex.exercise_name); });
  row.appendChild(done);

  const w = el("input"); w.type = "number"; w.step = "2.5"; w.min = "0";
  w.value = mset.weight || ""; w.placeholder = mex.is_bodyweight ? "BW+" : "kg";
  w.inputMode = "decimal";
  w.addEventListener("input", () => { mset.weight = parseFloat(w.value) || 0; saveDraft(); });
  row.appendChild(w);

  row.appendChild(el("span", "x", "×"));

  const reps = el("input"); reps.type = "number"; reps.step = "1"; reps.min = "0";
  reps.value = mset.reps || ""; reps.placeholder = "reps"; reps.inputMode = "numeric";
  reps.addEventListener("input", () => { mset.reps = parseInt(reps.value) || 0; saveDraft(); });
  row.appendChild(reps);

  const rpe = el("input", "rpe"); rpe.type = "number"; rpe.step = "0.5";
  rpe.min = "0"; rpe.max = "10"; rpe.value = mset.rpe; rpe.placeholder = "RPE";
  rpe.inputMode = "decimal";
  rpe.addEventListener("input", () => { mset.rpe = rpe.value; saveDraft(); });
  row.appendChild(rpe);

  const warm = el("span", "warmtag" + (mset.warmup ? " on" : ""), "warm");
  warm.title = "Toggle warm-up set (excluded from working-set counts)";
  warm.addEventListener("click", () => { mset.warmup = !mset.warmup; saveDraft();
    warm.classList.toggle("on", mset.warmup); });
  row.appendChild(warm);

  const rm = el("button", "rm", "×"); rm.type = "button"; rm.title = "Remove set";
  rm.addEventListener("click", () => {
    mex.sets.splice(mex.sets.indexOf(mset), 1); saveDraft(); rerender();
  });
  row.appendChild(rm);

  return row;
}

function loggerCard(mex, rerender) {
  const card = el("div", "ex logging");
  const head = el("div", "ex__head");

  if (mex._editing) {
    // Inline exercise picker (add or swap). Commit on ✓ or Enter; blank keeps old.
    const inp = el("input", "ex__pick");
    inp.type = "text"; inp.setAttribute("list", "exlist");
    inp.placeholder = "Search exercise…"; inp.value = mex.exercise_name || "";
    const commit = () => {
      const v = inp.value.trim();
      if (v) { mex.exercise_name = v;
               mex.is_bodyweight = !!(CATALOG && CATALOG.bw.has(v)); }
      if (mex.exercise_name) { delete mex._editing; saveDraft(); rerender(); }
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
    const ok = el("button", "ex__ctl first", "✓"); ok.type = "button"; ok.title = "Confirm";
    ok.addEventListener("click", commit);
    head.appendChild(inp); head.appendChild(ok);
    card.appendChild(head);
    setTimeout(() => inp.focus(), 0);
  } else {
    head.appendChild(el("span", "ex__name", mex.exercise_name));
    const swap = el("button", "ex__ctl first", "⇄"); swap.type = "button";
    swap.title = "Swap this exercise";
    swap.addEventListener("click", () => { mex._editing = true; rerender(); });
    const del = el("button", "ex__ctl del", "✕"); del.type = "button";
    del.title = "Remove exercise";
    del.addEventListener("click", () => {
      if (mex.sets.some(s => s.done) &&
          !confirm("Remove " + mex.exercise_name + " and its logged sets?")) return;
      MODEL.splice(MODEL.indexOf(mex), 1); saveDraft(); rerender();
    });
    head.appendChild(swap); head.appendChild(del);
    card.appendChild(head);
  }

  mex.sets.forEach(mset => card.appendChild(setRow(mset, mex, rerender)));

  const add = el("button", "addset", "＋ set"); add.type = "button";
  add.addEventListener("click", () => {
    const last = mex.sets[mex.sets.length - 1];
    mex.sets.push(last
      ? { weight: last.weight, reps: last.reps, rpe: "", warmup: false, done: false }
      : { weight: 0, reps: 0, rpe: "", warmup: false, done: false });
    saveDraft(); rerender();
  });
  card.appendChild(add);
  return card;
}

async function enterLogging(w) {
  LOGGING = true;
  loadCatalog();                         // fire-and-forget; datalist ready shortly
  MODEL = modelFromPrescription(w);
  const draft = loadDraft();
  if (draft && draft.length) {
    MODEL = draft;                       // unsaved edits win
  } else {
    try {                                // else seed from an already-saved session
      const qs = CURRENT && CURRENT.date ? "?date=" + encodeURIComponent(CURRENT.date) : "";
      const r = await fetch(LOGGED_URL + qs);
      const d = await r.json();
      if (d.logged) overlaySaved(MODEL, d.logged);
    } catch (e) {}
  }
  renderLogger(w);
}

function renderLogger(w) {
  document.body.classList.add("logging-active");
  const main = document.getElementById("main");
  main.textContent = "";

  const banner = el("div", "banner");
  if (w.session_type) banner.appendChild(el("span", "banner__type", w.session_type));
  banner.appendChild(el("div", "banner__title", "Logging — " + (w.title || "session")));
  banner.appendChild(el("div", "banner__meta",
    "Enter what you actually did. Tick each set as you go — saved to this device."));
  main.appendChild(banner);
  if (loadDraft()) main.appendChild(el("div", "draftflag", "● unsaved draft restored"));

  const rerender = () => renderLogger(w);
  MODEL.forEach(mex => main.appendChild(loggerCard(mex, rerender)));

  const addEx = el("button", "addex", "＋ Add exercise"); addEx.type = "button";
  addEx.addEventListener("click", () => {
    MODEL.push({ exercise_name: "", is_bodyweight: false, rest_seconds: 90, _editing: true,
                 sets: [{ weight: 0, reps: 0, rpe: "", warmup: false, done: false }] });
    saveDraft(); rerender();
  });
  main.appendChild(addEx);

  const status = el("div", "logstatus");
  const bar = el("div", "logbar");
  const save = el("button", "save", "✓ Finish & save"); save.type = "button";
  const cancel = el("button", "cancel", "Cancel"); cancel.type = "button";
  cancel.addEventListener("click", () => { LOGGING = false; render(CURRENT); });
  save.addEventListener("click", () => saveSession(w, save, status));
  bar.appendChild(cancel); bar.appendChild(save);
  main.appendChild(bar);
  main.appendChild(status);
}

async function saveSession(w, saveBtn, status) {
  const exercises = MODEL.map(mex => ({
    exercise_name: mex.exercise_name,
    sets: mex.sets
      .filter(s => (s.reps || 0) > 0)
      .map(s => ({ weight_kg: s.weight || 0, reps: s.reps || 0,
                   rpe: s.rpe === "" ? null : parseFloat(s.rpe),
                   is_warmup: !!s.warmup })),
  })).filter(e => e.sets.length);

  if (!exercises.length) {
    status.className = "logstatus err";
    status.textContent = "Add at least one set with reps before saving.";
    return;
  }
  saveBtn.disabled = true;
  status.className = "logstatus"; status.textContent = "Saving…";
  try {
    const r = await fetch(LOG_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: CURRENT.date, session_type: w.session_type,
                             workout_name: w.title, exercises }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    clearDraft();
    status.className = "logstatus ok";
    status.textContent = "✓ Saved " + d.sets_written + " sets — your coach can see it now.";
    setTimeout(() => { LOGGING = false; render(CURRENT); }, 1400);
  } catch (e) {
    saveBtn.disabled = false;
    status.className = "logstatus err";
    status.textContent = "Save failed — " + e.message;
  }
}

function render(d) {
  CURRENT = d;
  if (LOGGING && d && d.workout) { renderLogger(d.workout); return; }
  document.body.classList.remove("logging-active");
  const main = document.getElementById("main");
  main.textContent = "";

  const w = d.workout;
  if (!w) {
    const box = el("div", "empty");
    const where = d.uses_hevy === false
      ? "Your coach programmes a session on training days — once one's ready it shows up here."
      : "Your coach programmes a workout into your Hevy app on training days — once one's posted it shows up here.";
    box.innerHTML = "No prescribed session yet. " + where + " Ask in the "
      + "<b><a href=\"" + CHAT_URL + "\">chat</a></b> to generate today's session.";
    main.appendChild(box);
    return;
  }

  const exercises = w.exercises || [];
  const working = exercises.reduce(
    (a, ex) => a + (ex.sets || []).filter(s => !s.is_warmup).length, 0);

  const banner = el("div", "banner");
  if (w.session_type) banner.appendChild(el("span", "banner__type", w.session_type));
  banner.appendChild(el("div", "banner__title", w.title || "Prescribed session"));
  const when = el("div", "banner__when " + (d.is_today ? "today" : "stale"));
  when.textContent = d.is_today
    ? "▸ Today's session"
    : "▸ Prescribed " + fmtDate(d.date) + " — no newer session yet";
  banner.appendChild(when);
  banner.appendChild(el("div", "banner__meta",
    exercises.length + (exercises.length === 1 ? " exercise" : " exercises")
    + " · " + working + " working sets"));
  const logBtn = el("button", "logbtn" + (loadDraft() ? " on" : ""),
    loadDraft() ? "▸ Resume logging" : "▸ Log this session");
  logBtn.type = "button";
  logBtn.addEventListener("click", () => enterLogging(w));
  banner.appendChild(logBtn);
  main.appendChild(banner);

  if (d.upcoming && d.upcoming.length) main.appendChild(comingUp(d.upcoming));

  exercises.forEach((ex, i) => main.appendChild(exerciseCard(ex, i)));

  if (w.reasoning) {
    const det = el("details", "why");
    det.appendChild(el("summary", null, "Why this session"));
    det.appendChild(el("div", "why__body", w.reasoning));
    main.appendChild(det);
  }
}

fetch(DATA_URL)
  .then(r => r.json())
  .then(d => { if (d.error) throw new Error(d.error); render(d); })
  .catch(e => {
    document.getElementById("main").innerHTML =
      '<p class="muted">Could not load your workout (' + e.message + ').</p>';
  });
</script>
</body>
