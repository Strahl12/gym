<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Gym Coach</title>
<link rel="stylesheet" href="/static/tdr.css?v=8">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 1rem; }
  .card { width: min(92vw, 23rem); background: var(--panel); border: 1px solid var(--line);
          padding: 1.6rem 1.4rem 1.8rem; }
  .card__top { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.4rem; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .14em; text-transform: uppercase;
       font-weight: 800; }
  h1 b { color: var(--magenta); text-shadow: 0 0 12px rgba(255,0,102,.7); }
  .jp { font-size: .7rem; color: var(--dim); letter-spacing: .28em; margin-left: auto; }
  label { display: block; font-family: var(--mono); font-size: .66rem; letter-spacing: .14em;
          text-transform: uppercase; color: var(--dim); margin: 0 0 1rem; }
  input { display: block; width: 100%; margin-top: .4rem; padding: .6rem .7rem;
          font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg);
          border: 1px solid var(--line); border-radius: 0; }
  input:focus { outline: 0; border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  button { width: 100%; padding: .7rem; margin-top: .4rem; font: inherit; font-size: .95rem;
           font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
           background: var(--magenta); color: #05050a; border: 0; border-radius: 0; cursor: pointer;
           box-shadow: 0 0 14px rgba(255,0,102,.45); }
  button:hover { box-shadow: 0 0 20px rgba(255,0,102,.7); }
  .err { color: var(--danger); font-family: var(--mono); font-size: .72rem;
         letter-spacing: .06em; margin: 0 0 1rem; }
  .hint { color: var(--dim); font-size: .78rem; line-height: 1.5; margin-top: 1.3rem; }
  .hz { height: 4px; margin-top: 1.3rem;
        background: repeating-linear-gradient(-45deg, var(--magenta) 0 9px, transparent 9px 18px); }
</style>
</head>
<body>
<div class="card reg">
  <div class="card__top">
    <h1><b>■</b>GYM.COACH</h1>
    <span class="jp">ジム</span>
  </div>
  {% if error %}<p class="err">⚠ {{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none"
             autocorrect="off" spellcheck="false" required value="{{ username or '' }}">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">No password yet? Open the setup link you were sent.</p>
  <div class="hz"></div>
</div>
</body>
</html>
