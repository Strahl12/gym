<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ user }} — Gym Coach</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh;
         background: Canvas; color: CanvasText; }
  header { padding: .75rem 1rem; font-weight: 600;
           display: flex; align-items: center; gap: .75rem;
           border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  header a { margin-left: auto; font-weight: 600; text-decoration: none;
             color: #2563eb; font-size: .95rem; }
  #msgs { flex: 1; overflow-y: auto; padding: 1rem;
          display: flex; flex-direction: column; gap: .5rem; }
  .msg { max-width: 85%; padding: .55rem .8rem; border-radius: 1rem;
         white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.35; }
  .user { align-self: flex-end; background: #2563eb; color: #fff;
          border-bottom-right-radius: .3rem; }
  .assistant { align-self: flex-start;
               background: color-mix(in srgb, CanvasText 8%, Canvas);
               border-bottom-left-radius: .3rem; }
  #err { color: #dc2626; font-size: .8rem; padding: 0 1rem .5rem; display: none; }
  form { display: flex; gap: .5rem; padding: .75rem;
         padding-bottom: calc(.75rem + env(safe-area-inset-bottom));
         border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  textarea { flex: 1; resize: none; border-radius: 1rem; padding: .55rem .8rem;
             font: inherit; background: transparent; color: inherit;
             border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); }
  button { border: 0; border-radius: 1rem; padding: 0 1.1rem; font: inherit;
           font-weight: 600; background: #2563eb; color: #fff; }
  button:disabled { opacity: .5; }
  #dev { display: flex; align-items: center; gap: .5rem;
         padding: .35rem .8rem; font: .72rem/1.3 ui-monospace, Menlo, monospace;
         background: color-mix(in srgb, CanvasText 8%, Canvas);
         border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
         overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #dev::-webkit-scrollbar { display: none; }
  #dev > * { flex: 0 0 auto; }          /* keep natural width; overflow scrolls instead of clipping */
  #dev.bad { background: #dc2626; color: #fff; }
  #dev-status { white-space: nowrap; }
  #dev button { padding: .1rem .5rem; font: inherit; font-weight: 600;
                border-radius: .5rem; background: color-mix(in srgb, CanvasText 20%, transparent);
                color: inherit; }
  #dev a { font-weight: 600; text-decoration: none; color: inherit;
           padding: .1rem .5rem; border-radius: .5rem;
           background: color-mix(in srgb, CanvasText 20%, transparent); }
  #dev-link { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap;
              padding: .4rem .8rem; font: .72rem/1.3 ui-monospace, Menlo, monospace;
              background: color-mix(in srgb, CanvasText 12%, Canvas);
              border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #dev-link .note { width: 100%; opacity: .7; }
  #dev-link input { flex: 1; min-width: 11rem; font: inherit; padding: .2rem .45rem;
                    border-radius: .4rem; color: inherit; background: Canvas;
                    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); }
  #dev-link button { padding: .15rem .55rem; font: inherit; font-weight: 600;
                     border-radius: .4rem; background: #2563eb; color: #fff; }
</style>
</head>
<body>
<header><span>Gym Coach — {{ user }}</span><a id="stats-link" href="#">📊 Stats</a></header>
{% if dev %}
<div id="dev">
  <span id="dev-status">dev: loading…</span>
  <a id="dev-users" href="/app/users">Users</a>
  <button id="dev-invite" type="button">Invite user</button>
  <button id="dev-check" type="button">Check credit</button>
</div>
<div id="dev-link" hidden></div>
{% endif %}
<div id="msgs"></div>
<div id="err"></div>
<form id="f">
  <textarea id="box" rows="1" placeholder="Ask your coach…" autocomplete="off"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const base = location.pathname.replace(/\/$/, "");
document.getElementById("stats-link").href = base + "/stats";

// Dev panel (rendered only for the dev user) — Anthropic API / credit health.
let refreshDev = () => {};
const devBar = document.getElementById("dev");
if (devBar) {
  const devStatus = document.getElementById("dev-status");
  const devCheck  = document.getElementById("dev-check");
  const render = (d) => {
    if (d.credit_ok) {
      devBar.classList.remove("bad");
      devStatus.textContent = "dev: API OK"
        + (d.last_ok_ts ? " · last ok " + d.last_ok_ts.slice(11, 16) : "")
        + " · " + d.model;
    } else {
      devBar.classList.add("bad");
      devStatus.textContent = "dev: ⚠ CLAUDE OUT OF CREDIT"
        + (d.last_error_ts ? " · since " + d.last_error_ts.slice(5, 16).replace("T", " ") : "");
    }
    devStatus.title = d.last_error || "";
  };
  refreshDev = async () => {
    try { const r = await fetch(base + "/devinfo"); if (r.ok) render(await r.json()); } catch (e) {}
  };
  devCheck.addEventListener("click", async () => {
    devCheck.disabled = true;
    devStatus.textContent = "dev: checking credit…";
    try { const r = await fetch(base + "/devinfo/ping", { method: "POST" });
          if (r.ok) render(await r.json()); } catch (e) {}
    finally { devCheck.disabled = false; }
  });

  // One-use new-user signup link. Endpoint is session-gated to the dev.
  const devInvite = document.getElementById("dev-invite");
  const devLink   = document.getElementById("dev-link");
  devInvite.addEventListener("click", async () => {
    devInvite.disabled = true;
    try {
      const r = await fetch("/app/invite/new", { method: "POST" });
      if (!r.ok) throw new Error();
      const url = location.origin + (await r.json()).path;
      devLink.hidden = false;
      devLink.textContent = "";
      const note = document.createElement("span");
      note.className = "note"; note.textContent = "single-use signup link — send it to the new user:";
      const inp = document.createElement("input");
      inp.readOnly = true; inp.value = url;
      const copy = document.createElement("button");
      copy.type = "button"; copy.textContent = "Copy";
      copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(url); }
        catch (e) { inp.select(); document.execCommand("copy"); }
        copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500);
      });
      devLink.append(note, inp, copy);
      inp.focus(); inp.select();
    } catch (e) {
      devLink.hidden = false; devLink.textContent = "invite failed — are you signed in as the dev?";
    } finally { devInvite.disabled = false; }
  });

  refreshDev();
  setInterval(refreshDev, 60000);
}
const msgs = document.getElementById("msgs");
const box  = document.getElementById("box");
const send = document.getElementById("send");
const err  = document.getElementById("err");

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

async function loadHistory() {
  try {
    const r = await fetch(base + "/history");
    for (const m of await r.json()) add(m.role, m.content);
  } catch (ex) {
    err.textContent = "could not load history";
    err.style.display = "block";
  }
}

async function submit(e) {
  e.preventDefault();
  const text = box.value.trim();
  if (!text || send.disabled) return;
  err.style.display = "none";
  add("user", text);
  box.value = "";
  send.disabled = true;
  const thinking = add("assistant", "…");
  try {
    const r = await fetch(base + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    thinking.textContent = data.reply;
  } catch (ex) {
    thinking.remove();
    err.textContent = ex.message;
    err.style.display = "block";
  } finally {
    send.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
    box.focus();
    refreshDev();   // a failed send may have flipped credit state
  }
}

document.getElementById("f").addEventListener("submit", submit);
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(e); }
});
loadHistory();
</script>
</body>
</html>
