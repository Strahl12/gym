<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ user }} — Gym Coach</title>
<link rel="stylesheet" href="/static/tdr.css?v=6">
<style>
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; }
  #msgs { flex: 1; overflow-y: auto; padding: 1rem;
          display: flex; flex-direction: column; gap: .7rem; }
  .line { display: flex; flex-direction: column; max-width: 85%; gap: .18rem; }
  .line.user { align-self: flex-end; align-items: flex-end; }
  .line.assistant { align-self: flex-start; align-items: flex-start; }
  .row { display: flex; align-items: flex-end; gap: .5rem; }
  .avatar { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%;
            background: #fff url("/static/coach.png?v=2") center/cover no-repeat;
            border: 1px solid var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,.55); }
  .msg { max-width: 100%; padding: .55rem .8rem; border-radius: 0; font-size: .95rem;
         white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.4; }
  .msg.user { background: var(--magenta); color: #05050a; font-weight: 500;
              box-shadow: 0 0 14px rgba(255,0,102,.45); }
  .msg.assistant { background: var(--panel); border: 1px solid var(--line);
                   border-left: 2px solid var(--cyan); box-shadow: -3px 0 12px rgba(0,229,255,.18); }
  .ts { font-family: var(--mono); font-size: .6rem; letter-spacing: .08em; color: var(--cyan);
        text-shadow: 0 0 6px rgba(0,229,255,.9), 0 0 12px rgba(0,229,255,.5); }
  .line.assistant .ts { margin-left: 38px; }
  #err { color: var(--danger); font-family: var(--mono); font-size: .72rem;
         letter-spacing: .05em; padding: 0 1rem .5rem; display: none; }
  form { display: flex; gap: .5rem; padding: .75rem;
         padding-bottom: calc(.75rem + env(safe-area-inset-bottom));
         border-top: 1px solid var(--line); background: var(--bg-2); }
  textarea { flex: 1; resize: none; border-radius: 0; padding: .55rem .7rem;
             font: inherit; background: var(--bg); color: var(--ink);
             border: 1px solid var(--line); }
  textarea:focus { outline: 0; border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  #f button { border: 0; border-radius: 0; padding: 0 1.2rem; font: inherit;
           font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
           background: var(--magenta); color: #05050a; cursor: pointer;
           box-shadow: 0 0 12px rgba(255,0,102,.4); }
  #f button:hover { box-shadow: 0 0 18px rgba(255,0,102,.7); }
  #f button:disabled { opacity: .4; box-shadow: none; }
  #dev { display: flex; align-items: center; gap: .5rem;
         padding: .38rem .8rem; font: .66rem/1.3 var(--mono);
         letter-spacing: .05em; text-transform: uppercase;
         background: var(--panel-2); border-bottom: 1px solid var(--line);
         overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #dev::-webkit-scrollbar { display: none; }
  #dev > * { flex: 0 0 auto; }          /* keep natural width; overflow scrolls instead of clipping */
  #dev.bad { background: var(--danger); color: #fff; }
  #dev-status { white-space: nowrap; }
  #dev button, #dev a { padding: .14rem .5rem; font: inherit; letter-spacing: .06em;
                text-transform: uppercase; border: 1px solid var(--line); border-radius: 0;
                background: transparent; color: var(--ink); cursor: pointer; }
  #dev button:hover, #dev a:hover { border-color: var(--cyan); color: var(--cyan); }
  #dev-link { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap;
              padding: .4rem .8rem; font: .68rem/1.3 var(--mono);
              background: var(--panel); border-bottom: 1px solid var(--line); }
  #dev-link .note { width: 100%; color: var(--dim); }
  #dev-link input { flex: 1; min-width: 11rem; font: inherit; padding: .25rem .45rem;
                    border-radius: 0; color: var(--ink); background: var(--bg);
                    border: 1px solid var(--line); }
  #dev-link button { padding: .2rem .55rem; font: inherit; font-weight: 700; border: 0;
                     border-radius: 0; background: var(--cyan); color: #05050a; cursor: pointer; }
</style>
</head>
<body>
<header class="hud">
  <div class="hud__bar">
    <span class="hud__brand"><b>■</b>GYM.COACH</span>
    <span class="hud__jp">ジム</span>
    <span class="tag">{{ user }}</span>
    <span class="hud__spacer"></span>
    <nav class="hud__nav">
      <a id="review-link" href="#">▸ Review</a>
      <a id="stats-link" href="#">▸ Stats</a>
    </nav>
  </div>
  <div class="hud__hazard"></div>
</header>
{% if dev %}
<div id="dev">
  <span id="dev-status">dev: loading…</span>
  <a id="dev-users" href="/app/users">Users</a>
  <button id="dev-invite" type="button">Invite user</button>
  <button id="dev-check" type="button">Check credit</button>
</div>
<div id="dev-link" hidden></div>
{% endif %}
<div id="msgs"></div>
<div id="err"></div>
<form id="f">
  <textarea id="box" rows="1" placeholder="Ask your coach…" autocomplete="off"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const base = location.pathname.replace(/\/$/, "");
document.getElementById("stats-link").href = base + "/stats";
document.getElementById("review-link").href = base + "/review";

// Dev panel (rendered only for the dev user) — Anthropic API / credit health.
let refreshDev = () => {};
const devBar = document.getElementById("dev");
if (devBar) {
  const devStatus = document.getElementById("dev-status");
  const devCheck  = document.getElementById("dev-check");
  const render = (d) => {
    if (d.credit_ok) {
      devBar.classList.remove("bad");
      devStatus.textContent = "dev: API OK"
        + (d.last_ok_ts ? " · last ok " + d.last_ok_ts.slice(11, 16) : "")
        + " · " + d.model;
    } else {
      devBar.classList.add("bad");
      devStatus.textContent = "dev: ⚠ CLAUDE OUT OF CREDIT"
        + (d.last_error_ts ? " · since " + d.last_error_ts.slice(5, 16).replace("T", " ") : "");
    }
    devStatus.title = d.last_error || "";
  };
  refreshDev = async () => {
    try { const r = await fetch(base + "/devinfo"); if (r.ok) render(await r.json()); } catch (e) {}
  };
  devCheck.addEventListener("click", async () => {
    devCheck.disabled = true;
    devStatus.textContent = "dev: checking credit…";
    try { const r = await fetch(base + "/devinfo/ping", { method: "POST" });
          if (r.ok) render(await r.json()); } catch (e) {}
    finally { devCheck.disabled = false; }
  });

  // One-use new-user signup link. Endpoint is session-gated to the dev.
  const devInvite = document.getElementById("dev-invite");
  const devLink   = document.getElementById("dev-link");
  devInvite.addEventListener("click", async () => {
    devInvite.disabled = true;
    try {
      const r = await fetch("/app/invite/new", { method: "POST" });
      if (!r.ok) throw new Error();
      const url = location.origin + (await r.json()).path;
      devLink.hidden = false;
      devLink.textContent = "";
      const note = document.createElement("span");
      note.className = "note"; note.textContent = "single-use signup link — send it to the new user:";
      const inp = document.createElement("input");
      inp.readOnly = true; inp.value = url;
      const copy = document.createElement("button");
      copy.type = "button"; copy.textContent = "Copy";
      copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(url); }
        catch (e) { inp.select(); document.execCommand("copy"); }
        copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500);
      });
      devLink.append(note, inp, copy);
      inp.focus(); inp.select();
    } catch (e) {
      devLink.hidden = false; devLink.textContent = "invite failed — are you signed in as the dev?";
    } finally { devInvite.disabled = false; }
  });

  refreshDev();
  setInterval(refreshDev, 60000);
}
const msgs = document.getElementById("msgs");
const box  = document.getElementById("box");
const send = document.getElementById("send");
const err  = document.getElementById("err");

function fmtTs(d) {
  const t = d.toLocaleTimeString("en", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (d.toDateString() === new Date().toDateString()) return t;
  return d.toLocaleDateString("en", { day: "2-digit", month: "short" }) + " · " + t;
}

function add(role, text, ts) {
  const line = document.createElement("div");
  line.className = "line " + role;
  const bubble = document.createElement("div");
  bubble.className = "msg " + role;
  bubble.textContent = text;
  if (role === "assistant") {
    const row = document.createElement("div");
    row.className = "row";
    const av = document.createElement("div");
    av.className = "avatar";
    av.title = '"Chatty" Stick';
    row.append(av, bubble);
    line.appendChild(row);
  } else {
    line.appendChild(bubble);
  }
  const time = document.createElement("div");
  time.className = "ts";
  time.textContent = fmtTs(ts ? new Date(ts) : new Date());
  line.appendChild(time);
  msgs.appendChild(line);
  msgs.scrollTop = msgs.scrollHeight;
  bubble._line = line;
  return bubble;
}

async function loadHistory() {
  try {
    const r = await fetch(base + "/history");
    for (const m of await r.json()) add(m.role, m.content, m.ts);
  } catch (ex) {
    err.textContent = "could not load history";
    err.style.display = "block";
  }
}

async function submit(e) {
  e.preventDefault();
  const text = box.value.trim();
  if (!text || send.disabled) return;
  err.style.display = "none";
  add("user", text);
  box.value = "";
  send.disabled = true;
  const thinking = add("assistant", "…");
  try {
    const r = await fetch(base + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    thinking.textContent = data.reply;
  } catch (ex) {
    (thinking._line || thinking).remove();
    err.textContent = ex.message;
    err.style.display = "block";
  } finally {
    send.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
    box.focus();
    refreshDev();   // a failed send may have flipped credit state
  }
}

document.getElementById("f").addEventListener("submit", submit);
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(e); }
});
loadHistory();
</script>
</body>
</html>
