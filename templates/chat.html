<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ user }} — Sortie</title>
<script src="/static/theme.js?v=5"></script>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/saira-memjYa2wxmKQyPMrZX79wwYZQMhsyuSLiIvS.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIflMapbsEk7TDLdtEz1BwkebIl1R5_F.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIflMapbsEk7TDLdtEz1BwkeQI51R5_F.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIf6MapbsEk7TDLdtEz1BwkWn6pg.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/michroma-PN_zRfy9qWD8fEagAPg9pTk.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/sharetechmono-J7aHnp1uDWRBEqV98dVQztYldFcLowEF.woff2">
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/sortie/tokens.css?v=1">
<link rel="stylesheet" href="/static/sortie/sortie.css?v=1">

<style>
  body { display: flex; flex-direction: column; height: 100dvh; }
  .srt-appbar, #dev, #dev-link, #err, form { flex: none; }

  #msgs { flex: 1; overflow-y: auto; padding: var(--space-4);
          display: flex; flex-direction: column; gap: var(--space-3); }
  .line { display: flex; flex-direction: column; max-width: 85%; gap: var(--space-1); }
  .line.user { align-self: flex-end; align-items: flex-end; }
  .line.assistant { align-self: flex-start; align-items: flex-start; }
  .row { display: flex; align-items: flex-end; gap: var(--space-2); }

  /* The coach's mark: a square frame in the Comms idiom, corp identity. */
  .avatar { width: 32px; height: 32px; flex: none;
            background: var(--corp-soft) url("/static/coach.png?v=2") center/cover no-repeat;
            border: var(--hairline) solid var(--line); }

  .msg { max-width: 100%; padding: var(--space-2) var(--space-3);
         font-size: 15px; line-height: 22px;
         white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { background: var(--panel-raised); border: var(--hairline) solid var(--line);
              color: var(--ink); }
  .msg.assistant { background: var(--panel); border: var(--hairline) solid var(--line);
                   border-left: 2px solid var(--corp); }

  .ts { font-family: var(--font-mono); font-size: 11px; line-height: 14px;
        letter-spacing: .04em; color: var(--ink-faint); }
  .line.assistant .ts { margin-left: 40px; }

  /* Yes/No confirmation buttons under a coach bubble. */
  .quickreply { display: flex; gap: var(--space-2); margin: var(--space-2) 0 0 40px; }
  .qr.yes { color: var(--ok); background: transparent; border-color: var(--ok); }
  .qr.yes:hover { background: var(--panel-raised); }

  #err { display: none; color: var(--lamp); font-size: 13px; line-height: 18px;
         padding: 0 var(--space-4) var(--space-2); }

  form { display: flex; gap: var(--space-2); padding: var(--space-3);
         padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
         border-top: var(--hairline) solid var(--line); background: var(--bg-000); }
  #box { flex: 1; resize: none; }

  /* Dev strip (dev user only): API / credit health as a mono readout. */
  #dev { display: flex; align-items: center; gap: var(--space-2);
         padding: var(--space-1) var(--space-3);
         font-family: var(--font-mono); font-size: 11px; line-height: 16px;
         letter-spacing: .05em; color: var(--ink-muted);
         background: var(--bg-200); border-bottom: var(--hairline) solid var(--line);
         overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #dev::-webkit-scrollbar { display: none; }
  #dev > * { flex: 0 0 auto; }          /* keep natural width; overflow scrolls instead of clipping */
  #dev.bad { color: var(--lamp); border-bottom-color: var(--lamp); }
  #dev-status { white-space: nowrap; }
  #dev button, #dev a { padding: 1px var(--space-2); font: inherit; color: var(--ink-muted);
                border: var(--hairline) solid var(--line); background: transparent;
                cursor: pointer; text-decoration: none; }
  #dev button:hover, #dev a:hover { border-color: var(--line-strong); color: var(--ink); }
  #dev button:disabled { opacity: var(--opacity-disabled); cursor: not-allowed; }
  #dev-link { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
              padding: var(--space-2) var(--space-3);
              font-family: var(--font-mono); font-size: 12px; line-height: 16px;
              background: var(--panel); border-bottom: var(--hairline) solid var(--line); }
  #dev-link .note { width: 100%; color: var(--ink-muted); }
  #dev-link input { flex: 1; min-width: 11rem; font: inherit; color: var(--ink);
                    padding: var(--space-1) var(--space-2);
                    background: var(--bg-200); border: var(--hairline) solid var(--line); }
  #dev-link input:focus { border-color: var(--line-strong);
                          outline: var(--hairline) solid var(--focus); outline-offset: 2px; }
  #dev-link button { padding: var(--space-1) var(--space-2); font: inherit; cursor: pointer;
                     color: var(--ink); background: var(--panel-raised);
                     border: var(--hairline) solid var(--line); }
  #dev-link button:hover { background: var(--panel-selected); }
</style>
</head>
<body class="srt srt-ground">
<header class="srt-appbar">
  <div class="srt-appbar-bar">
    <h1 class="srt-appbar-title">Chat</h1>
    <span class="srt-tag is-chapter">//{{ user }}</span>
    <span class="srt-appbar-spacer"></span>
    <details class="srt-menu">
      <summary>Menu</summary>
      <nav class="srt-menu-panel">
        <a id="chat-link" aria-current="page" href="#">Chat</a>
        <a id="workout-link" href="#">Workout</a>
        <a id="review-link" href="#">Review</a>
        <a id="stats-link" href="#">Stats</a>
        <a id="log-link" href="#">Log</a>
        <a id="settings-link" href="#">Settings</a>
      </nav>
    </details>
  </div>
</header>
{% if dev %}
<div id="dev">
  <span id="dev-status">dev: loading…</span>
  <a id="dev-users" href="/app/users">Users</a>
  <button id="dev-invite" type="button">Invite user</button>
  <button id="dev-check" type="button">Check credit</button>
</div>
<div id="dev-link" hidden></div>
{% endif %}
<div id="msgs"></div>
<div id="err"></div>
<form id="f">
  <textarea id="box" class="srt-textarea" rows="1" placeholder="Ask your coach…" autocomplete="off"></textarea>
  <button id="send" class="srt-btn is-primary" type="submit">Send</button>
</form>
<script>
const base = location.pathname.replace(/\/$/, "");
document.getElementById("chat-link").href = base || "/app";
document.getElementById("workout-link").href = base + "/workout";
document.getElementById("stats-link").href = base + "/stats";
document.getElementById("review-link").href = base + "/review";
document.getElementById("log-link").href = base + "/log";
document.getElementById("settings-link").href = base + "/settings";

// Dev panel (rendered only for the dev user) — Anthropic API / credit health.
let refreshDev = () => {};
const devBar = document.getElementById("dev");
if (devBar) {
  const devStatus = document.getElementById("dev-status");
  const devCheck  = document.getElementById("dev-check");
  const render = (d) => {
    if (d.credit_ok) {
      devBar.classList.remove("bad");
      devStatus.textContent = "dev: API OK"
        + (d.last_ok_ts ? " · last ok " + d.last_ok_ts.slice(11, 16) : "")
        + " · " + d.model;
    } else {
      devBar.classList.add("bad");
      devStatus.textContent = "dev: Claude out of credit"
        + (d.last_error_ts ? " · since " + d.last_error_ts.slice(5, 16).replace("T", " ") : "");
    }
    devStatus.title = d.last_error || "";
  };
  refreshDev = async () => {
    try { const r = await fetch(base + "/devinfo"); if (r.ok) render(await r.json()); } catch (e) {}
  };
  devCheck.addEventListener("click", async () => {
    devCheck.disabled = true;
    devStatus.textContent = "dev: checking credit…";
    try { const r = await fetch(base + "/devinfo/ping", { method: "POST" });
          if (r.ok) render(await r.json()); } catch (e) {}
    finally { devCheck.disabled = false; }
  });

  // One-use new-user signup link. Endpoint is session-gated to the dev.
  const devInvite = document.getElementById("dev-invite");
  const devLink   = document.getElementById("dev-link");
  devInvite.addEventListener("click", async () => {
    devInvite.disabled = true;
    try {
      const r = await fetch("/app/invite/new", { method: "POST" });
      if (!r.ok) throw new Error();
      const url = location.origin + (await r.json()).path;
      devLink.hidden = false;
      devLink.textContent = "";
      const note = document.createElement("span");
      note.className = "note"; note.textContent = "single-use signup link — send it to the new user:";
      const inp = document.createElement("input");
      inp.readOnly = true; inp.value = url;
      const copy = document.createElement("button");
      copy.type = "button"; copy.textContent = "Copy";
      copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(url); }
        catch (e) { inp.select(); document.execCommand("copy"); }
        copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500);
      });
      devLink.append(note, inp, copy);
      inp.focus(); inp.select();
    } catch (e) {
      devLink.hidden = false; devLink.textContent = "invite failed — are you signed in as the dev?";
    } finally { devInvite.disabled = false; }
  });

  refreshDev();
  setInterval(refreshDev, 60000);
}
const msgs = document.getElementById("msgs");
const box  = document.getElementById("box");
const send = document.getElementById("send");
const err  = document.getElementById("err");

function fmtTs(d) {
  const t = d.toLocaleTimeString("en", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (d.toDateString() === new Date().toDateString()) return t;
  return d.toLocaleDateString("en", { day: "2-digit", month: "short" }) + " · " + t;
}

function add(role, text, ts) {
  // A new user message supersedes any pending Yes/No confirmation buttons.
  if (role === "user") document.querySelectorAll(".quickreply").forEach(q => q.remove());
  const line = document.createElement("div");
  line.className = "line " + role;
  const bubble = document.createElement("div");
  bubble.className = "msg " + role;
  bubble.textContent = text;
  if (role === "assistant") {
    const row = document.createElement("div");
    row.className = "row";
    const av = document.createElement("div");
    av.className = "avatar";
    av.title = '"Chatty" Stick';
    row.append(av, bubble);
    line.appendChild(row);
  } else {
    line.appendChild(bubble);
  }
  const time = document.createElement("div");
  time.className = "ts";
  time.textContent = fmtTs(ts ? new Date(ts) : new Date());
  line.appendChild(time);
  msgs.appendChild(line);
  msgs.scrollTop = msgs.scrollHeight;
  bubble._line = line;
  return bubble;
}

// When the coach asks for a yes/no confirmation, render tappable buttons under
// the bubble instead of making the athlete type another message.
function maybeQuickReplies(bubble, text) {
  const t = (text || "").trim();
  if (!(/confirm/i.test(t) && t.endsWith("?"))) return;
  const qr = document.createElement("div");
  qr.className = "quickreply";
  for (const msg of ["Yes", "No"]) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "srt-btn qr " + (msg === "Yes" ? "yes" : "no");
    b.textContent = msg;
    b.addEventListener("click", () => { qr.remove(); sendText(msg); });
    qr.appendChild(b);
  }
  (bubble._line || bubble).appendChild(qr);
  msgs.scrollTop = msgs.scrollHeight;
}

async function loadHistory() {
  try {
    const r = await fetch(base + "/history");
    let lastBubble = null, lastRole = "", lastText = "";
    for (const m of await r.json()) {
      lastBubble = add(m.role, m.content, m.ts);
      lastRole = m.role; lastText = m.content;
    }
    // A confirmation left hanging before a reload still gets its buttons.
    if (lastRole === "assistant") maybeQuickReplies(lastBubble, lastText);
  } catch (ex) {
    err.textContent = "could not load history";
    err.style.display = "block";
  }
}

async function sendText(text) {
  if (!text || send.disabled) return;
  err.style.display = "none";
  add("user", text);
  send.disabled = true;
  const thinking = add("assistant", "…");
  try {
    const r = await fetch(base + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    thinking.textContent = data.reply;
    maybeQuickReplies(thinking, data.reply);
  } catch (ex) {
    (thinking._line || thinking).remove();
    err.textContent = ex.message;
    err.style.display = "block";
  } finally {
    send.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
    box.focus();
    refreshDev();   // a failed send may have flipped credit state
  }
}

async function submit(e) {
  e.preventDefault();
  const text = box.value.trim();
  if (!text || send.disabled) return;
  box.value = "";
  sendText(text);
}

document.getElementById("f").addEventListener("submit", submit);
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(e); }
});
loadHistory();
</script>
</body>
</html>
