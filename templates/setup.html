<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set password — Gym Coach</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
         font-family: -apple-system, system-ui, sans-serif;
         background: Canvas; color: CanvasText; }
  .card { width: min(90vw, 22rem); padding: 2rem 1.5rem; }
  h1 { font-size: 1.6rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: .85rem; opacity: .75; margin: 0 0 1rem; }
  input { display: block; width: 100%; margin-top: .35rem; padding: .6rem .8rem;
          font: inherit; font-size: 1rem; color: inherit; background: transparent;
          border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
          border-radius: .6rem; }
  input:read-only { opacity: .6; }
  button { width: 100%; padding: .65rem; margin-top: .25rem; font: inherit;
           font-weight: 600; font-size: 1rem; background: #2563eb; color: #fff;
           border: 0; border-radius: .6rem; }
  .err { color: #dc2626; font-size: .85rem; margin: 0 0 1rem; }
  .hint { opacity: .6; font-size: .8rem; line-height: 1.45; margin-top: 1.25rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Hi {{ name }}</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/setup">
    <input type="hidden" name="t" value="{{ token }}">
    <label>Username
      <input name="username" value="{{ username }}" readonly autocomplete="username">
    </label>
    <label>New password
      <input type="password" name="password" autocomplete="new-password"
             minlength="{{ min_len }}" required>
    </label>
    <button type="submit">Save password</button>
  </form>
  <p class="hint">Your phone will offer to create a strong password and remember
  it for you — accept, and you'll never have to see or type it.</p>
</div>
</body>
</html>
