<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Review — {{ user }}</title>
<script src="/static/theme.js?v=5"></script>
<script src="/static/muscles.js?v=2"></script>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/saira-memjYa2wxmKQyPMrZX79wwYZQMhsyuSLiIvS.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIflMapbsEk7TDLdtEz1BwkebIl1R5_F.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIflMapbsEk7TDLdtEz1BwkeQI51R5_F.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/chakrapetch-cIf6MapbsEk7TDLdtEz1BwkWn6pg.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/michroma-PN_zRfy9qWD8fEagAPg9pTk.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/sharetechmono-J7aHnp1uDWRBEqV98dVQztYldFcLowEF.woff2">
<link rel="stylesheet" href="/static/fonts.css?v=1">
<link rel="stylesheet" href="/static/sortie/tokens.css?v=1">
<link rel="stylesheet" href="/static/sortie/sortie.css?v=1">
<link rel="stylesheet" href="/static/gym.css?v=6">
<style>
  main { padding: var(--space-5) var(--space-4); max-width: 720px; margin: 0 auto;
         padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom)); }
  .muted { color: var(--ink-muted); }

  /* Section eyebrows (JS renders h2.srt-eyebrow). */
  h2.srt-eyebrow { margin: var(--space-6) 0 var(--space-3); }
  h2.srt-eyebrow:first-child { margin-top: var(--space-1); }

  /* Readout slabs. */
  .card { background: var(--panel); border: var(--hairline) solid var(--line);
          padding: var(--space-4); margin-bottom: var(--space-3); }

  /* This week vs last: two labelled readouts side by side. */
  .weeks { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .week { background: var(--panel); border: var(--hairline) solid var(--line);
          padding: var(--space-4); }
  .week h3.srt-eyebrow { margin: 0 0 var(--space-2); }
  .big { font-family: var(--font-display); font-size: 22px; line-height: 28px;
         font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums;
         color: var(--ink); }
  .sub { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin-top: var(--space-1); }

  /* Day strip: one cell per weekday, filled with the session-type colour from the data. */
  .strip { display: flex; gap: var(--space-1); margin: var(--space-3) 0 var(--space-1); }
  .strip .d { flex: 1; height: 26px; display: grid; place-items: center;
              font-family: var(--font-mono); font-size: 12px; line-height: 16px;
              color: var(--bg-000); background: var(--bg-200); }
  .strip .d.rest { color: var(--ink-faint); }
  .dows { display: flex; gap: var(--space-1); }
  .dows .l { flex: 1; text-align: center; font-family: var(--font-mono);
             font-size: 10px; line-height: 14px; color: var(--ink-faint); }
  .delta.up { color: var(--ok); } .delta.down { color: var(--lamp); }

  /* Cadence readout. */
  .freq { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .bars { display: flex; align-items: flex-end; gap: var(--space-1); height: 60px;
          margin: var(--space-3) 0 var(--space-1); }
  .bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
               align-items: center; gap: var(--space-1); height: 100%; }
  .bars .bar { width: 70%; min-height: 2px; }
  .bars .bar.typ { background: var(--accent); }
  .bars .bar.non { background: var(--line); }
  .bars .lab { font-family: var(--font-mono); font-size: 10px; line-height: 14px;
               color: var(--ink-faint); }

  /* Suggested split: the one callout on the screen (gold), ok when it matches. */
  .sugg { border-color: var(--gold); }
  .sugg.match { border-color: var(--ok); }
  .sugg .name { font-family: var(--font-display); font-size: 20px; line-height: 26px;
                font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
                color: var(--ink); }
  .sugg .why { font-size: 13px; line-height: 18px; color: var(--ink-muted);
               margin-top: var(--space-3); }
  .sample { display: flex; gap: var(--space-1); flex-wrap: wrap;
            margin: var(--space-3) 0 var(--space-1); }
  .sample .s { font-family: var(--font-mono); font-size: 12px; line-height: 16px;
               padding: 2px var(--space-2); text-transform: uppercase; letter-spacing: .05em;
               color: var(--ink); background: var(--panel-raised);
               border: var(--hairline) solid var(--line); }
  .advice { margin-top: var(--space-3); padding: var(--space-2) var(--space-3);
            font-size: 13px; line-height: 18px; color: var(--ink-muted);
            background: var(--bg-200); border: var(--hairline) solid var(--line); }
  .foot { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin-top: var(--space-4); }

  /* Weekly muscle map */
  .mfig { display: block; height: 150px; width: 68px; }
  .mfig polygon { fill: var(--bg-200); stroke: var(--line); stroke-width: 3; }
  .mfig polygon.is-prim { fill: var(--accent); stroke: var(--accent); }
  .mfig polygon.is-sec { fill: var(--corp-soft); stroke: var(--corp); }
  .mm { background: var(--panel); border: var(--hairline) solid var(--line);
        padding: var(--space-4); margin-bottom: var(--space-6); }
  .mm-figs { display: flex; gap: var(--space-5); justify-content: center;
             padding: var(--space-2) 0; }
  .mm-hint { font-family: var(--font-mono); font-size: 11px; line-height: 16px;
             color: var(--ink-faint); text-align: center; margin: var(--space-1) 0 0; }
  .mm-list { margin-top: var(--space-3); border-top: var(--hairline) solid var(--line); }
  .mm-list-title { font-family: var(--font-label); font-size: 10px; line-height: 14px;
             letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
             margin: var(--space-3) 0 var(--space-2); }
  .mm-row { font-size: 14px; line-height: 20px; padding: var(--space-1) 0; }
  .mm-row .n { display: block; }
  .mm-row .meta { display: block; font-family: var(--font-mono); font-size: 11px;
             line-height: 16px; color: var(--ink-muted); }
  .mm-row .meta.sec { color: var(--ink-faint); }
  .mm-empty { font-size: 13px; color: var(--ink-muted); padding: var(--space-2) 0; }
</style>
</head>
<body class="srt srt-ground">
<header class="srt-appbar">
  <div class="srt-appbar-bar">
    <h1 class="srt-appbar-title">Review</h1>
    <span class="srt-tag is-chapter">//{{ user }}</span>
    <span class="srt-appbar-spacer"></span>
    <details class="srt-menu">
      <summary>Menu</summary>
      <nav class="srt-menu-panel">
        <a href="{{ chat_url }}">Chat</a>
        <a href="{{ chat_url }}/workout">Workout</a>
        <a aria-current="page" href="{{ chat_url }}/review">Review</a>
        <a href="{{ chat_url }}/stats">Stats</a>
        <a href="{{ chat_url }}/log">Log</a>
        <a href="{{ chat_url }}/settings">Settings</a>
      </nav>
    </details>
  </div>
</header>
<main id="main">
  <div class="srt-boot">
    <div class="srt-boot-label"><span>Loading</span><span class="srt-boot-sys">//review</span></div>
    <div class="srt-boot-track"></div>
    <div class="srt-boot-micro">comparing weeks</div>
  </div>
</main>
<script>
const DATA_URL = "{{ data_url }}";
const CHAT_URL = "{{ chat_url }}";
const TYPE_LABEL = { push: "Push", pull: "Pull", legs: "Legs", arms: "Arms" };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function weekCard(w, label, colours) {
  const c = el("div", "week");
  c.appendChild(el("h3", "srt-eyebrow", label));
  c.appendChild(el("div", "big", w.sessions + (w.sessions === 1 ? " session" : " sessions")));
  c.appendChild(el("div", "sub", w.sets + " working sets"));

  const strip = el("div", "strip");
  const dows = el("div", "dows");
  for (const day of w.days) {
    const d = el("div", "d" + (day.session_type ? "" : " rest"));
    if (day.session_type) {
      d.style.background = colours[day.session_type];
      d.textContent = TYPE_LABEL[day.session_type][0];
      d.title = day.weekday + " · " + TYPE_LABEL[day.session_type] + " · " + day.sets + " sets";
    } else {
      d.textContent = "·";
    }
    strip.appendChild(d);
    dows.appendChild(el("div", "l", day.weekday[0]));
  }
  c.appendChild(strip);
  c.appendChild(dows);

  if (w.bodyweight_change != null && w.bodyweight_change !== 0) {
    const up = w.bodyweight_change > 0;
    const s = el("div", "sub delta " + (up ? "up" : "down"),
                 (up ? "▲ +" : "▼ ") + w.bodyweight_change + " kg bodyweight");
    c.appendChild(s);
  }
  return c;
}


// ── Weekly muscle map (Mon–Sun) ──────────────────────────────────────────────
function mondayOf(d) {
  const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x.toISOString().slice(0, 10);
}
function fmtRange(a, b) { return a === b ? a : a + " → " + b; }

function muscleListInto(box, muscle, data) {
  box.textContent = "";
  const d = data[muscle];
  box.appendChild(el("div", "mm-list-title",
    muscle.replace(/_/g, " ") + (d ? "  ·  " + d.exercises.length + " exercises" : "")));
  if (!d) { box.appendChild(el("div", "mm-empty", "Not trained in this window.")); return; }
  d.exercises.forEach(x => {
    const row = el("div", "mm-row");
    row.appendChild(el("span", "n", x.exercise));
    row.appendChild(el("span", "meta" + (x.role === "secondary" ? " sec" : ""),
      x.role + " · " + x.sets + " sets · " + fmtRange(x.first, x.last)));
    box.appendChild(row);
  });
}

// Returns its container synchronously (so it keeps its place in the page)
// and fills in the figures once the data arrives.
function weeklyMuscleMap() {
  const frag = document.createDocumentFragment();
  frag.appendChild(el("h2", "srt-eyebrow", "This week\u2019s targets"));
  const wrap = el("section", "mm");
  frag.appendChild(wrap);
  (async () => {
    let data = {};
    try {
      const r = await fetch(CHAT_URL + "/muscles?since=" + mondayOf(new Date()));
      data = (await r.json()).muscles || {};
    } catch (e) {
      wrap.appendChild(el("p", "mm-empty", "Couldn\u2019t load muscle data."));
      return;
    }
    const primary = [], secondary = [];
    for (const [m, d] of Object.entries(data)) {
      if (d.exercises.some(x => x.role === "primary")) primary.push(m);
      else secondary.push(m);
    }
    const figs = el("div", "mm-figs");
    const list = el("div", "mm-list"); list.hidden = true;
    const pick = m => { list.hidden = false; muscleListInto(list, m, data); };
    figs.appendChild(muscleFigure("front", { primary, secondary, onPick: pick }));
    figs.appendChild(muscleFigure("back", { primary, secondary, onPick: pick }));
    wrap.appendChild(figs);
    wrap.appendChild(el("p", "mm-hint",
      primary.length || secondary.length
        ? "Monday \u2192 Sunday \u00b7 tap a muscle for its exercises"
        : "Nothing logged yet this week."));
    wrap.appendChild(list);
  })();
  return frag;
}

function render(d) {
  const main = document.getElementById("main");
  main.textContent = "";
  main.classList.add("srt-reveal");
  setTimeout(() => main.classList.remove("srt-reveal"), 700);
  const colours = d.colours;

  // ── This week vs last week ──
  main.appendChild(el("h2", "srt-eyebrow", "This week vs last"));
  const weeks = el("div", "weeks");
  weeks.appendChild(weekCard(d.this_week, "This week", colours));
  weeks.appendChild(weekCard(d.prev_week, "Last week", colours));
  main.appendChild(weeks);

  main.appendChild(weeklyMuscleMap());

  // ── Cadence ──
  const f = d.frequency;
  main.appendChild(el("h2", "srt-eyebrow", "How often you train"));
  const fc = el("div", "card");
  if (!f.weeks_analysed) {
    fc.appendChild(el("div", "muted", "Not enough history yet — train for a couple of weeks and this fills in."));
  } else {
    const line = el("div", "freq");
    line.appendChild(el("span", "srt-numeral-lg", f.avg_per_week));
    const span = f.weeks_analysed >= 9
      ? "last " + Math.round(f.weeks_analysed / 4.33) + " months"
      : "last " + f.weeks_analysed + (f.weeks_analysed === 1 ? " week" : " weeks");
    line.appendChild(el("span", "sub", "sessions/week on average · " + span
                        + (f.target_per_week ? " · you aim for " + f.target_per_week : "")));
    fc.appendChild(line);

    // Day-of-week histogram.
    const max = Math.max(1, ...Object.values(f.day_counts));
    const bars = el("div", "bars");
    for (const wd of ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]) {
      const col = el("div", "col");
      const n = f.day_counts[wd] || 0;
      const bar = el("div", "bar " + (f.typical_days.includes(wd) ? "typ" : "non"));
      bar.style.height = (n / max * 100) + "%";
      bar.title = wd + ": trained " + n + " of " + f.weeks_analysed + " weeks";
      col.appendChild(bar);
      col.appendChild(el("div", "lab", wd[0]));
      bars.appendChild(col);
    }
    fc.appendChild(bars);
    if (f.typical_days.length) {
      fc.appendChild(el("div", "sub", "Your usual days: " + f.typical_days.join(", ")));
    }
  }
  main.appendChild(fc);

  // ── Suggested split ──
  main.appendChild(el("h2", "srt-eyebrow", "Suggested split"));
  const s = d.suggestion;
  if (!s) {
    main.appendChild(el("div", "card muted", "Need a bit more training history to suggest a split."));
  } else {
    const match = !s.changes_recommended;
    const sc = el("div", "card sugg" + (match ? " match" : ""));
    sc.appendChild(el("div", "name", s.name));
    sc.appendChild(el("div", "sub", s.cadence + " · " + s.per_muscle));

    const sample = el("div", "sample");
    for (const day of s.sample) {
      const tag = el("div", "s", day);
      const key = day.toLowerCase();
      if (colours[key]) {
        tag.style.background = colours[key];
        tag.style.color = "var(--bg-000)";
        tag.style.borderColor = "transparent";
      }
      sample.appendChild(tag);
    }
    sc.appendChild(sample);
    sc.appendChild(el("div", "sub muted", "a sample week"));
    sc.appendChild(el("div", "why", s.rationale));
    if (s.programmable === false) {
      sc.appendChild(el("div", "advice",
        "Advice only — the app doesn't auto-build this split. Your coach would set it up manually."));
    }
    main.appendChild(sc);

    const foot = el("div", "foot");
    if (match) {
      foot.innerHTML = "This is the split you're already on (<b>" + d.current_split
        + "</b>) — your training frequency fits it well. Nothing to change.";
    } else {
      foot.innerHTML = "You're currently programmed on <b>" + d.current_split + "</b> ("
        + d.current_split_days + "×/week), but you're averaging " + f.avg_per_week
        + " sessions. The split above fits your real cadence better. "
        + "Nothing changes automatically — if you'd like to switch, "
        + "<a href=\"" + CHAT_URL + "\">tell your coach in the chat</a> and they'll set it up.";
    }
    main.appendChild(foot);
  }
}

fetch(DATA_URL)
  .then(r => r.json())
  .then(d => { if (d.error) throw new Error(d.error); render(d); })
  .catch(e => {
    document.getElementById("main").innerHTML =
      '<p class="muted">Could not load your review (' + e.message + ').</p>';
  });
</script>
</body>
</html>
