<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ user }} — Training Stats</title>
<link rel="stylesheet" href="/static/tdr.css?v=6">
<style>
  body { margin: 0; line-height: 1.4; }
  main { padding: 1rem; max-width: 720px; margin: 0 auto;
         padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
  h2 { font-family: var(--mono); font-size: .74rem; letter-spacing: .16em;
       text-transform: uppercase; color: var(--dim);
       margin: 1.8rem 0 .7rem; display: flex; align-items: center; gap: .5rem; }
  h2::before { content: ""; width: 7px; height: 8px; background: var(--magenta);
       clip-path: polygon(0 0, 100% 50%, 0 100%); flex: 0 0 auto; }
  .muted { color: color-mix(in srgb, CanvasText 55%, transparent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .6rem; }
  .card { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
          border-radius: .8rem; padding: .7rem .8rem; }
  .card .n { font-size: 1.5rem; font-weight: 700; }
  .card .l { font-size: .78rem; }
  .bars { display: flex; flex-direction: column; gap: .45rem; }
  .bar-row { display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
  .bar-label { width: 3.2rem; text-transform: capitalize; }
  .bar-track { flex: 1; position: relative; background: rgba(255,255,255,.06);
               border: 1px solid var(--line); border-radius: 0; height: 1.15rem; }
  .bar-fill { height: 100%; border-radius: 0; transform-origin: left center;
              animation: barFill .9s cubic-bezier(.22,1,.36,1) both,
                         barPulse 2.4s ease-in-out .9s infinite; }
  .bar-track::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 6px, var(--bg) 6px 8px); }
  @keyframes barFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes barPulse {
    0%, 100% { box-shadow: 0 0 6px var(--glow), 0 0 14px var(--glow); }
    50%      { box-shadow: 0 0 11px var(--glow), 0 0 24px var(--glow); filter: brightness(1.18); }
  }
  /* target reference line: dashes march to the right + a glow pulse */
  .refline { animation: refMarch .9s linear infinite, refPulse 1.9s ease-in-out infinite; }
  @keyframes refMarch { to { stroke-dashoffset: -6; } }
  @keyframes refPulse {
    0%, 100% { filter: drop-shadow(0 0 2px var(--rc)) drop-shadow(0 0 5px var(--rc)); }
    50%      { filter: drop-shadow(0 0 3px var(--rc)) drop-shadow(0 0 10px var(--rc)); }
  }
  .bar-n { width: 2rem; text-align: right; font-variant-numeric: tabular-nums; }
  .chart { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
           border-radius: .8rem; padding: .7rem .8rem; margin-bottom: .7rem; }
  .chart-head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .4rem; }
  .chart-title { font-weight: 600; font-size: .92rem; text-shadow: 0 0 9px currentColor; }
  .chart-sub { font-size: .78rem; }
  .chart svg { width: 100%; height: 120px; display: block; overflow: visible; }
  .pie-wrap { display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap;
              border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
              border-radius: .8rem; padding: .8rem; }
  .pie-wrap svg { width: 130px; height: 130px; flex: 0 0 auto; }
  .pie-legend { display: flex; flex-direction: column; gap: .35rem; font-size: .85rem; }
  .pie-legend .row { display: flex; align-items: center; gap: .5rem; }
  .pie-legend .name { width: 3.2rem; text-transform: capitalize; }
  .pie-legend .pct { font-variant-numeric: tabular-nums;
                     color: color-mix(in srgb, CanvasText 55%, transparent); }
  .legend { display: flex; flex-wrap: wrap; gap: .8rem; font-size: .8rem; margin: .3rem 0 .9rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; text-transform: capitalize; }
  .dot { width: .8rem; height: .8rem; border-radius: .25rem; display: inline-block; }
  .cal-month { margin-bottom: 1rem; }
  .cal-title { font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { font-size: .65rem; text-align: center; color: color-mix(in srgb, CanvasText 50%, transparent); }
  .cal-cell { aspect-ratio: 1; border-radius: .3rem; display: flex;
              align-items: center; justify-content: center; font-size: .7rem;
              background: color-mix(in srgb, CanvasText 7%, transparent); }
  .cal-cell.empty { background: transparent; }
  .cal-cell.trained { color: #05050a; font-weight: 700; }
  #err { color: var(--danger); font-family: var(--mono); padding: 1rem; }
  .card .n { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
</style>
</head>
<body>
<header class="hud">
  <div class="hud__bar">
    <span class="hud__brand"><b>■</b>STATS</span>
    <span class="hud__jp">データ</span>
    <span class="tag">{{ user }}</span>
    <span class="hud__spacer"></span>
    <nav class="hud__nav">
      <a href="{{ chat_url }}/review">▸ Review</a>
      <a href="{{ chat_url }}">◂ Chat</a>
    </nav>
  </div>
  <div class="hud__hazard"></div>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div id="err"></div>

<script>
const DATA_URL = {{ data_url | tojson }};
const main = document.getElementById("main");
const errEl = document.getElementById("err");

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}

function card(n, label) {
  const c = el("div", "card");
  c.appendChild(el("div", "n", n));
  c.appendChild(el("div", "l muted", label));
  return c;
}

function balanceBars(balance, colours, title) {
  const wrap = el("div");
  wrap.appendChild(el("h2", null, title));
  const bars = el("div", "bars");
  const max = Math.max(1, ...Object.values(balance));
  for (const st of ["push", "pull", "legs", "arms"]) {
    const n = balance[st] || 0;
    const row = el("div", "bar-row");
    row.appendChild(el("div", "bar-label", st));
    const track = el("div", "bar-track");
    const fill = el("div", "bar-fill");
    fill.style.width = (100 * n / max) + "%";
    fill.style.background = colours[st];
    fill.style.setProperty("--glow", colours[st]);
    fill.style.boxShadow = `0 0 6px ${colours[st]}, 0 0 14px ${colours[st]}`;
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "bar-n", n));
    bars.appendChild(row);
  }
  wrap.appendChild(bars);
  return wrap;
}

const SVGNS = "http://www.w3.org/2000/svg";

function pieChart(balance, colours, title) {
  const wrap = el("div");
  wrap.appendChild(el("h2", null, title));
  const order = ["push", "pull", "legs", "arms"];
  const total = order.reduce((s, st) => s + (balance[st] || 0), 0);
  if (!total) { wrap.appendChild(el("p", "muted", "No sessions logged yet.")); return wrap; }

  const box = el("div", "pie-wrap reg");
  const R = 16, C = 18;                       // radius, centre (viewBox 36x36)
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 36 36");
  const arc = (cx, cy, r, a0, a1) => {
    const p = (a) => [cx + r * Math.cos((a - 90) * Math.PI / 180),
                      cy + r * Math.sin((a - 90) * Math.PI / 180)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z`;
  };
  let angle = 0;
  for (const st of order) {
    const n = balance[st] || 0;
    if (!n) continue;
    const sweep = 360 * n / total;
    let shape;
    if (n === total) {                        // single slice = full circle (arc degenerates)
      shape = document.createElementNS(SVGNS, "circle");
      shape.setAttribute("cx", C); shape.setAttribute("cy", C); shape.setAttribute("r", R);
    } else {
      shape = document.createElementNS(SVGNS, "path");
      shape.setAttribute("d", arc(C, C, R, angle, angle + sweep));
    }
    shape.setAttribute("fill", colours[st]);
    shape.setAttribute("stroke", "#0a0a0c");        // dark separators between segments
    shape.setAttribute("stroke-width", "0.6");
    shape.setAttribute("style", `filter: drop-shadow(0 0 1.5px ${colours[st]}) drop-shadow(0 0 3.5px ${colours[st]})`);
    svg.appendChild(shape);
    angle += sweep;
  }
  // gauge frame ring + donut hub with a centre readout
  svg.appendChild(svgEl("circle", { cx: C, cy: C, r: R + 0.5, fill: "none",
    stroke: "#00e5ff", "stroke-width": .4, "stroke-opacity": .35 }));
  svg.appendChild(svgEl("circle", { cx: C, cy: C, r: 8, fill: "#0d0d11",
    stroke: "#ffffff", "stroke-width": .3, "stroke-opacity": .15 }));
  const cn = svgEl("text", { x: C, y: C - 0.2, "text-anchor": "middle", "font-size": 6,
    "font-family": MONO, "font-weight": "700", fill: "#fff" });
  cn.textContent = total;
  svg.appendChild(cn);
  const cl = svgEl("text", { x: C, y: C + 4, "text-anchor": "middle", "font-size": 2.4,
    "font-family": MONO, fill: "#00e5ff", "letter-spacing": ".3" });
  cl.textContent = "SESSIONS";
  svg.appendChild(cl);
  box.appendChild(svg);

  const leg = el("div", "pie-legend");
  for (const st of order) {
    const n = balance[st] || 0;
    const row = el("div", "row");
    const dot = el("span", "dot"); dot.style.background = colours[st];
    row.appendChild(dot);
    row.appendChild(el("span", "name", st));
    row.appendChild(el("span", "pct", `${n} · ${Math.round(100 * n / total)}%`));
    leg.appendChild(row);
  }
  box.appendChild(leg);
  wrap.appendChild(box);
  return wrap;
}

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const MONO = "ui-monospace, Menlo, monospace";
let _chartId = 0;

function lineChart(series, colour, valKey = "e1rm", refLine = null, overlay = null) {
  // viewBox coords; CSS scales width. Styled like a ship diagnostic readout:
  // graticule, area-fade under the trace, glow, corner ticks, end marker.
  const W = 300, H = 120, padL = 34, padR = 12, padT = 12, padB = 18;
  const gid = "grad" + (_chartId++);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const glow = c => `filter: drop-shadow(0 0 2px ${c}) drop-shadow(0 0 6px ${c})`;

  const vals = series.map(p => p[valKey]);
  if (refLine != null) vals.push(refLine.value);          // ref line must fit the y-range
  if (overlay) for (const p of overlay.series) vals.push(p[valKey]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => padL + (W - padL - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const x0 = padL, x1 = W - padR, yB = H - padB;

  // area-fade gradient
  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": colour, "stop-opacity": .38 }));
  grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": colour, "stop-opacity": 0 }));
  defs.appendChild(grad); svg.appendChild(defs);

  // graticule — fine HUD grid
  for (let i = 0; i <= 4; i++) {
    const gy = padT + (yB - padT) * i / 4;
    svg.appendChild(svgEl("line", { x1: x0, y1: gy, x2: x1, y2: gy,
      stroke: "currentColor", "stroke-opacity": .09 }));
  }
  for (let i = 0; i <= 6; i++) {
    const gx = x0 + (x1 - x0) * i / 6;
    svg.appendChild(svgEl("line", { x1: gx, y1: padT, x2: gx, y2: yB,
      stroke: "currentColor", "stroke-opacity": .05 }));
  }
  // y labels at lo/hi (mono)
  for (const v of [lo + pad, hi - pad]) {
    const t = svgEl("text", { x: x0 - 4, y: y(v) + 3, "text-anchor": "end",
      "font-size": 8, "font-family": MONO, fill: "currentColor", "fill-opacity": .5 });
    t.textContent = Math.round(v); svg.appendChild(t);
  }

  const pts = series.map((p, i) => [x(i), y(p[valKey])]);
  // area under the trace
  const areaD = `M${pts[0][0]},${yB} ` + pts.map(p => `L${p[0]},${p[1]}`).join(" ")
              + ` L${pts[pts.length - 1][0]},${yB} Z`;
  svg.appendChild(svgEl("path", { d: areaD, fill: `url(#${gid})`, stroke: "none" }));

  // main trace — faded/thin when a smoothed overlay sits on top of it
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  const trace = svgEl("path", { d, fill: "none", stroke: colour,
    "stroke-width": overlay ? 1 : 2, "stroke-opacity": overlay ? 0.3 : 1,
    "stroke-linejoin": "round", "stroke-linecap": "round" });
  if (!overlay) trace.setAttribute("style", glow(colour));
  svg.appendChild(trace);

  // data markers (small glowing squares) — skip on dense/overlay series
  if (series.length <= 40 && !overlay) {
    for (const p of pts) {
      svg.appendChild(svgEl("rect", { x: p[0] - 1.5, y: p[1] - 1.5, width: 3, height: 3,
        fill: colour, style: glow(colour) }));
    }
  }
  // smoothed trend overlay (drawn bold + glowing)
  if (overlay && overlay.series.length) {
    const d2 = overlay.series.map((p, i) => (i ? "L" : "M") + x(i) + " " + y(p[valKey])).join(" ");
    const oc = overlay.colour || colour;
    const op = svgEl("path", { d: d2, fill: "none", stroke: oc, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round" });
    op.setAttribute("style", glow(oc));
    svg.appendChild(op);
  }
  // reference line (dashed) + label, e.g. target bodyweight
  if (refLine != null) {
    const ry = y(refLine.value), rc = refLine.colour || colour;
    svg.appendChild(svgEl("line", { x1: x0, y1: ry, x2: x1, y2: ry, stroke: rc,
      "stroke-width": 1.1, "stroke-dasharray": "3 3", "stroke-opacity": .95,
      "stroke-dashoffset": 0, class: "refline", style: glow(rc) + `; --rc: ${rc}` }));
    const t = svgEl("text", { x: x1, y: ry - 3, "text-anchor": "end",
      "font-size": 8, "font-family": MONO, fill: rc, style: glow(rc) });
    t.textContent = refLine.label; svg.appendChild(t);
  }
  // end-of-trace marker: glowing ring + core at the latest reading
  const end = pts[pts.length - 1], ec = overlay ? (overlay.colour || colour) : colour;
  const ring = svgEl("circle", { cx: end[0], cy: end[1], r: 3.4, fill: "none",
    stroke: ec, "stroke-width": 1, "stroke-opacity": .8 });
  ring.setAttribute("style", glow(ec));
  svg.appendChild(ring);
  svg.appendChild(svgEl("circle", { cx: end[0], cy: end[1], r: 1.4, fill: "#fff" }));

  // corner ticks around the plot frame (cyan HUD brackets)
  const tk = 5, tc = "#00e5ff";
  const corner = (cx, cy, sx, sy) => {
    svg.appendChild(svgEl("line", { x1: cx, y1: cy, x2: cx + sx * tk, y2: cy,
      stroke: tc, "stroke-opacity": .45 }));
    svg.appendChild(svgEl("line", { x1: cx, y1: cy, x2: cx, y2: cy + sy * tk,
      stroke: tc, "stroke-opacity": .45 }));
  };
  corner(x0, padT, 1, 1); corner(x1, padT, -1, 1);
  corner(x0, yB, 1, -1);  corner(x1, yB, -1, -1);

  // x labels: first + last date (YYYY-MM-DD -> MMM 'YY)
  const fmt = ds => new Date(ds).toLocaleString("en", { month: "short", year: "2-digit" });
  const first = svgEl("text", { x: x0, y: H - 5, "font-size": 8, "font-family": MONO,
    fill: "currentColor", "fill-opacity": .5 });
  first.textContent = fmt(series[0].date).toUpperCase();
  svg.appendChild(first);
  if (series.length > 1) {
    const last = svgEl("text", { x: x1, y: H - 5, "text-anchor": "end", "font-size": 8,
      "font-family": MONO, fill: "currentColor", "fill-opacity": .5 });
    last.textContent = fmt(series[series.length - 1].date).toUpperCase();
    svg.appendChild(last);
  }
  return svg;
}

function anchorChart(a) {
  const box = el("div", "chart reg");
  const head = el("div", "chart-head");
  const title = el("div", "chart-title", a.session_type.toUpperCase() + " · " + a.lift);
  title.style.color = a.colour;
  head.appendChild(title);
  if (a.series.length >= 2) {
    head.appendChild(el("div", "chart-sub muted",
      `latest ${a.latest_e1rm}kg · best ${a.best_e1rm}kg · ${a.sessions} sessions`));
  }
  box.appendChild(head);
  if (a.series.length >= 2) {
    box.appendChild(lineChart(a.series, a.colour));
  } else {
    box.appendChild(el("div", "chart-sub muted",
      a.series.length === 1 ? "Only one logged session so far — need 2+ to chart a trend."
                            : "No logged sessions for this lift yet."));
  }
  return box;
}

const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
const DOW = ["M","T","W","T","F","S","S"];

function monthGrid(year, month, calendar, colours) {
  const wrap = el("div", "cal-month");
  wrap.appendChild(el("div", "cal-title", MONTHS[month] + " " + year));
  const grid = el("div", "cal-grid");
  for (const d of DOW) grid.appendChild(el("div", "cal-dow", d));
  const first = new Date(year, month, 1);
  let lead = (first.getDay() + 6) % 7; // Mon=0
  for (let i = 0; i < lead; i++) grid.appendChild(el("div", "cal-cell empty"));
  const days = new Date(year, month + 1, 0).getDate();
  for (let day = 1; day <= days; day++) {
    const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const st = calendar[iso];
    const cell = el("div", "cal-cell" + (st ? " trained" : ""), String(day));
    if (st) { cell.style.background = colours[st];
              cell.style.boxShadow = `0 0 5px ${colours[st]}, 0 0 10px ${colours[st]}`;
              cell.title = `${iso} — ${st}`; }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}

function render(data) {
  main.textContent = "";
  const s = data.summary, colours = data.colours;

  // headline cards
  const cards = el("div", "cards");
  cards.appendChild(card(s.total_sessions, "total sessions"));
  cards.appendChild(card(s.sessions_this_week, "this week"));
  cards.appendChild(card(s.sessions_this_month, "this month"));
  cards.appendChild(card(s.current_streak, "day streak"));
  main.appendChild(cards);

  // legend
  const legend = el("div", "legend");
  for (const st of ["push", "pull", "legs", "arms"]) {
    const sp = el("span");
    const dot = el("span", "dot"); dot.style.background = colours[st];
    sp.appendChild(dot); sp.appendChild(document.createTextNode(st));
    legend.appendChild(sp);
  }

  // balance
  main.appendChild(balanceBars(s.balance_28d, colours, "Split balance (last 28 days)"));
  main.appendChild(legend);

  // anchor charts
  main.appendChild(el("h2", null, "Anchor lift progress (e1RM)"));
  if (!data.anchors.length) main.appendChild(el("p", "muted", "No anchor lifts configured."));
  for (const a of data.anchors) main.appendChild(anchorChart(a));

  // bodyweight over time
  main.appendChild(el("h2", null, "Bodyweight"));
  const bw = data.bodyweight || {};
  if (bw.series && bw.series.length >= 2) {
    const box = el("div", "chart reg");
    const head = el("div", "chart-head");
    let sub = `latest ${bw.latest}kg · ${bw.series.length} readings`;
    if (bw.rate_kg_per_week != null) {
      const r = bw.rate_kg_per_week;
      const sign = r > 0 ? "+" : (r < 0 ? "−" : "±");
      sub += ` · ${sign}${Math.abs(r)} kg/wk (${bw.rate_days}d)`;
    }
    if (bw.target != null) sub += ` · target ${bw.target}kg`;
    head.appendChild(el("div", "chart-sub muted", sub));
    box.appendChild(head);
    const ref = bw.target != null
      ? { value: bw.target, label: `target ${bw.target}kg`, colour: "#dc2626" } : null;
    const overlay = (bw.smoothed && bw.smoothed.length)
      ? { series: bw.smoothed, colour: bw.colour } : null;
    box.appendChild(lineChart(bw.series, bw.colour, "weight", ref, overlay));
    main.appendChild(box);
  } else {
    main.appendChild(el("p", "muted", "weight tracker not connected"));
  }

  // overall split pie (all-time), just before the calendar
  main.appendChild(pieChart(s.balance_all_time, colours, "Overall split balance (all time)"));

  // calendar — current month back 3 (4 months total), newest first
  main.appendChild(el("h2", null, "Training calendar"));
  const now = new Date();
  for (let i = 0; i < 4; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    main.appendChild(monthGrid(d.getFullYear(), d.getMonth(), data.calendar, colours));
  }
}

fetch(DATA_URL)
  .then(r => r.ok ? r.json() : Promise.reject(new Error("could not load stats")))
  .then(render)
  .catch(e => { main.textContent = ""; errEl.textContent = e.message; });
</script>
</body>
</html>
