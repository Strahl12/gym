<style>
  main { padding: var(--space-5); max-width: 720px; margin: 0 auto;
         padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom)); }
  main > .srt-panel { margin-bottom: var(--space-6); }
  .muted { color: var(--ink-muted); font-size: 13px; line-height: 18px; }

  /* headline readouts */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--space-3); }
  .card { background: var(--bg-200); border: var(--hairline) solid var(--line);
          padding: var(--space-3) var(--space-4); }
  .card .srt-eyebrow { margin-top: var(--space-1); }

  /* split balance gauges */
  .bars { display: flex; flex-direction: column; gap: var(--space-3); }
  .bar-row { display: flex; align-items: center; gap: var(--space-3); }
  .bar-label { width: 56px; font-size: 14px; line-height: 18px; text-transform: capitalize; color: var(--ink); }
  .bar-row .srt-gauge { flex: 1; }
  .bar-n { width: 36px; text-align: right; font-family: var(--font-display); font-size: 15px;
           font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--ink); }

  /* charts: plot on bg-100 with a hairline frame */
  .chart { background: var(--bg-100); border: var(--hairline) solid var(--line);
           padding: var(--space-3) var(--space-4); }
  .chart:not(:last-child) { margin-bottom: var(--space-3); }
  .chart-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap;
                margin-bottom: var(--space-2); }
  .chart-title { font-family: var(--font-display); font-size: 15px; line-height: 20px;
                 font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  .chart-sub { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
  .chart svg { width: 100%; height: 120px; display: block; overflow: visible; }

  /* split pie */
  .pie-wrap { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
  .pie-wrap svg { width: 130px; height: 130px; flex: 0 0 auto; }
  .pie-legend { display: flex; flex-direction: column; gap: var(--space-2); font-size: 14px; line-height: 18px; }
  .pie-legend .row { display: flex; align-items: center; gap: var(--space-2); }
  .pie-legend .name { width: 56px; text-transform: capitalize; }
  .pie-legend .pct { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted);
                     font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: 13px; line-height: 18px;
            color: var(--ink-muted); margin: 0 0 var(--space-3); }
  .legend span { display: inline-flex; align-items: center; gap: var(--space-2); text-transform: capitalize; }
  .dot { width: 10px; height: 10px; display: inline-block; flex: none; }

  /* training calendar */
  .cal-month { margin-bottom: var(--space-4); }
  .cal-month:last-child { margin-bottom: 0; }
  .cal-title { font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 500;
               letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
               margin-bottom: var(--space-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-1); }
  .cal-dow { font-family: var(--font-mono); font-size: 10px; line-height: 14px; text-align: center;
             color: var(--ink-faint); }
  .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
              font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);
              background: var(--bg-200); }
  .cal-cell.empty { background: transparent; }
  .cal-cell.trained { color: var(--on-accent); cursor: pointer; }
  .cal-cell.trained:hover { outline: var(--hairline) solid var(--line-strong); }
  .cal-cell.today { outline: var(--hairline) solid var(--focus); outline-offset: 1px; }

  #err { margin: var(--space-4) var(--space-5); }
  #err:empty { display: none; }

  /* click-a-day session panel */
  .modal-back { position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: flex-start; justify-content: center; overflow-y: auto;
    overscroll-behavior: contain;
    padding: max(var(--space-4), env(safe-area-inset-top)) var(--space-4)
             calc(var(--space-6) + env(safe-area-inset-bottom));
    background: var(--scrim); opacity: 0; transition: opacity .18s ease; }
  .modal-back.open { opacity: 1; }
  .modal-back.closing { opacity: 0; }
  .modal { position: relative; width: 100%; max-width: 560px; margin-top: var(--space-7);
    background: var(--panel-solid); border: var(--hairline) solid var(--line-strong);
    padding: var(--space-4) var(--space-5) var(--space-5);
    transform: translateY(16px); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .modal-back.open .modal { transform: none; }
  .modal-back.closing .modal { transform: translateY(16px); }
  @media (prefers-reduced-motion: reduce) {
    .modal-back, .modal { transition: none; }
  }
  .modal-close { position: absolute; top: var(--space-2); right: var(--space-2);
    width: 28px; height: 28px; font-family: var(--font-mono); font-size: 15px; line-height: 1;
    color: var(--ink-muted); background: transparent; border: var(--hairline) solid var(--line);
    cursor: pointer; }
  .modal-close:hover { color: var(--ink); border-color: var(--line-strong); }
  .modal-load { color: var(--ink-muted); font-family: var(--font-mono); font-size: 13px;
    line-height: 18px; padding: var(--space-2) 0; }
  .day-head { margin-bottom: var(--space-4); padding-right: var(--space-6); }
  .day-title { font-family: var(--font-display); font-size: 18px; line-height: 24px;
    font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  .day-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-2); }
  .day-chip { font-family: var(--font-mono); font-size: 11px; line-height: 16px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--on-accent);
    padding: 2px var(--space-2); }
  .day-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: var(--space-2); margin-bottom: var(--space-4); }
  .day-stat { background: var(--bg-200); border: var(--hairline) solid var(--line);
    padding: var(--space-2) var(--space-3); }
  .day-stat .n { font-family: var(--font-display); font-size: 18px; line-height: 24px;
    font-weight: 600; letter-spacing: .04em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .day-stat .l { font-family: var(--font-label); font-size: 9px; line-height: 13px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
    margin-top: var(--space-1); }
  .day-topset { font-family: var(--font-mono); font-size: 12px; line-height: 16px;
    color: var(--gold); margin-bottom: var(--space-4); }
  .dex { border-top: var(--hairline) solid var(--line); padding: var(--space-3) 0 var(--space-1); }
  .dex-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .dex-name { font-family: var(--font-display); font-size: 14px; line-height: 18px;
    font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  .dex.main .dex-name { color: var(--accent); }
  .dex-meta { font-family: var(--font-mono); font-size: 11px; line-height: 16px;
    letter-spacing: .06em; color: var(--ink-muted); margin-left: auto; text-transform: uppercase; }
  .dset-row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .dset { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted);
    background: var(--bg-200); border: var(--hairline) solid var(--line); padding: 2px var(--space-2); }
  .dset b { color: var(--ink); font-weight: 400; }
  .dset.warm { color: var(--ink-faint); border-style: dashed; }

  /* All-time muscle heat-map */
  .mfig { display: block; height: 170px; width: 77px; }
  .mfig polygon { fill: var(--bg-200); stroke: var(--line); stroke-width: 3; }
  .mfig polygon.is-heat { fill: var(--accent); stroke: var(--accent); }
  .mm-figs { display: flex; gap: var(--space-6); justify-content: center;
             padding: var(--space-2) 0; }
  .mm-hint { font-family: var(--font-mono); font-size: 11px; line-height: 16px;
             color: var(--ink-faint); text-align: center; margin: var(--space-1) 0 0; }
  .mm-list { margin-top: var(--space-3); border-top: var(--hairline) solid var(--line); }
  .mm-list-title { font-family: var(--font-label); font-size: 10px; line-height: 14px;
             letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
             margin: var(--space-3) 0 var(--space-2); }
  .mm-row { font-size: 14px; line-height: 20px; padding: var(--space-1) 0; }
  .mm-row .n { display: block; }
  .mm-row .meta { display: block; font-family: var(--font-mono); font-size: 11px;
             line-height: 16px; color: var(--ink-muted); }
  .mm-row .meta.sec { color: var(--ink-faint); }
  .mm-empty { font-size: 13px; color: var(--ink-muted); padding: var(--space-2) 0; }
</style>

<body class="srt srt-ground">
<header class="srt-appbar">

    <div class="srt-boot-label"><span>Loading</span><span class="srt-boot-sys">//stats</span></div>

    <div class="srt-boot-micro">crunching training history</div>
  </div>

<script>
const DATA_URL = {{ data_url | tojson }};
const DAY_URL  = DATA_URL.replace(/\/data$/, "/day");
const MUSCLES_URL = DATA_URL.replace(/\/stats\/data$/, "/muscles");   // .../stats/data -> .../stats/day
const main = document.getElementById("main");
const errEl = document.getElementById("err");

// Session-type colours expressed as Sortie tokens so both themes work.
// Hue assignment matches SESSION_COLOURS in stats.py (the server palette the
// review page uses): push corp blue, pull ok green, legs accent amber,
// arms target magenta — one mapping everywhere.
const SPLIT_COLOURS = {
  push: "var(--corp)",
  pull: "var(--ok)",
  legs: "var(--accent)",
  arms: "var(--target)",
};

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}

// A labelled section: every panel starts with an eyebrow.
function panel(label) {
  const p = el("section", "srt-panel");
  p.appendChild(el("p", "srt-eyebrow", label));
  return p;
}

function card(n, label) {
  const c = el("div", "card");
  c.appendChild(el("div", "srt-numeral-lg", n == null ? "—" : Number(n).toLocaleString("en")));
  c.appendChild(el("p", "srt-eyebrow is-plain", label));
  return c;
}


// ── All-time muscle heat-map: brightness tracks total training volume ───────
function fmtRange(a, b) { return a === b ? a : a + " \u2192 " + b; }
function muscleListInto(box, muscle, data) {
  box.textContent = "";
  const d = data[muscle];
  box.appendChild(el("div", "mm-list-title",
    muscle.replace(/_/g, " ") + (d ? "  \u00b7  " + d.exercises.length + " exercises" : "")));
  if (!d) { box.appendChild(el("div", "mm-empty", "Never trained.")); return; }
  d.exercises.forEach(x => {
    const row = el("div", "mm-row");
    row.appendChild(el("span", "n", x.exercise));
    row.appendChild(el("span", "meta" + (x.role === "secondary" ? " sec" : ""),
      x.role + " \u00b7 " + x.sets + " sets \u00b7 " + fmtRange(x.first, x.last)));
    box.appendChild(row);
  });
}

function muscleHeatPanel() {
  const wrap = panel("Muscle coverage, all time");
  (async () => {
    let data = {};
    try {
      const r = await fetch(MUSCLES_URL);
      data = (await r.json()).muscles || {};
    } catch (e) {
      wrap.appendChild(el("p", "mm-empty", "Couldn\u2019t load muscle data."));
      return;
    }
    const heat = {};
    let max = 0;
    for (const [m, d] of Object.entries(data)) { heat[m] = d.score; max = Math.max(max, d.score); }
    const figs = el("div", "mm-figs");
    const list = el("div", "mm-list"); list.hidden = true;
    const pick = m => { list.hidden = false; muscleListInto(list, m, data); };
    figs.appendChild(muscleFigure("front", { heat, max, onPick: pick }));
    figs.appendChild(muscleFigure("back", { heat, max, onPick: pick }));
    wrap.appendChild(figs);
    wrap.appendChild(el("p", "mm-hint",
      "brightest = most trained \u00b7 tap a muscle for its exercises, oldest first"));
    wrap.appendChild(list);
  })();
  return wrap;
}

function balanceBars(balance, title) {
  const wrap = panel(title);
  const bars = el("div", "bars");
  const order = ["push", "pull", "legs", "arms"];
  const max = Math.max(1, ...Object.values(balance));
  const top = order.find(st => (balance[st] || 0) === max);   // one accent gauge
  for (const st of order) {
    const n = balance[st] || 0;
    const row = el("div", "bar-row");
    row.appendChild(el("div", "bar-label", st));
    const gauge = el("div", "srt-gauge" + (st === top ? " is-accent" : ""));
    gauge.style.setProperty("--srt-gauge", n / max);
    gauge.appendChild(el("div", "srt-gauge-fill"));
    row.appendChild(gauge);
    row.appendChild(el("div", "bar-n", n.toLocaleString("en")));
    bars.appendChild(row);
  }
  wrap.appendChild(bars);
  return wrap;
}

const SVGNS = "http://www.w3.org/2000/svg";

function pieChart(balance, colours, title) {
  const wrap = panel(title);
  const order = ["push", "pull", "legs", "arms"];
  const total = order.reduce((s, st) => s + (balance[st] || 0), 0);
  if (!total) { wrap.appendChild(el("p", "muted", "No sessions logged yet.")); return wrap; }

  const box = el("div", "pie-wrap");
  const R = 16, C = 18;                       // radius, centre (viewBox 36x36)
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 36 36");
  const arc = (cx, cy, r, a0, a1) => {
    const p = (a) => [cx + r * Math.cos((a - 90) * Math.PI / 180),
                      cy + r * Math.sin((a - 90) * Math.PI / 180)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z`;
  };
  let angle = 0;
  for (const st of order) {
    const n = balance[st] || 0;
    if (!n) continue;
    const sweep = 360 * n / total;
    let shape;
    if (n === total) {                        // single slice = full circle (arc degenerates)
      shape = document.createElementNS(SVGNS, "circle");
      shape.setAttribute("cx", C); shape.setAttribute("cy", C); shape.setAttribute("r", R);
    } else {
      shape = document.createElementNS(SVGNS, "path");
      shape.setAttribute("d", arc(C, C, R, angle, angle + sweep));
    }
    shape.setAttribute("stroke-width", "0.6");   // ground-colour separators between segments
    shape.setAttribute("style", `fill: ${colours[st]}; stroke: var(--bg-100)`);
    svg.appendChild(shape);
    angle += sweep;
  }
  // frame ring + hub with a centre readout
  svg.appendChild(svgEl("circle", { cx: C, cy: C, r: R + 0.5, "stroke-width": .4,
    "stroke-opacity": .6, style: "fill: none; stroke: var(--line-strong)" }));
  svg.appendChild(svgEl("circle", { cx: C, cy: C, r: 8, "stroke-width": .3,
    style: "fill: var(--bg-100); stroke: var(--line)" }));
  const cn = svgEl("text", { x: C, y: C - 0.2, "text-anchor": "middle", "font-size": 6,
    "font-weight": "600", style: "font-family: var(--font-display); fill: var(--ink)" });
  cn.textContent = total;
  svg.appendChild(cn);
  const cl = svgEl("text", { x: C, y: C + 4, "text-anchor": "middle", "font-size": 2.4,
    "letter-spacing": ".3", style: "font-family: var(--font-label); fill: var(--ink-muted)" });
  cl.textContent = "SESSIONS";
  svg.appendChild(cl);
  box.appendChild(svg);

  const leg = el("div", "pie-legend");
  for (const st of order) {
    const n = balance[st] || 0;
    const row = el("div", "row");
    const dot = el("span", "dot"); dot.style.background = colours[st];
    row.appendChild(dot);
    row.appendChild(el("span", "name", st));
    row.appendChild(el("span", "pct", `${n} · ${Math.round(100 * n / total)}%`));
    leg.appendChild(row);
  }
  box.appendChild(leg);
  wrap.appendChild(box);
  return wrap;
}

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const MONO = "var(--font-mono)";

function lineChart(series, colour, valKey = "e1rm", refLine = null, overlay = null) {
  // viewBox coords; CSS scales width. Plot on bg-100: gridlines at line,
  // left/bottom spines at line-strong, mono tick labels. No gradients, no glow.
  const W = 300, H = 120, padL = 34, padR = 12, padT = 12, padB = 18;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });

  const vals = series.map(p => p[valKey]);
  if (refLine != null) vals.push(refLine.value);          // ref line must fit the y-range
  if (overlay) for (const p of overlay.series) vals.push(p[valKey]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => padL + (W - padL - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const x0 = padL, x1 = W - padR, yB = H - padB;

  // gridlines
  for (let i = 0; i <= 4; i++) {
    const gy = padT + (yB - padT) * i / 4;
    svg.appendChild(svgEl("line", { x1: x0, y1: gy, x2: x1, y2: gy,
      "stroke-opacity": .35, style: "stroke: var(--line)" }));
  }
  for (let i = 0; i <= 6; i++) {
    const gx = x0 + (x1 - x0) * i / 6;
    svg.appendChild(svgEl("line", { x1: gx, y1: padT, x2: gx, y2: yB,
      "stroke-opacity": .2, style: "stroke: var(--line)" }));
  }
  // spines: left and bottom only
  svg.appendChild(svgEl("line", { x1: x0, y1: padT, x2: x0, y2: yB,
    style: "stroke: var(--line-strong)" }));
  svg.appendChild(svgEl("line", { x1: x0, y1: yB, x2: x1, y2: yB,
    style: "stroke: var(--line-strong)" }));
  // y tick labels at lo/hi (mono)
  for (const v of [lo + pad, hi - pad]) {
    const t = svgEl("text", { x: x0 - 4, y: y(v) + 3, "text-anchor": "end",
      "font-size": 8, style: `font-family: ${MONO}; fill: var(--ink-muted)` });
    t.textContent = Math.round(v); svg.appendChild(t);
  }

  const pts = series.map((p, i) => [x(i), y(p[valKey])]);

  // main trace — thin and faded when a smoothed overlay sits on top of it
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  svg.appendChild(svgEl("path", { d, "stroke-width": overlay ? 1 : 2,
    "stroke-opacity": overlay ? 0.35 : 1, "stroke-linejoin": "round",
    "stroke-linecap": "round", style: `fill: none; stroke: ${colour}` }));

  // square data markers — skip on dense/overlay series
  if (series.length <= 40 && !overlay) {
    for (const p of pts) {
      svg.appendChild(svgEl("rect", { x: p[0] - 1.5, y: p[1] - 1.5, width: 3, height: 3,
        style: `fill: ${colour}` }));
    }
  }
  // smoothed trend overlay — the one highlighted series on the chart
  if (overlay && overlay.series.length) {
    const d2 = overlay.series.map((p, i) => (i ? "L" : "M") + x(i) + " " + y(p[valKey])).join(" ");
    svg.appendChild(svgEl("path", { d: d2, "stroke-width": 2, "stroke-linejoin": "round",
      "stroke-linecap": "round", style: `fill: none; stroke: ${overlay.colour || colour}` }));
  }
  // reference line (dashed) + label, e.g. target bodyweight
  if (refLine != null) {
    const ry = y(refLine.value), rc = refLine.colour || colour;
    svg.appendChild(svgEl("line", { x1: x0, y1: ry, x2: x1, y2: ry,
      "stroke-width": 1.1, "stroke-dasharray": "3 3", style: `stroke: ${rc}` }));
    const t = svgEl("text", { x: x1, y: ry - 3, "text-anchor": "end", "font-size": 8,
      style: `font-family: ${MONO}; fill: ${rc}` });
    t.textContent = refLine.label; svg.appendChild(t);
  }
  // end-of-trace marker: a square at the latest reading
  const end = pts[pts.length - 1], ec = overlay ? (overlay.colour || colour) : colour;
  svg.appendChild(svgEl("rect", { x: end[0] - 2, y: end[1] - 2, width: 4, height: 4,
    style: `fill: ${ec}` }));

  // x labels: first + last date (YYYY-MM-DD -> MMM 'YY)
  const fmt = ds => new Date(ds).toLocaleString("en", { month: "short", year: "2-digit" });
  const first = svgEl("text", { x: x0, y: H - 5, "font-size": 8,
    style: `font-family: ${MONO}; fill: var(--ink-muted)` });
  first.textContent = fmt(series[0].date).toUpperCase();
  svg.appendChild(first);
  if (series.length > 1) {
    const last = svgEl("text", { x: x1, y: H - 5, "text-anchor": "end", "font-size": 8,
      style: `font-family: ${MONO}; fill: var(--ink-muted)` });
    last.textContent = fmt(series[series.length - 1].date).toUpperCase();
    svg.appendChild(last);
  }
  return svg;
}

function anchorChart(a) {
  const box = el("div", "chart");
  const head = el("div", "chart-head");
  head.appendChild(el("div", "chart-title", a.session_type + " · " + a.lift));
  if (a.series.length >= 2) {
    head.appendChild(el("div", "chart-sub",
      `latest ${a.latest_e1rm} kg · best ${a.best_e1rm} kg · ${a.sessions} sessions`));
  }
  box.appendChild(head);
  if (a.series.length >= 2) {
    box.appendChild(lineChart(a.series, "var(--ink)"));   // the chart's headline series
  } else {
    box.appendChild(el("div", "chart-sub",
      a.series.length === 1 ? "Only one logged session so far — need 2+ to chart a trend."
                            : "No logged sessions for this lift yet."));
  }
  return box;
}

const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
const DOW = ["M","T","W","T","F","S","S"];

// ── Click-a-day session detail ──────────────────────────────────────────────
function fmtKg(kg) {
  if (kg == null) return "—";
  const s = Math.round(kg).toLocaleString("en") + " kg";
  return kg >= 1000 ? s + " (" + (kg / 1000).toFixed(1) + " t)" : s;
}
function fmtDayDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

// Collapse consecutive identical sets into "N ×" chips.
function groupSets(sets, isBw) {
  const out = [];
  for (const s of sets || []) {
    const w = s.weight_kg || 0;
    const label = isBw ? (w > 0 ? "BW +" + w + " kg" : "BW") : (w > 0 ? w + " kg" : "—");
    const last = out[out.length - 1];
    if (last && last.reps === s.reps && last.label === label && last.warm === !!s.is_warmup) {
      last.count += 1;
    } else {
      out.push({ count: 1, reps: s.reps, label, warm: !!s.is_warmup });
    }
  }
  return out;
}

function dayStat(n, label) {
  const c = el("div", "day-stat");
  c.appendChild(el("div", "n", n));
  c.appendChild(el("div", "l", label));
  return c;
}

function dayExercise(ex, colours) {
  const box = el("div", "dex" + (ex.is_main_lift ? " main" : ""));
  const head = el("div", "dex-head");
  head.appendChild(el("span", "dex-name", ex.exercise_name));
  const meta = ex.volume_kg ? fmtKg(ex.volume_kg) : "";
  if (meta) head.appendChild(el("span", "dex-meta", meta + (ex.top_e1rm ? " · " + ex.top_e1rm + "kg e1RM" : "")));
  box.appendChild(head);
  const row = el("div", "dset-row");
  for (const g of groupSets(ex.sets, ex.is_bodyweight)) {
    const chip = el("div", "dset" + (g.warm ? " warm" : ""));
    const n = g.count > 1 ? g.count + " × " : "";
    chip.innerHTML = (g.warm ? "warm-up · " : "") + n + "<b>" + g.reps + "</b> × " + g.label;
    row.appendChild(chip);
  }
  box.appendChild(row);
  return box;
}

function closeModal(back) {
  back.classList.add("closing");                 // play the exit before removal
  document.removeEventListener("keydown", back._esc);
  setTimeout(() => back.remove(), 200);
}

function dayHeader(back, iso, detail, colours) {
  const head = el("div", "day-head");
  head.appendChild(el("div", "day-title", fmtDayDate(iso)));
  if (detail && detail.session_types && detail.session_types.length) {
    const chips = el("div", "day-chips");
    for (const st of detail.session_types) {
      const chip = el("span", "day-chip", st);
      chip.style.background = colours[st] || "var(--corp)";
      chips.appendChild(chip);
    }
    head.appendChild(chips);
  }
  const x = el("button", "modal-close", "✕"); x.type = "button";
  x.addEventListener("click", () => closeModal(back));
  head.appendChild(x);
  return head;
}

function renderDay(back, panelEl, iso, detail, colours) {
  panelEl.classList.add("srt-reveal");
  setTimeout(() => panelEl.classList.remove("srt-reveal"), 700);
  panelEl.textContent = "";
  panelEl.appendChild(dayHeader(back, iso, detail, colours));
  if (!detail) {
    panelEl.appendChild(el("p", "muted", "No workout logged on this day."));
    return;
  }
  const stats = el("div", "day-stats");
  const vol = detail.total_volume_kg;
  stats.appendChild(dayStat(vol == null ? "—" : Math.round(vol).toLocaleString("en"), "Volume, kg"));
  stats.appendChild(dayStat(detail.working_sets, "Working sets"));
  stats.appendChild(dayStat(detail.total_reps, "Total reps"));
  stats.appendChild(dayStat(detail.exercise_count, "Exercises"));
  if (detail.top_e1rm) stats.appendChild(dayStat(detail.top_e1rm, "Top e1RM, kg"));
  panelEl.appendChild(stats);

  if (detail.top_set) {
    // the one gold callout on this screen
    panelEl.appendChild(el("div", "day-topset",
      "Heaviest set — " + detail.top_set.weight_kg + " kg × " + detail.top_set.reps
      + " · " + detail.top_set.exercise));
  }
  for (const ex of detail.exercises) panelEl.appendChild(dayExercise(ex, colours));
}

async function openDay(iso, colours) {
  const back = el("div", "modal-back");
  const panelEl = el("div", "modal");
  back.appendChild(panelEl);
  panelEl.appendChild(el("div", "modal-load", "Loading " + iso + "…"));
  back.addEventListener("click", e => { if (e.target === back) closeModal(back); });
  back._esc = e => { if (e.key === "Escape") closeModal(back); };
  document.addEventListener("keydown", back._esc);
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add("open"));
  try {
    const r = await fetch(DAY_URL + "?date=" + encodeURIComponent(iso));
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    renderDay(back, panelEl, iso, d.detail, colours);
  } catch (e) {
    panelEl.textContent = "";
    panelEl.appendChild(dayHeader(back, iso, null, colours));
    panelEl.appendChild(el("p", "muted", "Couldn't load this day (" + e.message + ")."));
  }
}

function monthGrid(year, month, calendar, colours) {
  const wrap = el("div", "cal-month");
  wrap.appendChild(el("div", "cal-title", MONTHS[month] + " " + year));
  const grid = el("div", "cal-grid");
  for (const d of DOW) grid.appendChild(el("div", "cal-dow", d));
  const first = new Date(year, month, 1);
  let lead = (first.getDay() + 6) % 7; // Mon=0
  for (let i = 0; i < lead; i++) grid.appendChild(el("div", "cal-cell empty"));
  const days = new Date(year, month + 1, 0).getDate();
  const now = new Date();
  const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  for (let day = 1; day <= days; day++) {
    const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const st = calendar[iso];
    const isToday = iso === todayIso;
    const cell = el("div", "cal-cell" + (st ? " trained" : "") + (isToday ? " today" : ""), String(day));
    if (st) { cell.style.background = colours[st];
              cell.title = `${iso} — ${st} · tap for detail`;
              cell.addEventListener("click", () => openDay(iso, colours)); }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}

function render(data) {
  main.textContent = "";
  main.classList.add("srt-reveal");
  setTimeout(() => main.classList.remove("srt-reveal"), 700);
  const s = data.summary, colours = SPLIT_COLOURS;

  // headline readouts
  const over = panel("Overview");
  const cards = el("div", "cards");
  cards.appendChild(card(s.total_sessions, "Total sessions"));
  cards.appendChild(card(s.sessions_this_week, "This week"));
  cards.appendChild(card(s.sessions_this_month, "This month"));
  cards.appendChild(card(s.current_streak, "Day streak"));
  over.appendChild(cards);
  main.appendChild(over);

  // split legend (shared by the pie and the calendar)
  const legend = el("div", "legend");
  for (const st of ["push", "pull", "legs", "arms"]) {
    const sp = el("span");
    const dot = el("span", "dot"); dot.style.background = colours[st];
    sp.appendChild(dot); sp.appendChild(document.createTextNode(st));
    legend.appendChild(sp);
  }

  // balance
  main.appendChild(balanceBars(s.balance_28d, "Split balance, last 28 days"));

  main.appendChild(muscleHeatPanel());

  // anchor charts
  const anchors = panel("Anchor lift progress — e1RM, kg");
  if (!data.anchors.length) anchors.appendChild(el("p", "muted", "No anchor lifts configured."));
  for (const a of data.anchors) anchors.appendChild(anchorChart(a));
  main.appendChild(anchors);

  // bodyweight over time
  const bwPanel = panel("Bodyweight, kg");
  const bw = data.bodyweight || {};
  if (bw.series && bw.series.length >= 2) {
    const box = el("div", "chart");
    const head = el("div", "chart-head");
    let sub = `latest ${bw.latest} kg · ${bw.series.length} readings`;
    if (bw.rate_kg_per_week != null) {
      const r = bw.rate_kg_per_week;
      const sign = r > 0 ? "+" : (r < 0 ? "−" : "±");
      sub += ` · ${sign}${Math.abs(r)} kg/wk (${bw.rate_days}d)`;
    }
    if (bw.target != null) sub += ` · target ${bw.target} kg`;
    head.appendChild(el("div", "chart-sub", sub));
    box.appendChild(head);
    const ref = bw.target != null
      ? { value: bw.target, label: `target ${bw.target}kg`, colour: "var(--target)" } : null;
    const overlay = (bw.smoothed && bw.smoothed.length)
      ? { series: bw.smoothed, colour: "var(--accent)" } : null;   // the highlighted trend
    box.appendChild(lineChart(bw.series, "var(--ink)", "weight", ref, overlay));
    bwPanel.appendChild(box);
  } else {
    bwPanel.appendChild(el("p", "muted", "Weight tracker not connected."));
  }
  main.appendChild(bwPanel);

  // overall split pie (all-time), just before the calendar
  main.appendChild(pieChart(s.balance_all_time, colours, "Overall split balance, all time"));

  // calendar — current month back 3 (4 months total), newest first
  const cal = panel("Training calendar");
  cal.appendChild(legend);
  const now = new Date();
  for (let i = 0; i < 4; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    cal.appendChild(monthGrid(d.getFullYear(), d.getMonth(), data.calendar, colours));
  }
  main.appendChild(cal);
}

fetch(DATA_URL)
  .then(r => r.ok ? r.json() : Promise.reject(new Error("could not load stats")))
  .then(render)
  .catch(e => { main.textContent = ""; errEl.textContent = e.message; });
</script>
</body>
